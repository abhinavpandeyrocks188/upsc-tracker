<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UPSC Super Recall — Live Knowledge Synthesis</title>
<meta name="theme-color" content="#060a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UPSC Recall">
<link id="dynamicFavicon" rel="icon" type="image/png">
<link id="dynamicTouchIcon" rel="apple-touch-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050811;
  --bg-mesh: radial-gradient(at 15% 0%, rgba(29, 78, 216, 0.22) 0px, transparent 55%),
             radial-gradient(at 85% 10%, rgba(16, 185, 129, 0.14) 0px, transparent 50%),
             #050811;
  --surface: rgba(15, 23, 42, 0.88);
  --surface-elev: #131e36;
  --surface-glass: rgba(30, 41, 59, 0.55);
  --border: #243558;
  --border-glow: rgba(56, 189, 248, 0.45);
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-grad: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
  --gold: #f59e0b;
  --good: #10b981;
  --bad: #ef4444;
  --gs1: #f43f5e;
  --gs2: #38bdf8;
  --gs3: #10b981;
  --gs4: #c084fc;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-mesh);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.6;
  padding: 12px 14px 60px;
  min-height: 100vh;
}
.shell { max-width: 940px; margin: 0 auto; }

/* App Header */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  margin-bottom: 14px;
}
.brand-row { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  border: 1px solid #38bdf8;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #38bdf8; font-size: 1.1rem;
  box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
}
.brand-text h1 {
  font-size: 1.25rem; font-weight: 800; margin: 0;
  background: linear-gradient(90deg, #ffffff, #7dd3fc);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.02em;
}
.brand-text p { margin: 2px 0 0; font-size: 0.74rem; color: var(--muted); }

.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px; font-size: 0.73rem; font-weight: 700;
  background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); color: #34d399;
}
.status-chip.busy {
  background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.4); color: var(--accent);
}
.pulse {
  width: 7px; height: 7px; border-radius: 50%; background: currentColor;
  box-shadow: 0 0 8px currentColor; animation: blink 1.6s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.clock-chip {
  font-family: 'JetBrains Mono', monospace; font-size: 0.73rem; font-weight: 700;
  padding: 5px 10px; border-radius: 999px; background: var(--surface-elev);
  border: 1px solid var(--border); color: var(--gold);
}

/* Control Bar */
.toolbar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
}
.nav-tabs {
  display: flex; background: var(--surface); padding: 4px;
  border-radius: 11px; border: 1px solid var(--border);
}
.tab-btn {
  background: transparent; border: none; color: var(--muted);
  font-weight: 700; font-size: 0.8rem; padding: 7px 14px;
  border-radius: 8px; cursor: pointer; transition: 0.2s;
}
.tab-btn.active { background: var(--accent-grad); color: #fff; box-shadow: 0 3px 12px rgba(37, 99, 235, 0.4); }

.date-nav {
  display: flex; align-items: center; gap: 5px;
  background: var(--surface); padding: 4px 6px;
  border-radius: 11px; border: 1px solid var(--border);
}
.icon-btn {
  background: var(--surface-elev); border: 1px solid var(--border);
  color: var(--text); font-size: 0.74rem; font-weight: 700;
  padding: 5px 10px; border-radius: 7px; cursor: pointer;
}
.icon-btn:active { transform: scale(0.95); }
.date-label {
  font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
  font-weight: 700; padding: 0 6px; color: var(--accent);
}

/* Interactive Article Selector Strip */
.article-strip {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px;
}
.strip-pill {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; cursor: pointer;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.strip-pill.active {
  border-color: var(--accent); background: rgba(56, 189, 248, 0.1);
  box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
}
.strip-pill.done { border-color: var(--good); }
.strip-num { font-size: 0.68rem; font-weight: 800; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; }
.strip-title {
  font-size: 0.75rem; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px;
}
@media (max-width: 640px) {
  .strip-title { display: none; }
  .strip-pill { text-align: center; padding: 7px 4px; }
  .strip-num { justify-content: center; }
}

/* Main Stage Card */
.stage-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 22px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(12px); margin-bottom: 16px;
}
.meta-bar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
}
.badge-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gs-chip {
  font-family: 'JetBrains Mono', monospace; font-size: 0.74rem;
  font-weight: 800; padding: 4px 10px; border-radius: 6px;
}
.gs-chip.GS-1 { background: rgba(244, 63, 94, 0.16); color: #fda4af; border: 1px solid var(--gs1); }
.gs-chip.GS-2 { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid var(--gs2); }
.gs-chip.GS-3 { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid var(--gs3); }
.gs-chip.GS-4 { background: rgba(192, 132, 252, 0.16); color: #e9d5ff; border: 1px solid var(--gs4); }

.topic-chip {
  font-size: 0.72rem; font-weight: 700; padding: 4px 10px;
  border-radius: 6px; background: var(--surface-elev);
  border: 1px solid var(--border); color: #cbd5e1;
}
.mode-toggle {
  display: inline-flex; background: #070b14; padding: 3px;
  border-radius: 8px; border: 1px solid var(--border);
}
.mode-btn {
  background: transparent; border: none; color: var(--muted);
  font-size: 0.74rem; font-weight: 700; padding: 4px 11px;
  border-radius: 6px; cursor: pointer;
}
.mode-btn.active { background: var(--surface-elev); color: var(--accent); }

.headline {
  font-size: 1.28rem; font-weight: 800; line-height: 1.35;
  margin: 0 0 16px; color: #ffffff; letter-spacing: -0.01em;
}

/* Content Cards inside Stage */
.info-panel {
  background: var(--surface-elev); border: 1px solid var(--border);
  border-radius: 12px; padding: 15px 16px; margin-bottom: 14px;
}
.panel-header {
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}

/* Tailored Static Linkage Grid */
.static-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;
}
@media (max-width: 660px) { .static-grid { grid-template-columns: 1fr; } }

.static-node {
  background: rgba(8, 13, 26, 0.75); border: 1px solid #1e2f52;
  border-left: 3px solid var(--accent); border-radius: 9px; padding: 11px 13px;
}
.static-node.node-green { border-left-color: var(--good); }
.static-node.node-gold { border-left-color: var(--gold); }
.static-node.node-purple { border-left-color: var(--gs4); }

.node-label {
  font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.05em; color: #93c5fd; margin-bottom: 4px;
}
.node-text { font-size: 0.87rem; color: #e2e8f0; line-height: 1.5; }

/* Interactive Keyword Pills */
.kw-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.76rem; font-weight: 700; padding: 5px 11px;
  border-radius: 999px; margin: 3px 5px 3px 0;
  background: #15223f; border: 1px solid #2b457a; color: #93c5fd;
}
.kw-hit { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border-color: var(--good); }
.kw-miss { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border-color: var(--bad); }

/* 4-Peg Form */
.peg-box { margin-bottom: 12px; }
.peg-box label {
  display: block; font-size: 0.8rem; font-weight: 700;
  color: #93c5fd; margin-bottom: 5px;
}
.peg-input {
  width: 100%; background: #070b14; border: 1px solid var(--border);
  border-radius: 9px; padding: 11px 13px; color: var(--text);
  font-family: inherit; font-size: 0.9rem;
}
.peg-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
textarea.peg-input { min-height: 70px; resize: vertical; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.btn-main {
  background: var(--accent-grad); color: #ffffff;
  border: none; border-radius: 10px; padding: 12px 22px;
  font-size: 0.9rem; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
}
.btn-main:active { transform: scale(0.98); }
.btn-sub {
  background: var(--surface-elev); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 11px 16px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
}

.banner-alert {
  background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35);
  color: #7dd3fc; padding: 10px 14px; border-radius: 10px;
  font-size: 0.81rem; font-weight: 600; margin-bottom: 12px;
}
.deck-row {
  background: var(--surface-elev); border: 1px solid var(--border);
  border-left: 4px solid var(--accent); border-radius: 11px;
  padding: 14px 16px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap;
}
.src-link { color: var(--accent); text-decoration: none; font-size: 0.74rem; font-weight: 700; }
</style>
</head>
<body>

<div class="shell">
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-logo">⚖️</div>
      <div class="brand-text">
        <h1>UPSC Super Recall</h1>
        <p>Live Article-Specific Knowledge Engine • 1–7–21 Spaced System</p>
      </div>
    </div>
    <div class="header-right">
      <div class="status-chip busy" id="statusChip">
        <span class="pulse"></span>
        <span id="statusLabel">Synthesizing Live Batch...</span>
      </div>
      <button class="icon-btn" data-action="force-sync" title="Re-fetch live newspapers & rebuild static linkages">🔄 Live Sync</button>
      <div class="clock-chip" id="timerDisplay">00:00:00</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabStudy" data-action="tab-study">Daily Recall (5)</button>
      <button class="tab-btn" id="tabDeck" data-action="tab-deck">Spaced Deck (<span id="deckBadge">0</span>)</button>
    </div>
    <div class="date-nav">
      <button class="icon-btn" data-action="prev-day">◀ Prev</button>
      <span class="date-label" id="dateLabel">--</span>
      <button class="icon-btn" data-action="today-day">Today</button>
      <button class="icon-btn" data-action="next-day">Next ▶</button>
    </div>
  </div>

  <div id="bannerSlot"></div>

  <div id="studyView">
    <div class="article-strip" id="articleStrip"></div>
    <div id="stageMount"></div>
  </div>

  <div id="deckView" style="display:none;">
    <div class="stage-card">
      <div class="meta-bar">
        <h3 style="margin:0;font-size:1.1rem">Your Stored Attempts & 1–7–21 Spaced Queue</h3>
        <button class="icon-btn" data-action="export-deck">Export JSON</button>
      </div>
      <p style="color:var(--muted);font-size:0.84rem;margin:0 0 14px;">
        Every completed article is saved with your written notes, recall accuracy, and next active recall date.
      </p>
      <div id="deckMount"></div>
    </div>
  </div>
</div>

<script>
(function() {
  // 0. GENERATE CUSTOM HIGH-RES APP ICON BADGE FOR PHONE HOMESCREEN (Canvas -> PNG + Web Manifest)
  function setupCustomHomescreenBadge() {
    try {
      const canvas = document.createElement("canvas");
      canvas.width = 192;
      canvas.height = 192;
      const ctx = canvas.getContext("2d");

      // Deep Navy Gradient Background
      const grad = ctx.createLinearGradient(0, 0, 192, 192);
      grad.addColorStop(0, "#091326");
      grad.addColorStop(1, "#1e3a8a");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(0, 0, 192, 192, 42);
      ctx.fill();

      // Gold Dharma / Ashoka Ring
      ctx.strokeStyle = "#f59e0b";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(96, 82, 42, 0, Math.PI * 2);
      ctx.stroke();

      // 24 Spokes effect
      ctx.lineWidth = 2;
      for (let i = 0; i < 12; i++) {
        const angle = (i * Math.PI) / 6;
        ctx.beginPath();
        ctx.moveTo(96 + Math.cos(angle) * 12, 82 + Math.sin(angle) * 12);
        ctx.lineTo(96 + Math.cos(angle) * 40, 82 + Math.sin(angle) * 40);
        ctx.stroke();
      }

      // Typography "UPSC"
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 34px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("UPSC", 96, 162);

      const iconUrl = canvas.toDataURL("image/png");
      document.getElementById("dynamicFavicon").href = iconUrl;
      document.getElementById("dynamicTouchIcon").href = iconUrl;

      const manifest = {
        name: "UPSC Super Recall",
        short_name: "UPSC Recall",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#050811",
        theme_color: "#050811",
        icons: [{ src: iconUrl, sizes: "192x192", type: "image/png" }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(link);
    } catch (e) {}
  }
  setupCustomHomescreenBadge();

  // 1. GRANULAR MICRO-TOPIC KNOWLEDGE GRAPH (25+ Distinct Sub-Topics so articles don't repeat generic notes)
  const MICRO_TOPICS = [
    {
      id: "pol_gov_assent",
      paper: "GS-2",
      topic: "State Legislature & Governor (Art 200)",
      match: ["governor", "assent", "article 200", "bill", "raj bhavan", "chancellor", "president assent"],
      provisions: "Article 200 (Options before Governor on State Bills), Article 201 (Bills reserved for President), Article 163 (Aid and Advice of Council of Ministers).",
      precedents: "Shamsher Singh v. State of Punjab (1974), Nabam Rebia (2016), and State of Punjab v. Principal Secretary to Governor (2023 SC ruling: Governor cannot exercise pocket veto if he withholds assent, must return bill 'as soon as possible').",
      prelimsTrap: "Trap: The Governor CANNOT return a Money Bill for reconsideration under Article 200. However, if an ordinary bill is repassed by the State Assembly with or without amendments, the Governor MUST grant assent.",
      mainsWayForward: "Implement Sarkaria (1988) and Punchhi Commission (2010) recommendations by codifying a binding 3-to-6 month timeline for gubernatorial disposal of bills."
    },
    {
      id: "pol_judiciary_collegium",
      paper: "GS-2",
      topic: "Judiciary, Collegium & Bail Jurisprudence",
      match: ["supreme court", "high court", "collegium", "chief justice", "cji", "judge", "bail", "bnss", "bns", "remission", "undertrial", "contempt", "tribunal"],
      provisions: "Articles 124 & 217 (Appointment of SC/HC Judges), Article 142 (Complete Justice), Article 21 (Speedy Trial & Personal Liberty), Section 479 BNSS (Bail for undertrials).",
      precedents: "Three Judges Cases (1981, 1993, 1998), NJAC Judgment (99th Amendment struck down, 2015), Satender Kumar Antil (2022: 'Bail is rule, jail is exception'), Bilkis Bano (2024: Remission requires trial state concurrence).",
      prelimsTrap: "Trap: The term 'Collegium' is NOT mentioned anywhere in the original Constitution or any Constitutional Amendment; it evolved purely through Supreme Court judicial interpretation.",
      mainsWayForward: "Harmonize judicial independence with transparency by finalizing a revised Memorandum of Procedure (MoP) and instituting a permanent Statutory Bail Reform Framework."
    },
    {
      id: "pol_elections_antidefection",
      paper: "GS-2",
      topic: "Electoral Reforms, ECI & Anti-Defection",
      match: ["election", "eci", "voter", "evm", "vvpat", "delimitation", "census", "defection", "speaker", "tenth schedule", "disqualification", "simultaneous", "one nation"],
      provisions: "Article 324 (Election Commission), Articles 82 & 170 (Delimitation readjustment), 84th Amendment Act 2001, 10th Schedule (52nd & 91st Amendments).",
      precedents: "Anoop Baranwal v. Union of India (2023) & CEC Act 2023 (Selection Panel: PM, Leader of Opposition, Union Cabinet Minister); Kihoto Hollohan (1992: Speaker's decision under 10th Schedule is subject to judicial review).",
      prelimsTrap: "Trap: Under the CEC and Other Election Commissioners Act 2023, the Chief Justice of India is no longer on the selection panel, and service conditions are now equivalent to a Cabinet Secretary.",
      mainsWayForward: "Transfer 10th Schedule disqualification adjudication from the partisan office of the Speaker to an independent tribunal or the President/Governor acting on binding ECI advice."
    },
    {
      id: "pol_federal_agencies",
      paper: "GS-2",
      topic: "Federalism, CBI/ED & Fifth/Sixth Schedules",
      match: ["cbi", "ed", "enforcement directorate", "pmla", "federal", "sixth schedule", "fifth schedule", "ladakh", "autonomous", "inter-state", "panchayat", "municipal"],
      provisions: "Delhi Special Police Establishment (DSPE) Act 1946 (Section 6: General Consent of States for CBI), Article 244 (5th & 6th Schedules), 73rd & 74th Amendments (Articles 243G, 243I).",
      precedents: "Vineet Narain v. Union of India (1997: Fixed 2-year tenure for CBI Director), Vijay Madanlal Choudhary (2022: PMLA powers upheld, currently under review), S.R. Bommai (1994: Federalism is Basic Structure).",
      prelimsTrap: "Trap: The Sixth Schedule applies ONLY to four states (Assam, Meghalaya, Tripura, Mizoram — 'AMTM'), creating Autonomous District Councils with legislative and judicial powers.",
      mainsWayForward: "Enact a standalone statutory charter for federal investigative agencies with parliamentary oversight, and devolve untied funds to 3rd-tier local bodies via timely State Finance Commissions."
    },
    {
      id: "ir_neighbourhood_maritime",
      paper: "GS-2",
      topic: "Neighbourhood First, Border & Maritime Security",
      match: ["china", "lac", "pakistan", "bangladesh", "maldives", "sri lanka", "nepal", "myanmar", "bhutan", "indian ocean", "unclos", "chabahar", "imec", "border", "indo-pacific"],
      provisions: "Article 51 (DPSP: Promotion of international peace), UNCLOS 1982 (12 NM Territorial Sea, 200 NM EEZ), Kaladan Multimodal Project, Indus Waters Treaty (1960).",
      precedents: "Gujral Doctrine (Non-reciprocity with smaller neighbours), Mission SAGAR (Security and Growth for All in the Region), Colombo Security Conclave.",
      prelimsTrap: "Trap: Under UNCLOS, foreign military vessels enjoy 'innocent passage' through Territorial Waters (up to 12 NM), while coastal states hold sovereign rights only over economic resources (not full sovereignty) in the 200 NM EEZ.",
      mainsWayForward: "Shift from reactive counter-balancing to fast-tracked cross-border energy grids, digital public infrastructure (UPI) integration, and resilient regional supply chains."
    },
    {
      id: "ir_multilateral_trade",
      paper: "GS-2",
      topic: "Multilateral Groupings, Global South & Geopolitics",
      match: ["unsc", "united nations", "brics", "quad", "g20", "sco", "asean", "nato", "russia", "ukraine", "israel", "iran", "west asia", "usa", "tariff", "sanction", "wto", "fta"],
      provisions: "WTO Agreement on Agriculture (Amber, Blue, Green Box subsidies & Peace Clause invoked by India at Bali Ministerial), G4 UNSC Reform Proposal, New Development Bank (NDB).",
      precedents: "Delhi Declaration (G20 African Union inclusion), Voice of Global South Summits, De-hyphenated Strategic Autonomy doctrine.",
      prelimsTrap: "Trap: India is a member of SCO, BRICS, QUAD, and I2U2, but is NOT a member of APEC (Asia-Pacific Economic Cooperation) or the RCEP trade bloc.",
      mainsWayForward: "Leverage minilateral coalitions for critical mineral security while championing reform of Bretton Woods institutions and WTO appellate dispute mechanisms."
    },
    {
      id: "eco_monetary_banking",
      paper: "GS-3",
      topic: "Monetary Policy, RBI, Inflation & Banking",
      match: ["rbi", "repo", "inflation", "cpi", "wpi", "mpc", "bank", "npa", "rupee", "forex", "cbdc", "upi", "fintech", "credit", "interest rate", "liquidity"],
      provisions: "Section 45ZB of RBI Act 1934 (6-member Monetary Policy Committee), Flexible Inflation Targeting (FIT: 4% +/- 2% band), Insolvency and Bankruptcy Code (IBC) 2016.",
      precedents: "Urjit Patel Committee (2014: Recommended CPI as nominal anchor and 6-member MPC), Nachiket Mor & P.J. Nayak Committees on banking governance.",
      prelimsTrap: "Trap: The Consumer Price Index (Combined) is compiled and released monthly by the National Statistical Office (NSO) under MoSPI, NOT by the Reserve Bank of India.",
      mainsWayForward: "Coordinate monetary disinflation with supply-side food buffer management to insulate headline CPI from recurring climate-induced vegetable price shocks."

  // 2. STRICT STOPWORDS (Blocks interrogatives like "why", "how", verbs, and common filler words)
  const STOPWORDS = new Set([
    "why","how","what","when","where","who","whom","whose","which","while","whether","because","since","until","unless",
    "the","and","for","that","with","from","this","have","has","had","were","was","are","will","would","could","should",
    "about","into","over","after","before","under","between","through","during","without","within","along","following",

    "says","also","more","most","other","some","such","than","then","them","they","their","there","these","those","year",
    "years","time","today","week","month","report","reports","news","explained","hindu","express","first","second","three",
    "four","five","many","much","very","been","being","make","made","does","did","can","not","due","take","takes","took",
    "per","cent","percent","crore","lakh","amid","over","after","amidst","know","here","all","you","need","new","high","low",

  ]);

  // 3. REAL-TIME WIKIPEDIA KNOWLEDGE GRAPH ENRICHER (Fetches actual institutional/statutory facts per article)
  async function fetchWikipediaConceptFact(queryTerm) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 2200);
      const searchUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(queryTerm)}`;
      const res = await fetch(searchUrl, { signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) return null;
      const data = await res.json();
      if (data && data.extract && data.extract.length > 50 && data.type === "standard") {
        // Take first 2 crisp factual sentences
        const sents = data.extract.split(/(?<=[.?!])\s+/).slice(0, 2).join(" ");
        return sents.length > 260 ? sents.slice(0, 260) + "..." : sents;
      }
    } catch (e) {}
    return null;
  }

  // 4. INTELLIGENT PER-ARTICLE ARTICULATOR
  async function synthesizeArticleCard(rawItem, index) {
    const rawTitle = (rawItem.title || "National Policy Update")
      .replace(/ - The Hindu| - Indian Express| \| Explained News| \| India News/gi, "")
      .trim();

    const cleanBody = (rawItem.content || rawItem.description || "")
      .replace(/<[^>]+>/g, " ")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\s+/g, " ")
      .trim();

    const fullText = rawTitle + ". " + cleanBody;
    const lowerText = fullText.toLowerCase();

    // A. Match the most specific Micro-Topic (out of 12 distinct specialized templates)
    let matchedTopic = MICRO_TOPICS[index % MICRO_TOPICS.length];
    let bestScore = -1;
    for (let i = 0; i < MICRO_TOPICS.length; i++) {
      const mt = MICRO_TOPICS[i];
      let score = 0;
      for (let j = 0; j < mt.match.length; j++) {
        const kw = mt.match[j];
        if (lowerText.includes(kw)) {
          score += (rawTitle.toLowerCase().includes(kw) ? 6 : 2);
        }
      }
      if (score > bestScore) {
        bestScore = score;
        matchedTopic = mt;
      }
    }

    // B. Extract high-value UPSC Entities & Keywords specific to THIS article
    const keywords = [];
    const pushKw = (candidate) => {
      if (!candidate) return;
      const cleaned = candidate
        .replace(/^['"“”‘’([{\s]+|['"“”‘’)\]}.,;:!?\s]+$/g, "")
        .replace(/'s$/i, "")
        .trim();
      const low = cleaned.toLowerCase();
      if (cleaned.length < 3 || STOPWORDS.has(low) || /^\d+$/.test(cleaned)) return;
      if (!keywords.some(k => k.toLowerCase() === low)) {
        keywords.push(cleaned);
      }
    };

    // 1. Extract explicit Constitutional Articles, Sections, Acts, Commissions, Amendments
    const legalMatches = fullText.match(/\b(Article\s+\d+[A-Z]?|Section\s+\d+[A-Z]?|\d+(?:st|nd|rd|th)\s+Amendment|[A-Z][a-zA-Z]+\s+(?:Act|Commission|Committee|Treaty|Protocol|Mission|Scheme|Board|Council|Tribunal))\b/g) || [];
    legalMatches.forEach(m => pushKw(m));

    // 2. Extract multi-word Proper Entities from the headline (e.g., "Supreme Court", "Reserve Bank", "Great Indian Bustard")
    const properPhrases = rawTitle.match(/\b([A-Z][a-z]{2,}(?:\s+[A-Z][a-z]{2,})+)\b/g) || [];
    properPhrases.forEach(p => {
      const words = p.split(/\s+/);
      if (!words.some(w => STOPWORDS.has(w.toLowerCase()))) {
        pushKw(p);
      }
    });

    // 3. Extract uppercase Acronyms (e.g., ISRO, UNCLOS, NATO, BRICS, NFSA, PMLA, BNSS)
    const acronyms = fullText.match(/\b[A-Z]{3,7}\b/g) || [];
    acronyms.forEach(ac => {
      if (!["NEWS","LIVE","SAID","ALSO","FROM","WITH","THAT","THIS"].includes(ac)) {
        pushKw(ac);
      }
    });

    // 4. Extract single Proper Nouns from Headline (excluding first word if it's an interrogative)
    const headlineTokens = rawTitle.split(/\s+/);
    headlineTokens.forEach((tok, tIdx) => {
      const cleanTok = tok.replace(/[^a-zA-Z0-9-]/g, "");
      if (tIdx === 0 && STOPWORDS.has(cleanTok.toLowerCase())) return;
      if (/^[A-Z][a-zA-Z-]{3,}$/.test(cleanTok)) {
        pushKw(cleanTok);
      }
    });

    // 5. Supplement from micro-topic provisions if fewer than 5 keywords found
    const backupTerms = matchedTopic.provisions.match(/\b(Article\s+\d+[A-Z]?|[A-Z][a-zA-Z]+\s+Act|\d+th\s+Amendment|[A-Z]{3,6})\b/g) || ["Constitutionalism", "Judicial Review", "Federalism"];
    let bIdx = 0;
    while (keywords.length < 5 && bIdx < backupTerms.length) {
      pushKw(backupTerms[bIdx++]);
    }
    const finalKeywords = keywords.slice(0, 6);

    // C. Fetch Live Wikipedia Knowledge Fact for the primary entity in this article
    let wikiFact = null;
    const primaryQuery = finalKeywords[0] || matchedTopic.topic;
    wikiFact = await fetchWikipediaConceptFact(primaryQuery);
    if (!wikiFact && finalKeywords[1]) {
      wikiFact = await fetchWikipediaConceptFact(finalKeywords[1]);
    }

    // D. Extract clean news context sentences
    const sentences = cleanBody
      .split(/(?<=[.?!])\s+/)
      .map(s => s.trim())
      .filter(s => s.length > 35 && s.length < 300);

    const contextSummary = sentences.length >= 2
      ? sentences.slice(0, 2).join(" ")
      : (cleanBody.length > 30 ? cleanBody.slice(0, 320) + "..." : rawTitle);

    const entityBackground = wikiFact
      ? `${primaryQuery}: ${wikiFact}`
      : `In the context of "${rawTitle}", examine the statutory mandate, institutional composition, and operational jurisdiction of ${finalKeywords.slice(0, 2).join(" & ")}.`;

    return {
      id: "art_" + Date.now() + "_" + index,
      title: rawTitle,
      source: rawItem.sourceName || "Live National Feed",
      link: rawItem.link || "",
      paper: matchedTopic.paper,
      subtopic: matchedTopic.topic,
      keywords: finalKeywords,
      context: contextSummary,
      staticNodes: {
        conceptNote: entityBackground,
        provisions: matchedTopic.provisions,
        precedents: matchedTopic.precedents,
        prelimsTrap: matchedTopic.prelimsTrap
      },
      prelims: [
        matchedTopic.prelimsTrap,
        `Entity Fact-Check (${finalKeywords[0]}): ${entityBackground}`
      ],
      anchors: [
        `Concept & Background: ${entityBackground}`,
        `Constitutional & Statutory Pegs: ${matchedTopic.provisions}`,
        `Landmark Precedents & Committees: ${matchedTopic.precedents}`
      ],
      mains: {
        intro: `The unfolding developments around "${rawTitle.slice(0, 75)}${rawTitle.length > 75 ? "..." : ""}" underscore critical institutional questions within ${matchedTopic.topic}.`,
        keywords: [finalKeywords[0], finalKeywords[1] || matchedTopic.paper, matchedTopic.topic.split("&")[0].trim()],
        wayForward: matchedTopic.mainsWayForward
      }
    };
  }

  // 5. MULTI-SOURCE LIVE RSS PIPELINE
  const RSS_SOURCES = [
    { name: "Indian Express Explained", url: "https://indianexpress.com/section/explained/feed/" },
    { name: "The Hindu National", url: "https://www.thehindu.com/news/national/feeder/default.rss" },
    { name: "The Hindu Editorial", url: "https://www.thehindu.com/opinion/editorial/feeder/default.rss" }
  ];

  async function fetchRssSource(src) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    const url = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(src.url);
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error("RSS status " + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.items)) throw new Error("Invalid RSS");
    return data.items.map(it => ({
      title: it.title || "",
      description: it.description || "",
      content: it.content || "",
      link: it.link || "",
      sourceName: src.name
    }));
  }

  async function buildLiveDailyBatch() {
    let rawItems = [];
    for (let i = 0; i < RSS_SOURCES.length; i++) {
      try {
        const list = await fetchRssSource(RSS_SOURCES[i]);
        rawItems = rawItems.concat(list.slice(0, 4));
      } catch (e) {}
      if (rawItems.length >= 8) break;
    }

    if (rawItems.length === 0) throw new Error("Offline");

    const seen = new Set();
    const cleanList = rawItems.filter(it => {
      const t = (it.title || "").toLowerCase();
      if (t.length < 20) return false;
      if (/cricket|ipl|football|tennis|bollywood|movie|horoscope|wordle|quiz|lottery/.test(t)) return false;
      const key = t.slice(0, 32);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    const chosen = (cleanList.length >= 5 ? cleanList : rawItems).slice(0, 5);
    // Synthesize all 5 articles in parallel (takes ~1.2 seconds total)
    return await Promise.all(chosen.map((item, idx) => synthesizeArticleCard(item, idx)));
  }

  // 6. OFFLINE BACKUP (Only used if internet is completely unreachable)

      staticNodes: {

        provisions: mt.provisions,

      ],

        wayForward: mt.mainsWayForward
      }
    }));
  }

  // 7. STATE & STORAGE MANAGEMENT

  function getRealTodayStr() {
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
  }

  function getSelectedDateStr() {
    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function addDaysStr(baseStr, days) {
    const p = baseStr.split("-").map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    d.setDate(d.getDate() + days);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function getDeck() {

  async function loadBatchForDate(forceRefresh = false) {
    const selDate = getSelectedDateStr();
    const realToday = getRealTodayStr();
    const dateLbl = document.getElementById("dateLabel");
    const bannerSlot = document.getElementById("bannerSlot");
    const stageMount = document.getElementById("stageMount");

    if (dateLbl) dateLbl.textContent = selDate + (dayOffset === 0 ? " (Today)" : "");

    let cacheDateKey = selDate;
    if (selDate > realToday) {
      cacheDateKey = realToday;
      bannerSlot.innerHTML = `<div class="banner-alert">⚡ Future Date Selected (${selDate}) — Displaying Latest Live UPSC Synthesis (${realToday})</div>`;
    } else if (selDate < realToday) {
      bannerSlot.innerHTML = `<div class="banner-alert">📅 Historical Archive (${selDate}) — Showing Stored Batch & Your Past Attempts</div>`;
    } else {
      bannerSlot.innerHTML = "";
    }

    if (!forceRefresh) {
      const cached = localStorage.getItem(ARCHIVE_PREFIX + cacheDateKey);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length >= 1) {
            dailyBatch = parsed;
            setStatus(false, "Live Knowledge: Ready");
            restoreCurrentAttempt();
            renderScreen();
            return;
          }

    setStatus(true, "Synthesizing Live Batch (~1.5s)...");
    if (stageMount) {

    try {
      const synthesized = await buildLiveDailyBatch();

      dailyBatch = getOfflineBackupBatch();

      lastMisses = att.misses || [];

      recallInputs = { p1: "", p2: "", p3: "", p4: "" };

              <span class="gs-chip ${art.paper}">${art.paper}</span>
              <span class="topic-chip">📌 ${escapeHtml(art.subtopic)}</span>
              <span class="topic-chip">📰 ${escapeHtml(art.source)}</span>
            </div>
            <div class="mode-toggle">
              <button class="mode-btn ${activeMode === 'mains' ? 'active' : ''}" data-action="set-mains">4-Pillar Static View</button>
              <button class="mode-btn ${activeMode === 'prelims' ? 'active' : ''}" data-action="set-prelims">Prelims Traps</button>
            </div>
          </div>

          <h2 class="headline">${escapeHtml(art.title)}</h2>

          <div class="info-panel">
            <div class="panel-header">
              <span>What Happened in News Today</span>
              ${art.link ? `<a class="src-link" href="${escapeHtml(art.link)}" target="_blank" rel="noopener">Full Article ↗</a>` : ""}
            </div>
            <div style="font-size:0.93rem;color:#e2e8f0;">${escapeHtml(art.context)}</div>
          </div>

          ${activeMode === "prelims" ? `
            <div class="info-panel" style="border-color:var(--gold);">
              <div class="panel-header" style="color:var(--gold);">⚡ High-Probability Prelims Trap & Fact Check</div>
              <div style="font-size:0.92rem;margin-bottom:10px;color:#fef3c7;">${escapeHtml(nodes.prelimsTrap)}</div>
              <div style="font-size:0.88rem;color:#cbd5e1;border-top:1px solid var(--border);padding-top:8px;">
                <strong>Entity Background:</strong> ${escapeHtml(nodes.conceptNote)}
              </div>
            </div>
          ` : `
            <div class="info-panel">
              <div class="panel-header" style="color:var(--accent);">
                <span>Article-Specific UPSC Static Linkages (${escapeHtml(art.subtopic)})</span>
              </div>
              <div class="static-grid">
                <div class="static-node">
                  <div class="node-label">1. Live Concept & Entity Dossier</div>
                  <div class="node-text">${escapeHtml(nodes.conceptNote)}</div>
                </div>
                <div class="static-node node-green">
                  <div class="node-label" style="color:#6ee7b7;">2. Constitutional & Statutory Pegs</div>
                  <div class="node-text">${escapeHtml(nodes.provisions)}</div>
                </div>
                <div class="static-node node-purple">
                  <div class="node-label" style="color:#d8b4fe;">3. SC Judgments & Committees</div>
                  <div class="node-text">${escapeHtml(nodes.precedents)}</div>
                </div>
                <div class="static-node node-gold">
                  <div class="node-label" style="color:#fcd34d;">4. Prelims Examiner Trap</div>
                  <div class="node-text">${escapeHtml(nodes.prelimsTrap)}</div>
                </div>
              </div>
            </div>
          `}

          <div class="info-panel" style="background:#080f1f;">
            <div class="panel-header">
              <span>Article-Specific Recall Keywords (${art.keywords.length})</span>
              ${saved ? `<span style="color:var(--good);">✓ Attempt Logged (${saved.hits.length}/${art.keywords.length})</span>` : ""}
            </div>
            <div>
              ${art.keywords.map(k => `<span class="kw-pill">🔑 ${escapeHtml(k)}</span>`).join("")}
            </div>
          </div>

          <div class="btn-row">
            <button class="btn-main" data-action="start-recall">Start 4-Peg Active Recall → (Hide Notes)</button>
            <button class="btn-sub" data-action="skip-next">Next Article →</button>
          </div>
        </div>
      `;
    } else if (stage === "recall") {
      mount.innerHTML = `
        <div class="stage-card">
          <div class="meta-bar">
            <div class="badge-row">
              <span class="gs-chip ${art.paper}">${art.paper}</span>
              <span class="topic-chip">Step 2 • Active Recall Test</span>
            </div>
          </div>

          <h2 class="headline">${escapeHtml(art.title)}</h2>
          <p style="color:var(--muted);font-size:0.86rem;margin:0 0 14px;">
            Static notes are hidden! Reconstruct the 4 static pillars and include the article's target keywords from memory.
          </p>

          <div class="peg-box">
            <label>Peg 1: Constitutional Articles / Acts / Statutory Bodies</label>
            <input class="peg-input" id="inp1" placeholder="e.g., Article 200, Section 45ZB RBI Act, 10th Schedule..." value="${escapeHtml(recallInputs.p1)}">
          </div>

          <div class="peg-box">
            <label>Peg 2: Supreme Court Cases / Committees / Doctrines</label>
            <input class="peg-input" id="inp2" placeholder="e.g., Shamsher Singh, Sarkaria Commission, Puttaswamy..." value="${escapeHtml(recallInputs.p2)}">
          </div>

          <div class="peg-box">
            <label>Peg 3: Prelims Trap / Core Entity Facts</label>
            <input class="peg-input" id="inp3" placeholder="Write the Prelims distinction or key entity fact..." value="${escapeHtml(recallInputs.p3)}">
          </div>

          <div class="peg-box">
            <label>Peg 4: Mains Way Forward & Value Keywords</label>
            <textarea class="peg-input" id="inp4" placeholder="Synthesize your 1-line way forward...">${escapeHtml(recallInputs.p4)}</textarea>
          </div>

          <div class="btn-row">
            <button class="btn-main" data-action="submit-recall">Evaluate & Save My Recall →</button>
            <button class="btn-sub" data-action="back-study">◀ Peek at Static Linkages</button>
          </div>
        </div>
      `;
    } else if (stage === "diff") {
      mount.innerHTML = `
        <div class="stage-card">
          <div class="meta-bar">
            <div class="badge-row">
              <span class="gs-chip ${art.paper}">${art.paper}</span>
              <span class="topic-chip">Step 3 • Automated Gap Analysis</span>
            </div>
          </div>

          <h2 class="headline">${escapeHtml(art.title)}</h2>

          <div class="info-panel">
            <div class="panel-header">Keyword Recall Score (${lastHits.length} / ${art.keywords.length} Matched)</div>
            <div>
              ${lastHits.map(k => `<span class="kw-pill kw-hit">✓ Recalled: ${escapeHtml(k)}</span>`).join("")}
              ${lastMisses.map(k => `<span class="kw-pill kw-miss">✗ Missed: ${escapeHtml(k)}</span>`).join("")}
            </div>
          </div>

          <div class="static-grid">
            <div class="info-panel" style="margin:0;">
              <div class="panel-header" style="color:var(--accent);">What You Recalled</div>
              <div style="font-size:0.86rem;line-height:1.6;">
                <strong>Articles/Acts:</strong> ${escapeHtml(recallInputs.p1) || "<em>Blank</em>"}<br>
                <strong>Cases/Committees:</strong> ${escapeHtml(recallInputs.p2) || "<em>Blank</em>"}<br>
                <strong>Prelims Fact:</strong> ${escapeHtml(recallInputs.p3) || "<em>Blank</em>"}<br>
                <strong>Way Forward:</strong> ${escapeHtml(recallInputs.p4) || "<em>Blank</em>"}
              </div>
            </div>
            <div class="info-panel" style="margin:0;">
              <div class="panel-header" style="color:var(--good);">Target Static Linkages</div>
              <div style="font-size:0.84rem;line-height:1.55;">
                <strong>Provisions:</strong> ${escapeHtml(nodes.provisions)}<br><br>
                <strong>Precedents:</strong> ${escapeHtml(nodes.precedents)}
              </div>
            </div>
          </div>

          <div class="btn-row">
            <button class="btn-main" data-action="go-summary">Open Mains Answer Snippet & Lock →</button>
          </div>
        </div>
      `;
    } else if (stage === "summary") {
      const interval = lastMisses.length <= 2 ? 21 : (lastMisses.length <= 4 ? 7 : 1);
      const dueStr = addDaysStr(getRealTodayStr(), interval);
      mount.innerHTML = `
        <div class="stage-card">
          <div class="meta-bar">
            <div class="badge-row">
              <span class="gs-chip ${art.paper}">${art.paper}</span>
              <span class="topic-chip">Step 4 • Mains Ready Snippet</span>
            </div>
          </div>

          <h2 class="headline">${escapeHtml(art.title)}</h2>

          <div class="info-panel" style="border-color:#2563eb;background:#091326;">
            <div class="panel-header" style="color:var(--accent);">Mains Answer-Writing Framework (${art.paper})</div>
            <div style="font-size:0.9rem;margin-bottom:8px;"><strong>Introduction:</strong> ${escapeHtml(art.mains.intro)}</div>
            <div style="font-size:0.9rem;margin-bottom:8px;"><strong>Anchor Keywords:</strong> ${art.mains.keywords.map(escapeHtml).join(" • ")}</div>
            <div style="font-size:0.9rem;"><strong>Way Forward:</strong> ${escapeHtml(art.mains.wayForward)}</div>
          </div>

          <div class="info-panel" style="background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.35);">
            <div style="font-size:0.86rem;color:#6ee7b7;">
              ✅ <strong>Attempt Logged:</strong> Queued for <strong>Day ${interval} Spaced Recall</strong> on <strong>${dueStr}</strong>.
            </div>
          </div>

          <div class="btn-row">
            <button class="btn-main" data-action="save-card-next">Save to Spaced Deck & Next Article →</button>
          </div>
        </div>
      `;
    }
  }

  function renderDeckView() {
    const mount = document.getElementById("deckMount");
    if (!mount) return;
    const deck = getDeck();
    const today = getRealTodayStr();

    if (!deck.length) {
      mount.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);">No cards stored yet. Complete any live article session to save your attempt here.</div>`;
      return;
    }

    mount.innerHTML = deck.map(card => {
      const isDue = card.dueDate <= today;
      return `
        <div class="deck-row">
          <div style="flex:1;min-width:240px;">
            <div style="font-weight:700;font-size:0.95rem;">
              ${escapeHtml(card.title)}
              <span class="gs-chip ${card.paper}" style="margin-left:6px;">${card.paper}</span>
            </div>
            <div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">
              Topic: ${escapeHtml(card.subtopic || "General Studies")} • Learned: ${card.learnedDate} • Next Recall: <strong>${card.dueDate}</strong> (Day ${card.interval})
              ${isDue ? `<span style="color:var(--bad);font-weight:800;margin-left:6px;">⚠️ DUE TODAY</span>` : ""}
            </div>
            ${card.userAttempt ? `<div style="font-size:0.76rem;color:#93c5fd;margin-top:4px;"><strong>Your Notes:</strong> ${escapeHtml([card.userAttempt.p1, card.userAttempt.p2, card.userAttempt.p4].filter(Boolean).join(" | ").slice(0, 140))}</div>` : ""}
          </div>
          <div style="display:flex;gap:6px;">
            <button class="icon-btn" data-action="retest-card" data-id="${card.id}">Retest</button>
            <button class="icon-btn" style="color:var(--bad);" data-action="delete-card" data-id="${card.id}">✕</button>
          </div>
        </div>
      `;
    }).join("");
  }

  // 8. DELEGATED EVENT CONTROLLER
  document.addEventListener("click", function(e) {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const act = btn.getAttribute("data-action");

    if (act === "tab-study") {
      document.getElementById("studyView").style.display = "block";
      document.getElementById("deckView").style.display = "none";
      document.getElementById("tabStudy").classList.add("active");
      document.getElementById("tabDeck").classList.remove("active");
      renderScreen();
    } else if (act === "tab-deck") {
      document.getElementById("studyView").style.display = "none";
      document.getElementById("deckView").style.display = "block";
      document.getElementById("tabDeck").classList.add("active");
      document.getElementById("tabStudy").classList.remove("active");
      renderDeckView();
    } else if (act === "force-sync") {
      currentIdx = 0; stage = "study"; loadBatchForDate(true);
    } else if (act === "prev-day") {
      dayOffset -= 1; currentIdx = 0; stage = "study"; loadBatchForDate(false);
    } else if (act === "next-day") {
      dayOffset += 1; currentIdx = 0; stage = "study"; loadBatchForDate(false);
    } else if (act === "today-day") {
      dayOffset = 0; currentIdx = 0; stage = "study"; loadBatchForDate(false);
    } else if (act === "select-article") {
      const idx = parseInt(btn.getAttribute("data-idx"), 10);
      if (!isNaN(idx)) { currentIdx = idx; stage = "study"; restoreCurrentAttempt(); renderScreen(); }
    } else if (act === "set-mains") { activeMode = "mains"; renderScreen(); }
    else if (act === "set-prelims") { activeMode = "prelims"; renderScreen(); }
    else if (act === "start-recall") { stage = "recall"; renderScreen(); }
    else if (act === "back-study") { stage = "study"; renderScreen(); }
    else if (act === "skip-next") { currentIdx += 1; stage = "study"; restoreCurrentAttempt(); renderScreen(); }
    else if (act === "submit-recall") {
      recallInputs.p1 = (document.getElementById("inp1") || {}).value?.trim() || "";
      recallInputs.p2 = (document.getElementById("inp2") || {}).value?.trim() || "";
      recallInputs.p3 = (document.getElementById("inp3") || {}).value?.trim() || "";
      recallInputs.p4 = (document.getElementById("inp4") || {}).value?.trim() || "";

      const combined = (recallInputs.p1 + " " + recallInputs.p2 + " " + recallInputs.p3 + " " + recallInputs.p4).toLowerCase();
      const art = dailyBatch[currentIdx];
      lastHits = []; lastMisses = [];

      art.keywords.forEach(kw => {
        const parts = kw.toLowerCase().split(/\s+/);
        const hit = parts.some(p => p.length >= 3 && combined.includes(p));
        if (hit) lastHits.push(kw);
        else lastMisses.push(kw);
      });

      saveAttemptForDay(getSelectedDateStr(), currentIdx, {
        inputs: { ...recallInputs }, hits: [...lastHits], misses: [...lastMisses], ts: Date.now()
      });

      stage = "diff";
      renderScreen();
    } else if (act === "go-summary") { stage = "summary"; renderScreen(); }
    else if (act === "save-card-next") {
      const art = dailyBatch[currentIdx];
      const interval = lastMisses.length <= 2 ? 21 : (lastMisses.length <= 4 ? 7 : 1);
      const deck = getDeck();

      if (retestingId) {
        const oldIdx = deck.findIndex(c => String(c.id) === String(retestingId));
        if (oldIdx > -1) deck.splice(oldIdx, 1);
        retestingId = null;
      }

      deck.unshift({
        id: Date.now(), title: art.title, source: art.source, link: art.link,
        paper: art.paper, subtopic: art.subtopic, context: art.context,
        staticNodes: art.staticNodes, prelims: art.prelims, anchors: art.anchors,
        keywords: art.keywords, mains: art.mains, userAttempt: { ...recallInputs },
        misses: lastMisses, interval: interval, learnedDate: getSelectedDateStr(),
        dueDate: addDaysStr(getRealTodayStr(), interval)
      });
      saveDeck(deck);

      currentIdx += 1; stage = "study"; restoreCurrentAttempt(); renderScreen();
    } else if (act === "restart-batch") {
      currentIdx = 0; stage = "study"; restoreCurrentAttempt(); renderScreen();
    } else if (act === "delete-card") {
      const id = btn.getAttribute("data-id");
      saveDeck(getDeck().filter(c => String(c.id) !== String(id)));
      renderDeckView();
    } else if (act === "retest-card") {
      const id = btn.getAttribute("data-id");
      const card = getDeck().find(c => String(c.id) === String(id));
      if (card) {
        retestingId = card.id;
        dailyBatch[currentIdx] = card;
        recallInputs = card.userAttempt || { p1: "", p2: "", p3: "", p4: "" };
        stage = "recall";
        document.getElementById("studyView").style.display = "block";
        document.getElementById("deckView").style.display = "none";
        document.getElementById("tabStudy").classList.add("active");
        document.getElementById("tabDeck").classList.remove("active");
        renderScreen();
      }
    } else if (act === "export-deck") {
      const blob = new Blob([JSON.stringify(getDeck(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "upsc-super-recall-deck.json";
      a.click();
    }
  });

  // 9. MIDNIGHT ROLLOVER CLOCK
  let trackedDay = getRealTodayStr();
  function updateClock() {
    const now = new Date();
    const tmrw = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    const diff = Math.max(0, tmrw - now);
    const h = String(Math.floor(diff / 3600000)).padStart(2, "0");
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");
    const el = document.getElementById("timerDisplay");
    if (el) el.textContent = `${h}:${m}:${s}`;

    const cur = getRealTodayStr();
    if (cur !== trackedDay) {
      trackedDay = cur; dayOffset = 0; currentIdx = 0; stage = "study";
      loadBatchForDate(true);
    }
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  updateClock();
  setInterval(updateClock, 1000);
  loadBatchForDate(false);
})();
</script>
</body>
</html>
