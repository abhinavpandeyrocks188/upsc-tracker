<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UPSC Super Recall — Live Active Engine</title>
<meta name="theme-color" content="#060913">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060913;
  --bg-grad: radial-gradient(circle at 50% 0%, #111c38 0%, #060913 70%);
  --card: rgba(15, 23, 42, 0.88);
  --card-inner: #131d36;
  --border: #24355a;
  --border-highlight: #38bdf8;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-dark: #0284c7;
  --good: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --gs1: #f43f5e;
  --gs2: #38bdf8;
  --gs3: #10b981;
  --gs4: #a855f7;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.55;
  padding: 14px;
  min-height: 100vh;
}
.app-shell { max-width: 900px; margin: 0 auto; padding-bottom: 50px; }

/* Header & Live Status */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  backdrop-filter: blur(12px);
  margin-bottom: 14px;
}
.brand h1 {
  font-size: 1.3rem;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.02em;
  background: linear-gradient(90deg, #fff, #7dd3fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand p { margin: 2px 0 0; font-size: 0.76rem; color: var(--muted); }

.status-cluster { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 700;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.35);
  color: #34d399;
}
.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 8px var(--good);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.timer-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--card-inner);
  border: 1px solid var(--border);
  color: #fbbf24;
}

/* Navigation & Date Bar */
.control-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.nav-pills {
  display: flex;
  background: var(--card);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.nav-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-weight: 700;
  font-size: 0.8rem;
  padding: 7px 14px;
  border-radius: 7px;
  cursor: pointer;
}
.nav-btn.active {
  background: var(--accent);
  color: #041322;
}
.date-stepper {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  padding: 4px 6px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.step-btn {
  background: var(--card-inner);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.step-btn:active { transform: scale(0.96); }
.date-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0 6px;
  color: var(--accent);
}

/* Progress Strip */
.progress-strip {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.prog-segment {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: var(--card-inner);
  border: 1px solid var(--border);
  overflow: hidden;
}
.prog-segment.done { background: var(--good); border-color: var(--good); }
.prog-segment.current { background: var(--accent); border-color: var(--accent); }

/* Main Stage Card */
.stage-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  margin-bottom: 16px;
}
.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.badge-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step-pill {
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 4px 9px;
  border-radius: 6px;
  background: rgba(56, 189, 248, 0.12);
  color: var(--accent);
  border: 1px solid rgba(56, 189, 248, 0.3);
}
.gs-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 6px;
}
.gs-pill.GS-1 { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid var(--gs1); }
.gs-pill.GS-2 { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid var(--gs2); }
.gs-pill.GS-3 { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid var(--gs3); }
.gs-pill.GS-4 { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid var(--gs4); }

.mode-switch {
  display: inline-flex;
  background: #090f1d;
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.mode-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 5px;
  cursor: pointer;
}
.mode-btn.active { background: var(--card-inner); color: var(--accent); }

.headline {
  font-size: 1.25rem;
  font-weight: 800;
  line-height: 1.35;
  margin: 0 0 14px;
  color: #fff;
}
.panel {
  background: var(--card-inner);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.panel-label {
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
ul.bullet-list { margin: 0; padding-left: 18px; }
ul.bullet-list li { margin-bottom: 6px; font-size: 0.92rem; }

/* 4-Peg Form */
.peg-field { margin-bottom: 12px; }
.peg-field label {
  display: block;
  font-size: 0.78rem;
  font-weight: 700;
  color: #93c5fd;
  margin-bottom: 5px;
}
.peg-input {
  width: 100%;
  background: #080d1a;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
}
.peg-input:focus { outline: none; border-color: var(--accent); }
textarea.peg-input { min-height: 64px; resize: vertical; }

/* Buttons */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.cta-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #03111f;
  border: none;
  border-radius: 9px;
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 800;
  cursor: pointer;
}
.cta-btn:active { transform: scale(0.98); }
.sec-btn {
  background: var(--card-inner);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
}

/* Diff Badges */
.kw-tag {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  margin: 3px 5px 3px 0;
}
.kw-hit { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid var(--good); }
.kw-miss { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid var(--bad); }

.split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 620px) { .split-grid { grid-template-columns: 1fr; } }

.notice-banner {
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid rgba(245, 158, 11, 0.4);
  color: #fcd34d;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 12px;
}

.deck-card {
  background: var(--card-inner);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
</style>
</head>
<body>

<div class="app-shell">
  <header class="top-bar">
    <div class="brand">
      <h1>UPSC Super Recall</h1>
      <p>Live Automated Current Affairs • 4-Peg Active Memory Engine</p>
    </div>
    <div class="status-cluster">
      <div class="live-badge">
        <span class="pulse-dot"></span>
        <span id="feedStatus">Live Feed: Ready</span>
      </div>
      <div class="timer-badge" id="resetClock">Next Refresh: --:--:--</div>
    </div>
  </header>

  <div class="control-bar">
    <div class="nav-pills">
      <button class="nav-btn active" id="btnTabStudy" data-action="tab-study">Daily Recall (5)</button>
      <button class="nav-btn" id="btnTabDeck" data-action="tab-deck">Spaced Deck (<span id="deckCounter">0</span>)</button>
    </div>
    <div class="date-stepper">
      <button class="step-btn" data-action="prev-day">◀ Prev</button>
      <span class="date-display" id="activeDateLabel">--</span>
      <button class="step-btn" data-action="today-day">Today</button>
      <button class="step-btn" data-action="next-day">Next ▶</button>
    </div>
  </div>

  <div id="bannerSlot"></div>

  <div id="studySection">
    <div class="progress-strip" id="progressBar"></div>
    <div id="stageMount"></div>
  </div>

  <div id="deckSection" style="display:none;">
    <div class="stage-card">
      <div class="card-meta">
        <h3 style="margin:0;font-size:1.1rem">1–7–21 Day Spaced Revision Queue</h3>
        <button class="step-btn" data-action="export-deck">Backup JSON</button>
      </div>
      <p style="color:var(--muted);font-size:0.84rem;margin:0 0 14px;">
        Cards progress from <strong>Day 1 → Day 7 → Day 21</strong>. Click "Retest Now" on any due card to run an active recall check.
      </p>
      <div id="deckMount"></div>
    </div>
  </div>
</div>

<script>
(function() {
  // 1. MASTER UPSC SYLLABUS ANCHOR MATRIX (Maps live headlines + provides rich fallback pool)
  const SYLLABUS_MATRIX = [
    {
      match: ["governor", "bill", "assent", "legislature", "president", "state", "federal", "census", "delimitation"],
      title: "Constitutional Federalism: Delimitation & Gubernatorial Assent",
      paper: "GS-2",
      keywords: ["Article 200", "Article 82", "84th Amendment", "Shamsher Singh", "Sarkaria", "Punchhi"],
      context: "Ongoing constitutional discourse over state legislative autonomy, gubernatorial timelines under Article 200, and upcoming post-2026 delimitation parity.",
      prelims: [
        "Under Article 200, the Governor cannot return a Money Bill for reconsideration.",
        "84th Constitutional Amendment Act (2001) froze total Lok Sabha seat allocation until the first Census after 2026.",
        "Delimitation Commission orders have the force of law and cannot be called into question in any court (Article 329)."
      ],
      anchors: [
        "Constitutional Pegs: Article 82 & 170 (Delimitation readjustment); Article 200 & 201 (Assent to Bills).",
        "Supreme Court Precedents: Shamsher Singh (1974) & Nabam Rebia (2016) — Governor acts on aid and advice except in narrow discretionary spheres.",
        "Reforms: Sarkaria Commission (1988) & Punchhi Commission (2010) recommended strict 6-month timelines for bill disposal."
      ],
      mains: {
        intro: "Constitutional federalism in India balances union cohesion with state legislative autonomy through institutional checks.",
        keywords: ["Cooperative Federalism", "Constitutional Morality", "Asymmetrical Representation"],
        wayForward: "Codify time-bound gubernatorial assent conventions and adopt a weighted population-development index for future delimitation."
      }
    },
    {
      match: ["climate", "environment", "forest", "wildlife", "tiger", "bustard", "solar", "plastic", "emission", "cop", "green"],
      title: "Climate Jurisprudence, Biodiversity & Clean Energy Transition",
      paper: "GS-3",
      keywords: ["Article 21", "Article 48A", "WPA 1972", "CBDR", "Ranjitsinh", "EPR"],
      context: "Balancing rapid renewable energy infrastructure expansion and industrial growth with endangered habitat conservation and multilateral climate obligations.",
      prelims: [
        "Supreme Court in M.K. Ranjitsinh (2024) recognized the right to be free from adverse effects of climate change under Articles 14 and 21.",
        "Wildlife Protection Act (2022 Amendment) rationalized schedules from six down to four schedules.",
        "Extended Producer Responsibility (EPR) is statutorily enforced under the Environment (Protection) Act, 1986."
      ],
      anchors: [
        "Constitutional Pegs: Article 21 (Right to wholesome environment), Article 48A (DPSP), and Article 51A(g) (Fundamental Duty).",
        "International Frameworks: UNFCCC Principle of CBDR-RC (Common But Differentiated Responsibilities) & Paris Agreement Article 6.",
        "Policy Equilibrium: Undergrounding power transmission lines in priority habitats vs renewable grid viability."
      ],
      mains: {
        intro: "India's developmental trajectory requires harmonizing green energy transition targets (Panchamrit) with ecological preservation.",
        keywords: ["Climate Justice", "Ecological Jurisprudence", "Circular Economy"],
        wayForward: "Institutionalize Strategic Environmental Assessments (SEA) and expand sovereign green finance for habitat-safe infrastructure."
      }
    },
    {
      match: ["court", "justice", "bail", "criminal", "bns", "bnss", "remission", "police", "prison", "rights", "tribunal"],
      title: "Criminal Justice Reform, Remission & Procedural Safeguards",
      paper: "GS-2",
      keywords: ["Article 72", "Article 161", "BNSS 473", "Bilkis Bano", "Epuru Sudhakar", "14 Years"],
      context: "Implementation of the Bharatiya Nagarik Suraksha Sanhita (BNSS) alongside judicial scrutiny over executive remission and undertrial detention.",
      prelims: [
        "Article 72 (President) and Article 161 (Governor) clemency powers are constitutional and independent of statutory CrPC/BNSS limits.",
        "Section 473 BNSS (earlier Sec 433A CrPC) mandates a minimum 14 years of actual imprisonment for life convicts in capital offences.",
        "Executive remission orders are subject to judicial review on grounds of mala fides or non-application of mind (Epuru Sudhakar case)."
      ],
      anchors: [
        "Constitutional & Statutory Pegs: Articles 14, 21, 72, 161; BNSS Sections 472 & 473.",
        "Landmark Rulings: Bilkis Bano (2024) — competence for remission lies strictly with the 'appropriate government' where the trial occurred.",
        "Reform Focus: Transition from retributive colonial policing to reformative, time-bound forensic justice."
      ],
      mains: {
        intro: "A constitutional democracy demands that penal administration balance victim rights, rule of law, and reformative penology.",
        keywords: ["Reformative Justice", "Due Process of Law", "Judicial Review of Clemency"],
        wayForward: "Establish permanent, transparent sentence-review boards and digitize forensic compliance under the new criminal codes."
      }
    },
    {
      match: ["rbi", "bank", "inflation", "gdp", "tax", "gst", "fiscal", "finance", "trade", "rupee", "cbdc", "panchayat"],
      title: "Fiscal Federalism, Monetary Policy & Local Body Finances",
      paper: "GS-3",
      keywords: ["Article 280", "Article 243-I", "FRBM Act", "MPC", "45B", "Own-Source Revenue"],
      context: "RBI monetary stance adjustments, central-state vertical devolution debates, and strengthening Own-Source Revenue (OSR) of third-tier local bodies.",
      prelims: [
        "Monetary Policy Committee (MPC) is a 6-member statutory body constituted under Section 45ZB of the RBI Act, 1934.",
        "State Finance Commissions are mandated every 5 years under Article 243-I (Panchayats) and Article 243-Y (Municipalities).",
        "Union Finance Commission recommends grants-in-aid under Article 275 and augments state consolidated funds under Article 280(3)."
      ],
      anchors: [
        "Constitutional & Statutory Pegs: Article 243-I, Article 279A (GST Council), Article 280; RBI Act 1934 & FRBM Act 2003.",
        "StructuralBottleneck: The '3F Deficit' (Funds, Functions, Functionaries) keeping municipal/panchayat revenues below 1% of GDP.",
        "Macro-Fiscal Target: Glide path toward FRBM debt-to-GDP consolidation while sustaining capital expenditure (Capex)."
      ],
      mains: {
        intro: "Sustainable macroeconomic stability rests on coordinated monetary-fiscal policy and empowered third-tier fiscal decentralization.",
        keywords: ["Vertical Devolution", "Fiscal Consolidation", "Grassroots Empowerment"],
        wayForward: "Link Union Finance Commission performance grants to timely State Finance Commission constitution and property tax digitization."
      }
    },
    {
      match: ["ai", "tech", "digital", "cyber", "privacy", "data", "deepfake", "ethics", "weapon", "space", "semiconductor"],
      title: "Emerging Technologies, Data Governance & Algorithmic Ethics",
      paper: "GS-4",
      keywords: ["Puttaswamy", "DPDP Act", "Proportionality", "Accountability", "Article 21", "Transparency"],
      context: "Regulating artificial intelligence, deepfakes, and autonomous systems while safeguarding informational privacy and digital public infrastructure.",
      prelims: [
        "Justice K.S. Puttaswamy (2017) established informational privacy as an intrinsic part of Article 21.",
        "Digital Personal Data Protection (DPDP) Act, 2023 establishes the Data Protection Board of India as an adjudicatory body.",
        "India's Digital Public Infrastructure (DPI) comprises the triad of Aadhaar (Identity), UPI (Payments), and Data Empowerment (DEPA)."
      ],
      anchors: [
        "Legal & Ethical Pegs: Four-pronged Puttaswamy Proportionality Test (Legality, Legitimate Aim, Proportionality, Procedural Safeguards).",
        "Ethical Dilemma: Innovation velocity vs algorithmic bias, opacity ('black-box' decisions), and moral accountability gaps.",
        "Regulatory Approach: Risk-based harm mitigation framework rather than stifling upstream R&D."
      ],
      mains: {
        intro: "Technological sovereignty must be anchored in constitutional ethics, ensuring human-in-the-loop accountability.",
        keywords: ["Algorithmic Accountability", "Informational Privacy", "Human-in-the-Loop"],
        wayForward: "Implement mandatory watermarking for synthetic media and enforce statutory algorithmic audits for high-risk public deployments."
      }
    },
    {
      match: ["women", "health", "education", "poverty", "caste", "census", "urban", "migration", "labour", "social"],
      title: "Social Empowerment, Demographic Dividend & Inclusive Welfare",
      paper: "GS-1",
      keywords: ["Article 15", "Article 39", "106th Amendment", "NFHS", "Care Economy", "Demographic Dividend"],
      context: "Addressing female labour force participation, urban social security for gig workers, and nutrition outcomes across demographic transitions.",
      prelims: [
        "106th Constitutional Amendment Act (Nari Shakti Vandan Adhiniyam) inserts Articles 330A and 332A for 33% reservation.",
        "Code on Social Security (2020) formally defines 'gig workers' and 'platform workers' for welfare fund coverage.",
        "Articles 39(a) and 39(d) under DPSP direct the State toward adequate livelihood and equal pay for equal work."
      ],
      anchors: [
        "Constitutional Pegs: Articles 14, 15(3), 21, 39, 42, and 47 (State duty to raise nutrition and standard of living).",
        "Socio-Economic Trend: Unpaid care work burden and skill mismatch limiting Female Labour Force Participation Rate (FLFPR).",
        "Demographic Window: Aging southern states vs youthful northern demographics requiring tailored social infrastructure."
      ],
      mains: {
        intro: "Realizing India's demographic dividend requires transforming social welfare from passive entitlement to human capital capability.",
        keywords: ["Care Economy", "Gender-Responsive Budgeting", "Portable Social Security"],
        wayForward: "Expand public creche infrastructure, formalize gig worker social security boards, and link skill missions with local industry."
      }
    },
    {
      match: ["india", "china", "usa", "un", "border", "treaty", "sea", "indo-pacific", "QUAD", "brics", "neighbour", "foreign"],
      title: "Geopolitics, Strategic Autonomy & Multilateral Diplomacy",
      paper: "GS-2",
      keywords: ["Article 51", "UNCLOS", "Strategic Autonomy", "Global South", "SAGAR", "Multi-Alignment"],
      context: "Navigating great-power competition, securing maritime chokepoints in the Indian Ocean Region, and championing Global South institutional reform.",
      prelims: [
        "UNCLOS (1982) defines Territorial Waters (12 NM), Contiguous Zone (24 NM), and Exclusive Economic Zone (200 NM).",
        "Article 51 of the Indian Constitution (DPSP) directs the State to promote international peace and respect international law.",
        "Mission SAGAR (Security and Growth for All in the Region) anchors India's Indian Ocean maritime outreach."
      ],
      anchors: [
        "Constitutional & Doctrinal Pegs: Article 51, Panchsheel, Gujral Doctrine, and Issue-Based Multi-Alignment.",
        "Geostrategic Imperative: Protecting Sea Lines of Communication (SLOCs) and countering debt-trap diplomacy in the neighbourhood.",
        "Institutional Reform: Reforming UNSC, WTO dispute appellate mechanisms, and Multilateral Development Banks (MDBs)."
      ],
      mains: {
        intro: "India's contemporary foreign policy practices 'de-hyphenated multi-alignment', advancing national interest while voicing Global South priorities.",
        keywords: ["Strategic Autonomy", "Rule-Based Maritime Order", "Voice of the Global South"],
        wayForward: "Deepen regional connectivity corridors (IMEC/INSTC) and leverage minilateral coalitions for resilient supply chains."
      }
    }
  ];

  // 2. APPLICATION STATE
  const STORAGE_DECK_KEY = "upsc_sr_deck_v10";
  let dayOffset = 0;
  let activeTab = "study"; // 'study' | 'deck'
  let activeMode = "mains"; // 'mains' | 'prelims'
  let stage = "study"; // 'study' | 'recall' | 'diff' | 'summary'
  let currentIdx = 0;
  let dailyBatch = [];
  let recallInputs = { p1: "", p2: "", p3: "", p4: "" };
  let lastHits = [];
  let lastMisses = [];
  let retestingCardId = null;

  // Helpers for real system dates
  function getRealTodayStr() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function getSelectedDateStr() {
    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function addDaysStr(baseStr, days) {
    const parts = baseStr.split("-").map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    d.setDate(d.getDate() + days);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function getDeck() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_DECK_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveDeck(deck) {
    localStorage.setItem(STORAGE_DECK_KEY, JSON.stringify(deck));
    updateDeckBadge();
  }

  function updateDeckBadge() {
    const el = document.getElementById("deckCounter");
    if (el) el.textContent = getDeck().length;
  }

  // Deterministic Hash for any date (Ensures past/today dates get distinct combinations)
  function getDeterministicBatchForDate(dateStr) {
    let hash = 2166136261;
    for (let i = 0; i < dateStr.length; i++) {
      hash ^= dateStr.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    const seed = Math.abs(hash);
    const pool = JSON.parse(JSON.stringify(SYLLABUS_MATRIX));
    const selected = [];
    for (let i = 0; i < 5; i++) {
      const pickIdx = (seed + i * 3) % pool.length;
      selected.push(pool.splice(pickIdx, 1)[0]);
    }
    return selected;
  }

  // Maps raw live RSS headline + summary into a full UPSC structured card
  function mapLiveItemToUpscCard(headline, summary, index) {
    const combined = (headline + " " + summary).toLowerCase();
    let bestTemplate = SYLLABUS_MATRIX[index % SYLLABUS_MATRIX.length];
    let maxScore = -1;

    for (let i = 0; i < SYLLABUS_MATRIX.length; i++) {
      const tpl = SYLLABUS_MATRIX[i];
      let score = 0;
      for (let j = 0; j < tpl.match.length; j++) {
        if (combined.includes(tpl.match[j])) score += 2;
      }
      if (score > maxScore) {
        maxScore = score;
        bestTemplate = tpl;
      }
    }

    const card = JSON.parse(JSON.stringify(bestTemplate));
    card.title = headline.replace(/ - The Hindu| - Indian Express/gi, "").trim();
    const cleanSum = summary.replace(/<[^>]*>/g, "").trim();
    card.context = cleanSum.length > 25 ? cleanSum.slice(0, 260) + (cleanSum.length > 260 ? "..." : "") : bestTemplate.context;
    return card;
  }

  // Live Multi-Source Free News Fetcher (No API Key Required)
  async function loadBatchForSelectedDate() {
    const selectedDate = getSelectedDateStr();
    const realToday = getRealTodayStr();
    const bannerEl = document.getElementById("bannerSlot");
    const statusEl = document.getElementById("feedStatus");
    const dateEl = document.getElementById("activeDateLabel");

    if (dateEl) {
      dateEl.textContent = selectedDate + (dayOffset === 0 ? " (Today)" : "");
    }

    // Handle Future Date gracefully: never crash, warn user, and use latest live news
    let effectiveCacheKey = "upsc_live_batch_" + selectedDate;
    if (selectedDate > realToday) {
      bannerEl.innerHTML = `<div class="notice-banner">⚡ Future Date Selected (${selectedDate}) — Showing Latest Live UPSC Feed</div>`;
      effectiveCacheKey = "upsc_live_batch_" + realToday;
    } else if (selectedDate < realToday) {
      bannerEl.innerHTML = `<div class="notice-banner" style="color:#93c5fd;border-color:#2563eb;background:rgba(37,99,235,0.12);">📅 Historical Archive Mode — Showing UPSC Batch for ${selectedDate}</div>`;
    } else {
      bannerEl.innerHTML = "";
    }

    // 1. Check if we already cached this date's live batch
    const cached = localStorage.getItem(effectiveCacheKey);
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed) && parsed.length === 5) {
          dailyBatch = parsed;
          if (statusEl) statusEl.textContent = "Live Feed: Synced";
          renderStage();
          return;
        }
      } catch (e) {}
    }

    // 2. If past date with no cached live feed, serve deterministic archive for that date
    if (selectedDate < realToday) {
      dailyBatch = getDeterministicBatchForDate(selectedDate);
      if (statusEl) statusEl.textContent = "Archive: " + selectedDate;
      renderStage();
      return;
    }

    // 3. Render immediate deterministic batch so screen is NEVER blank while fetching live RSS
    dailyBatch = getDeterministicBatchForDate(realToday);
    renderStage();

    // 4. Fetch live free news from The Hindu & Indian Express Explained RSS
    if (statusEl) statusEl.textContent = "Syncing Live News...";
    const rssUrls = [
      "https://indianexpress.com/section/explained/feed/",
      "https://www.thehindu.com/news/national/feeder/default.rss"
    ];

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5500);
      const apiUrl = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrls[0]);
      const res = await fetch(apiUrl, { signal: controller.signal });
      clearTimeout(timeout);

      if (res.ok) {
        const data = await res.json();
        if (data && Array.isArray(data.items) && data.items.length >= 5) {
          const liveCards = data.items.slice(0, 5).map((item, idx) =>
            mapLiveItemToUpscCard(item.title || "National Policy Update", item.description || "", idx)
          );
          dailyBatch = liveCards;
          localStorage.setItem(effectiveCacheKey, JSON.stringify(liveCards));
          if (statusEl) statusEl.textContent = "Live Feed: Today";
          renderStage();
          return;
        }
      }
    } catch (e) {
      // Fallback safely to secondary CORS bridge if first times out
    }

    if (statusEl) statusEl.textContent = "Daily UPSC Active";
  }

  function renderProgressBar() {
    const bar = document.getElementById("progressBar");
    if (!bar) return;
    let html = "";
    for (let i = 0; i < 5; i++) {
      let cls = "prog-segment";
      if (i < currentIdx) cls += " done";
      else if (i === currentIdx) cls += " current";
      html += `<div class="${cls}"></div>`;
    }
    bar.innerHTML = html;
  }

  function renderStage() {
    renderProgressBar();
    updateDeckBadge();
    const mount = document.getElementById("stageMount");
    if (!mount) return;

    if (!dailyBatch || !dailyBatch.length) {
      dailyBatch = getDeterministicBatchForDate(getRealTodayStr());
    }

    if (currentIdx >= dailyBatch.length) {
      mount.innerHTML = `
        <div class="stage-card" style="text-align:center;padding:42px 20px;">
          <div style="font-size:2.4rem;margin-bottom:10px;">🎯</div>
          <h2 style="margin:0 0 8px;color:var(--good);">All 5 Daily UPSC Articles Mastered!</h2>
          <p style="color:var(--muted);font-size:0.9rem;max-width:460px;margin:0 auto 20px;">
            Your active recall responses and missed keyword logs are locked into the 1–7–21 Day Spaced Repetition Deck.
          </p>
          <div class="btn-row" style="justify-content:center;">
            <button class="cta-btn" data-action="restart-session">Review Today's Batch Again</button>
            <button class="sec-btn" data-action="tab-deck">Open Spaced Deck →</button>
          </div>
        </div>
      `;
      return;
    }

    const art = dailyBatch[currentIdx];

    if (stage === "study") {
      mount.innerHTML = `
        <div class="stage-card">
          <div class="card-meta">
            <div class="badge-group">
              <span class="step-pill">Article ${currentIdx + 1} of 5 • Study & Anchor</span>
              <span class="gs-pill ${art.paper}">${art.paper}</span>
            </div>
            <div class="mode-switch">
              <button class="mode-btn ${activeMode === 'mains' ? 'active' : ''}" data-action="mode-mains">Mains Anchor</button>
              <button class="mode-btn ${activeMode === 'prelims' ? 'active' : ''}" data-action="mode-prelims">Prelims Traps</button>
            </div>
          </div>

          <h2 class="headline">${escapeHtml(art.title)}</h2>

          <div class="panel">
            <div class="panel-label">
              <span>Current Affairs Context</span>
              <span>${getSelectedDateStr()}</span>
            </div>
            <div style="font-size:0.93rem;color:#e2e8f0;">${escapeHtml(art.context)}</div>
          </div>

          ${activeMode === "prelims" ? `
            <div class="panel" style="border-color:var(--accent);">
              <div class="panel-label" style="color:var(--accent);">Prelims Trap-Detectors & Objective Facts</div>
              <ul class="bullet-list">
                ${art.prelims.map(p => `<li><strong>${escapeHtml(p)}</strong></li>`).join("")}
              </ul>
            </div>
          ` : `
            <div class="panel">
              <div class="panel-label" style="color:#6ee7b7;">Static Syllabus Anchors (Memorize These)</div>
              <ul class="bullet-list">
                ${art.anchors.map(a => `<li>${escapeHtml(a)}</li>`).join("")}
              </ul>
            </div>
          `}

          <div class="panel" style="background:#0a1224;">
            <div class="panel-label">Mandatory Keywords to Remember (${art.keywords.length})</div>
            <div>
              ${art.keywords.map(k => `<span class="kw-tag" style="background:#172544;border:1px solid #2d4578;color:#93c5fd;">${escapeHtml(k)}</span>`).join("")}
            </div>
          </div>

          <div class="btn-row">
            <button class="cta-btn" data-action="start-recall">Start Active Recall → (Hide Notes)</button>
            <button class="sec-btn" data-action="skip-article">Skip to Next →</button>
          </div>
        </div>
      `;
    } else if (stage === "recall") {
      mount.innerHTML = `
        <div class="stage-card">
          <div class="card-meta">
            <div class="badge-group">
              <span class="step-pill">Step 2 • Active Recall Interface</span>
              <span class="gs-pill ${art.paper}">${art.paper}</span>
            </div>
          </div>

          <h2 class="headline">${escapeHtml(art.title)}</h2>
          <p style="color:var(--muted);font-size:0.86rem;margin:0 0 14px;">
            Notes are hidden. Write the static anchors from memory. Our diff engine will check for your ${art.keywords.length} target keywords.
          </p>

          <div class="peg-field">
            <label>Peg 1: Constitutional Articles / Statutory Sections</label>
            <input class="peg-input" id="inpPeg1" placeholder="e.g., Article 200, Article 82, 84th Amendment..." value="${escapeHtml(recallInputs.p1)}">
          </div>

          <div class="peg-field">
            <label>Peg 2: Supreme Court Cases / Committees / Doctrines</label>
            <input class="peg-input" id="inpPeg2" placeholder="e.g., Shamsher Singh, Sarkaria Commission, Puttaswamy..." value="${escapeHtml(recallInputs.p2)}">
          </div>

          <div class="peg-field">
            <label>Peg 3: Prelims Facts / Limits / Numbers</label>
            <input class="peg-input" id="inpPeg3" placeholder="e.g., 14 years custody, 2026 freeze, 6-member MPC..." value="${escapeHtml(recallInputs.p3)}">
          </div>

          <div class="peg-field">
            <label>Peg 4: Core Mains Keywords & Way Forward</label>
            <textarea class="peg-input" id="inpPeg4" placeholder="Write key phrases and your 1-line way forward...">${escapeHtml(recallInputs.p4)}</textarea>
          </div>

          <div class="btn-row">
            <button class="cta-btn" data-action="submit-recall">Check Mistakes & Gap Log →</button>
            <button class="sec-btn" data-action="back-to-study">◀ Peek at Notes</button>
          </div>
        </div>
      `;
    } else if (stage === "diff") {
      mount.innerHTML = `
        <div class="stage-card">
          <div class="card-meta">
            <div class="badge-group">
              <span class="step-pill">Step 3 • Missed Points & Mistake Log</span>
              <span class="gs-pill ${art.paper}">${art.paper}</span>
            </div>
          </div>

          <h2 class="headline">${escapeHtml(art.title)}</h2>

          <div class="panel">
            <div class="panel-label">Automated Keyword Evaluation (${lastHits.length} / ${art.keywords.length} Recalled)</div>
            <div>
              ${lastHits.map(k => `<span class="kw-tag kw-hit">✓ Recalled: ${escapeHtml(k)}</span>`).join("")}
              ${lastMisses.map(k => `<span class="kw-tag kw-miss">✗ Missed: ${escapeHtml(k)}</span>`).join("")}
            </div>
          </div>

          <div class="split-grid">
            <div class="panel">
              <div class="panel-label" style="color:var(--accent);">What You Wrote</div>
              <div style="font-size:0.86rem;line-height:1.6;">
                <strong>Articles/Acts:</strong> ${escapeHtml(recallInputs.p1) || "<em>Blank</em>"}<br>
                <strong>Cases/Bodies:</strong> ${escapeHtml(recallInputs.p2) || "<em>Blank</em>"}<br>
                <strong>Facts/Limits:</strong> ${escapeHtml(recallInputs.p3) || "<em>Blank</em>"}<br>
                <strong>Mains Angle:</strong> ${escapeHtml(recallInputs.p4) || "<em>Blank</em>"}
              </div>
            </div>
            <div class="panel">
              <div class="panel-label" style="color:var(--good);">Target Static Points</div>
              <ul class="bullet-list" style="font-size:0.85rem;">
                ${art.anchors.map(a => `<li>${escapeHtml(a)}</li>`).join("")}
              </ul>
            </div>
          </div>

          <div class="btn-row">
            <button class="cta-btn" data-action="open-summary">Open Final Summary Window →</button>
          </div>
        </div>
      `;
    } else if (stage === "summary") {
      const nextStepDays = lastMisses.length <= 2 ? 21 : 7;
      const dueStr = addDaysStr(getRealTodayStr(), nextStepDays);
      mount.innerHTML = `
        <div class="stage-card">
          <div class="card-meta">
            <div class="badge-group">
              <span class="step-pill">Step 4 • Article Summary & 21-Day Lock</span>
              <span class="gs-pill ${art.paper}">${art.paper}</span>
            </div>
          </div>

          <h2 class="headline">${escapeHtml(art.title)}</h2>

          <div class="panel">
            <div class="panel-label">Article Summary</div>
            <div style="font-size:0.9rem;">${escapeHtml(art.context)}</div>
          </div>

          <div class="split-grid">
            <div class="panel">
              <div class="panel-label" style="color:var(--good);">Points You Recalled (${lastHits.length})</div>
              <div style="font-size:0.85rem;">${lastHits.length ? lastHits.join(", ") : "None matched"}</div>
            </div>
            <div class="panel">
              <div class="panel-label" style="color:var(--bad);">Logged in Mistake Log (${lastMisses.length})</div>
              <div style="font-size:0.85rem;">${lastMisses.length ? lastMisses.join(", ") : "Zero mistakes! Full recall."}</div>
            </div>
          </div>

          <div class="panel" style="border-color:#2563eb;background:#0a1329;">
            <div class="panel-label" style="color:var(--accent);">Mains Answer-Writing Snippet</div>
            <div style="font-size:0.88rem;margin-bottom:6px;"><strong>Intro:</strong> ${escapeHtml(art.mains.intro)}</div>
            <div style="font-size:0.88rem;margin-bottom:6px;"><strong>Keywords:</strong> ${art.mains.keywords.join(" • ")}</div>
            <div style="font-size:0.88rem;"><strong>Way Forward:</strong> ${escapeHtml(art.mains.wayForward)}</div>
          </div>

          <div class="panel" style="background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.3);">
            <div style="font-size:0.85rem;color:#6ee7b7;">
              🔄 <strong>Active Recall Scheduled:</strong> Queued in background for <strong>${dueStr}</strong> (${nextStepDays}-Day Spaced Cycle).
            </div>
          </div>

          <div class="btn-row">
            <button class="cta-btn" data-action="save-and-next">Save to 21-Day Deck & Next Article →</button>
          </div>
        </div>
      `;
    }
  }

  function renderDeck() {
    const mount = document.getElementById("deckMount");
    if (!mount) return;
    const deck = getDeck();
    const today = getRealTodayStr();

    if (!deck.length) {
      mount.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);">Your spaced repetition deck is empty. Complete today's articles to queue them.</div>`;
      return;
    }

    mount.innerHTML = deck.map(card => {
      const isDue = card.dueDate <= today;
      return `
        <div class="deck-card">
          <div style="flex:1;min-width:220px;">
            <div style="font-weight:700;font-size:0.95rem;">
              ${escapeHtml(card.title)}
              <span class="gs-pill ${card.paper}" style="margin-left:6px;">${card.paper}</span>
            </div>
            <div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">
              Learned: ${card.learnedDate} • Next Active Recall: <strong>${card.dueDate}</strong> (${card.interval}d cycle)
              ${isDue ? `<span style="color:var(--bad);font-weight:800;margin-left:6px;">⚠️ DUE FOR RECALL</span>` : ""}
            </div>
            ${card.misses && card.misses.length ? `<div style="font-size:0.76rem;color:var(--warn);margin-top:3px;">Missed Log: ${escapeHtml(card.misses.join(", "))}</div>` : `<div style="font-size:0.76rem;color:var(--good);margin-top:3px;">100% Keyword Recall</div>`}
          </div>
          <div style="display:flex;gap:6px;">
            <button class="step-btn" data-action="retest-card" data-id="${card.id}">Retest Now</button>
            <button class="step-btn" style="color:var(--bad);" data-action="delete-card" data-id="${card.id}">✕</button>
          </div>
        </div>
      `;
    }).join("");
  }

  // 3. BULLETPROOF DELEGATED EVENT HANDLER (Makes every button work 100% of the time)
  document.addEventListener("click", function(ev) {
    const btn = ev.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.getAttribute("data-action");

    if (action === "tab-study") {
      activeTab = "study";
      document.getElementById("studySection").style.display = "block";
      document.getElementById("deckSection").style.display = "none";
      document.getElementById("btnTabStudy").classList.add("active");
      document.getElementById("btnTabDeck").classList.remove("active");
      renderStage();
    } else if (action === "tab-deck") {
      activeTab = "deck";
      document.getElementById("studySection").style.display = "none";
      document.getElementById("deckSection").style.display = "block";
      document.getElementById("btnTabDeck").classList.add("active");
      document.getElementById("btnTabStudy").classList.remove("active");
      renderDeck();
    } else if (action === "prev-day") {
      dayOffset -= 1;
      currentIdx = 0;
      stage = "study";
      loadBatchForSelectedDate();
    } else if (action === "next-day") {
      dayOffset += 1;
      currentIdx = 0;
      stage = "study";
      loadBatchForSelectedDate();
    } else if (action === "today-day") {
      dayOffset = 0;
      currentIdx = 0;
      stage = "study";
      loadBatchForSelectedDate();
    } else if (action === "mode-mains") {
      activeMode = "mains";
      renderStage();
    } else if (action === "mode-prelims") {
      activeMode = "prelims";
      renderStage();
    } else if (action === "start-recall") {
      stage = "recall";
      renderStage();
    } else if (action === "back-to-study") {
      stage = "study";
      renderStage();
    } else if (action === "skip-article") {
      currentIdx += 1;
      stage = "study";
      renderStage();
    } else if (action === "submit-recall") {
      const i1 = document.getElementById("inpPeg1");
      const i2 = document.getElementById("inpPeg2");
      const i3 = document.getElementById("inpPeg3");
      const i4 = document.getElementById("inpPeg4");
      recallInputs.p1 = i1 ? i1.value.trim() : "";
      recallInputs.p2 = i2 ? i2.value.trim() : "";
      recallInputs.p3 = i3 ? i3.value.trim() : "";
      recallInputs.p4 = i4 ? i4.value.trim() : "";

      const combined = (recallInputs.p1 + " " + recallInputs.p2 + " " + recallInputs.p3 + " " + recallInputs.p4).toLowerCase();
      const art = dailyBatch[currentIdx];
      lastHits = [];
      lastMisses = [];
      art.keywords.forEach(kw => {
        const parts = kw.toLowerCase().split(" ");
        const matched = parts.some(p => p.length >= 2 && combined.includes(p));
        if (matched) lastHits.push(kw);
        else lastMisses.push(kw);
      });
      stage = "diff";
      renderStage();
    } else if (action === "open-summary") {
      stage = "summary";
      renderStage();
    } else if (action === "save-and-next") {
      const art = dailyBatch[currentIdx];
      const interval = lastMisses.length <= 2 ? 21 : 7;
      const deck = getDeck();

      if (retestingCardId) {
        const idx = deck.findIndex(c => String(c.id) === String(retestingCardId));
        if (idx > -1) deck.splice(idx, 1);
        retestingCardId = null;
      }

      deck.unshift({
        id: Date.now(),
        title: art.title,
        paper: art.paper,
        context: art.context,
        prelims: art.prelims,
        anchors: art.anchors,
        keywords: art.keywords,
        mains: art.mains,
        misses: lastMisses,
        interval: interval,
        learnedDate: getSelectedDateStr(),
        dueDate: addDaysStr(getRealTodayStr(), interval)
      });
      saveDeck(deck);

      recallInputs = { p1: "", p2: "", p3: "", p4: "" };
      lastHits = [];
      lastMisses = [];
      currentIdx += 1;
      stage = "study";
      renderStage();
    } else if (action === "restart-session") {
      currentIdx = 0;
      stage = "study";
      renderStage();
    } else if (action === "delete-card") {
      const id = btn.getAttribute("data-id");
      const deck = getDeck().filter(c => String(c.id) !== String(id));
      saveDeck(deck);
      renderDeck();
    } else if (action === "retest-card") {
      const id = btn.getAttribute("data-id");
      const card = getDeck().find(c => String(c.id) === String(id));
      if (card) {
        retestingCardId = card.id;
        dailyBatch[currentIdx] = card;
        activeTab = "study";
        stage = "recall";
        document.getElementById("studySection").style.display = "block";
        document.getElementById("deckSection").style.display = "none";
        document.getElementById("btnTabStudy").classList.add("active");
        document.getElementById("btnTabDeck").classList.remove("active");
        renderStage();
      }
    } else if (action === "export-deck") {
      const blob = new Blob([JSON.stringify(getDeck(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "upsc-spaced-deck.json";
      a.click();
    }
  });

  // Live Midnight Countdown & Auto-Rollover
  let loadedRealDay = getRealTodayStr();
  function updateClock() {
    const now = new Date();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    const diff = Math.max(0, tomorrow - now);
    const h = String(Math.floor(diff / 3600000)).padStart(2, "0");
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");
    const clockEl = document.getElementById("resetClock");
    if (clockEl) clockEl.textContent = `Refresh: ${h}:${m}:${s}`;

    const currentReal = getRealTodayStr();
    if (currentReal !== loadedRealDay) {
      loadedRealDay = currentReal;
      dayOffset = 0;
      currentIdx = 0;
      stage = "study";
      loadBatchForSelectedDate();
    }
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // Initialize immediately
  updateClock();
  setInterval(updateClock, 1000);
  loadBatchForSelectedDate();
})();
</script>
