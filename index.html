<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UPSC Super Recall — Live Dynamic Engine</title>
<meta name="theme-color" content="#050811">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050811;
  --bg-glow: radial-gradient(circle at 50% -10%, #132347 0%, #050811 65%);
  --card: rgba(15, 23, 42, 0.92);
  --card-sub: #121c33;
  --border: #22345a;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-dark: #0284c7;
  --good: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --gs1: #f43f5e;
  --gs2: #38bdf8;
  --gs3: #10b981;
  --gs4: #a855f7;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  background-image: var(--bg-glow);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.58;
  padding: 14px;
  min-height: 100vh;
}
.shell { max-width: 920px; margin: 0 auto; padding-bottom: 50px; }

/* Top Header */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 15px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 14px;
}
.brand h1 {
  font-size: 1.32rem;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.02em;
  background: linear-gradient(90deg, #ffffff, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand p { margin: 2px 0 0; font-size: 0.76rem; color: var(--muted); }

.meta-cluster { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 700;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.35);
  color: #34d399;
}
.status-pill.syncing {
  background: rgba(56, 189, 248, 0.12);
  border-color: rgba(56, 189, 248, 0.35);
  color: var(--accent);
}
.status-pill.offline {
  background: rgba(245, 158, 11, 0.12);
  border-color: rgba(245, 158, 11, 0.35);
  color: #fbbf24;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
  animation: pulse 1.8s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.clock-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--card-sub);
  border: 1px solid var(--border);
  color: #fbbf24;
}

/* Navigation & Date Controls */
.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
}
.tab-box {
  display: flex;
  background: var(--card);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.tab-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-weight: 700;
  font-size: 0.8rem;
  padding: 7px 14px;
  border-radius: 7px;
  cursor: pointer;
}
.tab-btn.active { background: var(--accent); color: #031322; }

.date-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  padding: 4px 6px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.mini-btn {
  background: var(--card-sub);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.74rem;
  font-weight: 700;
  padding: 5px 9px;
  border-radius: 6px;
  cursor: pointer;
}
.mini-btn:active { transform: scale(0.96); }
.date-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0 6px;
  color: var(--accent);
}

/* 5-Article Progress Bar */
.prog-bar { display: flex; gap: 6px; margin-bottom: 14px; }
.prog-step {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: var(--card-sub);
  border: 1px solid var(--border);
  cursor: pointer;
}
.prog-step.done { background: var(--good); border-color: var(--good); }
.prog-step.active { background: var(--accent); border-color: var(--accent); }

/* Stage Card */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
  margin-bottom: 16px;
}
.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.tag-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step-tag {
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 4px 9px;
  border-radius: 6px;
  background: rgba(56, 189, 248, 0.12);
  color: var(--accent);
  border: 1px solid rgba(56, 189, 248, 0.3);
}
.gs-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 6px;
}
.gs-badge.GS-1 { background: rgba(244, 63, 94, 0.16); color: #fda4af; border: 1px solid var(--gs1); }
.gs-badge.GS-2 { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid var(--gs2); }
.gs-badge.GS-3 { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid var(--gs3); }
.gs-badge.GS-4 { background: rgba(168, 85, 247, 0.16); color: #d8b4fe; border: 1px solid var(--gs4); }

.src-badge {
  font-size: 0.7rem;
  font-weight: 700;
  color: #cbd5e1;
  background: #1e293b;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid #334155;
}

.mode-switch {
  display: inline-flex;
  background: #080d1a;
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.mode-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 5px;
  cursor: pointer;
}
.mode-btn.active { background: var(--card-sub); color: var(--accent); }

.art-title {
  font-size: 1.24rem;
  font-weight: 800;
  line-height: 1.36;
  margin: 0 0 14px;
  color: #fff;
}
.box {
  background: var(--card-sub);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.box-head {
  font-size: 0.69rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 7px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
ul.clean-ul { margin: 0; padding-left: 18px; }
ul.clean-ul li { margin-bottom: 6px; font-size: 0.92rem; }

/* 4-Peg Form */
.peg-group { margin-bottom: 12px; }
.peg-group label {
  display: block;
  font-size: 0.79rem;
  font-weight: 700;
  color: #93c5fd;
  margin-bottom: 5px;
}
.peg-inp {
  width: 100%;
  background: #070c18;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
}
.peg-inp:focus { outline: none; border-color: var(--accent); }
textarea.peg-inp { min-height: 68px; resize: vertical; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.primary-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #03111f;
  border: none;
  border-radius: 9px;
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 800;
  cursor: pointer;
}
.primary-btn:active { transform: scale(0.98); }
.secondary-btn {
  background: var(--card-sub);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 0.84rem;
  font-weight: 700;
  cursor: pointer;
}

.kw-pill {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  margin: 3px 5px 3px 0;
}
.kw-hit { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid var(--good); }
.kw-miss { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid var(--bad); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 620px) { .grid-2 { grid-template-columns: 1fr; } }

.banner {
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid rgba(56, 189, 248, 0.35);
  color: #7dd3fc;
  padding: 9px 13px;
  border-radius: 9px;
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 12px;
}

.deck-item {
  background: var(--card-sub);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.ext-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 0.75rem;
  font-weight: 700;
}
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>UPSC Super Recall</h1>
      <p>Live Dynamic News Articulator • 1–7–21 Spaced Memory Engine</p>
    </div>
    <div class="meta-cluster">
      <div class="status-pill syncing" id="liveBadge">
        <span class="dot"></span>
        <span id="liveText">Fetching Live News...</span>
      </div>
      <button class="mini-btn" data-action="force-live-sync" title="Pull fresh live articles right now">🔄 Sync Live</button>
      <div class="clock-pill" id="midnightTimer">00:00:00</div>
    </div>
  </header>

  <div class="nav-row">
    <div class="tab-box">
      <button class="tab-btn active" id="tabBtnStudy" data-action="switch-study">Live Daily Recall (5)</button>
      <button class="tab-btn" id="tabBtnDeck" data-action="switch-deck">Spaced Deck (<span id="deckCount">0</span>)</button>
    </div>
    <div class="date-box">
      <button class="mini-btn" data-action="day-prev">◀ Prev</button>
      <span class="date-text" id="dateDisplay">--</span>
      <button class="mini-btn" data-action="day-today">Today</button>
      <button class="mini-btn" data-action="day-next">Next ▶</button>
    </div>
  </div>

  <div id="bannerMount"></div>

  <div id="viewStudy">
    <div class="prog-bar" id="progStrip"></div>
    <div id="cardMount"></div>
  </div>

  <div id="viewDeck" style="display:none;">
    <div class="card">
      <div class="card-head">
        <h3 style="margin:0;font-size:1.1rem">Your Stored Attempts & 1–7–21 Spaced Queue</h3>
        <button class="mini-btn" data-action="export-json">Export Attempts</button>
      </div>
      <p style="color:var(--muted);font-size:0.84rem;margin:0 0 14px;">
        Every live article you complete is stored here permanently with your recall score, missed keywords, and next review date.
      </p>
      <div id="deckListMount"></div>
    </div>
  </div>
</div>

<script>
(function() {
  // 1. LIVE DOMAIN CLASSIFIER & SYLLABUS LINKAGE RULES (Used to articulate raw live RSS articles)
  const GS_CLASSIFIER_RULES = [
    {
      paper: "GS-2",
      subtopic: "Polity, Constitution & Governance",
      triggers: ["supreme court", "high court", "constitution", "article", "parliament", "bill", "act", "governor", "president", "election", "eci", "cag", "federal", "state", "bail", "remission", "tribunal", "collegium", "bench", "verdict", "justice", "plea", "petition", "law", "rights", "cbi", "ed", "panchayat", "municipal", "census", "delimitation"],
      statutoryBase: "Constitutional Morality, Separation of Powers (Articles 14, 19, 21, 50, 72, 124, 142, 200, 226, 324) & Basic Structure Doctrine (Kesavananda Bharati 1973).",
      prelimsAngle: "Check exact Constitutional Articles, appointment/removal authorities, whether the body is constitutional vs statutory, and scope of judicial review.",
      mainsFramework: "Balance institutional autonomy with constitutional accountability, procedural due process, and cooperative federalism."
    },
    {
      paper: "GS-2",
      subtopic: "International Relations & Diplomacy",
      triggers: ["india", "china", "usa", "russia", "pakistan", "nepal", "bangladesh", "maldives", "sri lanka", "un", "unsc", "wto", "who", "imf", "world bank", "brics", "quad", "g20", "asean", "indo-pacific", "treaty", "summit", "bilateral", "foreign", "border", "lac", "maritime", "envoy", "diplomat", "tariff", "sanction", "israel", "iran", "ukraine"],
      statutoryBase: "Article 51 (Promotion of International Peace), Gujral Doctrine, Strategic Autonomy, SAGAR Vision & UNCLOS (1982) Maritime Zones.",
      prelimsAngle: "Verify member countries of the grouping, headquarters, geographic chokepoints/straits, and whether India is a signatory.",
      mainsFramework: "Analyze through Strategic Autonomy, De-hyphenated Multi-alignment, Supply Chain Resilience, and Voice of the Global South."
    },
    {
      paper: "GS-3",
      subtopic: "Indian Economy, Fiscal & Monetary Policy",
      triggers: ["rbi", "inflation", "gdp", "gst", "tax", "fiscal", "budget", "deficit", "repo", "monetary", "export", "import", "trade", "rupee", "forex", "bank", "npa", "sebi", "msme", "manufacturing", "pli", "agriculture", "msp", "farmer", "fertilizer", "subsidy", "infrastructure", "railway", "highway", "semiconductor", "startup"],
      statutoryBase: "RBI Act 1934 (Section 45ZB Monetary Policy Committee), FRBM Act 2003, Article 279A (GST Council) & Article 280 (Finance Commission).",
      prelimsAngle: "Distinguish between Revenue vs Capital expenditure, Core vs Headline inflation, Statutory vs Non-statutory bodies, and base-year calculations.",
      mainsFramework: "Connect macroeconomic stability with inclusive employment, Capex-led crowding-in, and supply-side structural reforms."
    },
    {
      paper: "GS-3",
      subtopic: "Environment, Biodiversity & Science-Tech",
      triggers: ["climate", "carbon", "emission", "renewable", "solar", "hydrogen", "ev", "wildlife", "tiger", "elephant", "bustard", "forest", "wetland", "ramsar", "pollution", "aqi", "plastic", "cop", "unfccc", "glacier", "monsoon", "cyclone", "disaster", "isro", "space", "satellite", "launch", "quantum", "biotech", "vaccine", "disease", "virus", "genome"],
      statutoryBase: "Article 21 & 48A, Wildlife Protection Act 1972, Environment Protection Act 1986, UNFCCC CBDR-RC Principle & Panchamrit Targets.",
      prelimsAngle: "Identify IUCN Red List status, WPA Schedule, CITES Appendix, parent Ministry, or technical orbital/biological mechanism.",
      mainsFramework: "Reconcile developmental infrastructure with Ecological Jurisprudence, Climate Justice, and Indigenous R&D indigenization."
    },
    {
      paper: "GS-4",
      subtopic: "Ethics, AI Governance & Public Integrity",
      triggers: ["ethics", "ai", "artificial intelligence", "deepfake", "algorithm", "privacy", "data protection", "cyber", "corruption", "lokpal", "transparency", "rti", "whistleblower", "empathy", "probity", "civil service", "conflict of interest", "social media", "censorship"],
      statutoryBase: "Justice K.S. Puttaswamy (2017) 4-Fold Proportionality Test, DPDP Act 2023, RTI Act 2005 & Nolan Committee's 7 Principles of Public Life.",
      prelimsAngle: "Check statutory adjudicatory mechanisms under the IT Act / DPDP Act and exemptions under Section 8 of the RTI Act.",
      mainsFramework: "Evaluate through Algorithmic Accountability, Human-in-the-Loop oversight, Probity in Governance, and Constitutional Morality."
    },
    {
      paper: "GS-1",
      subtopic: "Indian Society, Demographics & Culture",
      triggers: ["women", "gender", "caste", "tribe", "sc", "st", "obc", "urban", "migration", "slum", "heritage", "unesco", "temple", "archaeology", "asi", "classical", "language", "population", "fertility", "aging", "youth", "education", "literacy", "marital", "patriarchy", "care economy"],
      statutoryBase: "Articles 14, 15, 16, 17, 21, 29, 30, 39, 46, 49 (Protection of Monuments) & 106th Constitutional Amendment Act.",
      prelimsAngle: "Check demographic transition parameters (TFR replacement level 2.1), constitutional safeguards for vulnerable groups, and historical chronology.",
      mainsFramework: "Link social empowerment with Care Economy valuation, Gender-Responsive Budgeting, and Substantive Equality."
    }
  ];

  // 2. EMERGENCY OFFLINE FALLBACK POOL (Used ONLY if user has zero internet connection)
  const OFFLINE_FALLBACK_BANK = [
    {
      title: "[Offline Mode] Delimitation Commission & Federal Representation Parity",
      source: "Offline Static Backup",
      link: "",
      paper: "GS-2",
      subtopic: "Polity & Federalism",
      keywords: ["Article 82", "Article 170", "84th Amendment", "2026", "Article 329", "Sarkaria"],
      context: "No live internet detected. Showing offline backup: Constitutional debate over post-2026 census seat readjustment and demographic transition parity.",
      prelims: [
        "Under Article 329(a), Delimitation Commission orders carry force of law and cannot be challenged in any court.",
        "84th Amendment Act (2001) froze total Lok Sabha seats until the first census conducted after 2026."
      ],
      anchors: [
        "Constitutional Linkage: Article 82 (Parliamentary reallocation) & Article 170 (State Legislative Assemblies).",
        "Core Tension: One-person-one-vote democratic parity vs penalizing states that stabilized population growth.",
        "Institutional Precedent: Delimitation Commissions have been constituted 4 times (1952, 1963, 1973, 2002)."
      ],
      mains: {
        intro: "Delimitation operationalizes proportional representation under Articles 82 and 170 while testing federal cohesion.",
        keywords: ["Asymmetrical Federalism", "Constitutional Freeze", "Demographic Penalty"],
        wayForward: "Freeze inter-state Lok Sabha ratios or expand Rajya Sabha federal checks to protect low-TFR states."
      }
    },
    {
      title: "[Offline Mode] Right Against Climate Change & Great Indian Bustard",
      source: "Offline Static Backup",
      link: "",
      paper: "GS-3",
      subtopic: "Environment & Jurisprudence",
      keywords: ["Article 21", "Article 14", "Article 48A", "Ranjitsinh", "WPA 1972", "Critically Endangered"],
      context: "No live internet detected. Showing offline backup: Supreme Court recognition of fundamental right against adverse climate impacts.",
      prelims: [
        "M.K. Ranjitsinh (2024) linked the right against climate change directly to Articles 14 and 21.",
        "Great Indian Bustard is Critically Endangered (IUCN) and listed in Schedule I of WPA 1972."
      ],
      anchors: [
        "Constitutional Synergy: Article 21 read with Article 48A (DPSP) and Article 51A(g) (Fundamental Duty).",
        "Policy Dilemma: High-voltage solar transmission lines vs critically endangered grassland habitat protection.",
        "International Anchor: India's Panchamrit commitment of 500 GW non-fossil electricity capacity by 2030."
      ],
      mains: {
        intro: "The Supreme Court's recognition of climate rights under Article 21 elevates environmental protection to constitutional jurisprudence.",
        keywords: ["Ecological Jurisprudence", "Just Energy Transition", "Biodiversity Mainstreaming"],
        wayForward: "Enforce underground cabling in core breeding zones and deploy bird diverters via expert technical committees."
      }
    }
  ];

  // Stopwords ignored when extracting live keywords from news text
  const STOPWORDS = new Set([
    "the","and","for","that","with","from","this","have","has","had","were","was","are","will","would","could","should",
    "about","into","over","after","before","under","between","through","during","without","within","along","following",
    "india","indian","government","centre","state","states","minister","ministry","official","officials","said","says",
    "also","more","most","other","some","such","than","then","them","they","their","there","these","those","which","while",
    "where","when","what","who","whom","whose","year","years","time","today","week","month","report","reports","news",
    "explained","hindu","express","first","second","three","four","five","many","much","very","been","being","make","made"
  ]);

  // 3. DYNAMIC LIVE ARTICULATOR: Converts any raw live RSS article into a structured UPSC Study Card
  function articulateLiveArticle(rawItem, index) {
    const rawTitle = (rawItem.title || "National Policy Update")
      .replace(/ - The Hindu| - Indian Express| \| Explained News| \| India News/gi, "")
      .trim();

    // Strip HTML tags and clean description/content
    const rawHtml = (rawItem.content || rawItem.description || "");
    const cleanBody = rawHtml
      .replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, "")
      .replace(/<style[\s\S]*?>[\s\S]*?<\/style>/gi, "")
      .replace(/<[^>]+>/g, " ")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\s+/g, " ")
      .trim();

    const fullText = rawTitle + ". " + cleanBody;
    const lowerText = fullText.toLowerCase();

    // A. Determine best GS Paper & Subtopic based on live article vocabulary
    let bestRule = GS_CLASSIFIER_RULES[index % GS_CLASSIFIER_RULES.length];
    let bestScore = -1;
    for (let i = 0; i < GS_CLASSIFIER_RULES.length; i++) {
      const rule = GS_CLASSIFIER_RULES[i];
      let score = 0;
      for (let j = 0; j < rule.triggers.length; j++) {
        const trig = rule.triggers[j];
        if (lowerText.includes(trig)) {
          score += (rawTitle.toLowerCase().includes(trig) ? 4 : 2);
        }
      }
      if (score > bestScore) {
        bestScore = score;
        bestRule = rule;
      }
    }

    // B. Extract real sentences from the live article
    const sentences = cleanBody
      .split(/(?<=[.?!])\s+/)
      .map(s => s.trim())
      .filter(s => s.length > 35 && s.length < 280);

    const contextSummary = sentences.length >= 2
      ? sentences.slice(0, 2).join(" ")
      : (cleanBody.length > 30 ? cleanBody.slice(0, 320) + "..." : rawTitle);

    // C. Extract Live UPSC Keywords (Articles, Acts, Numbers, Proper Entities, Domain Terms)
    const extractedKeywords = [];
    const addKw = (w) => {
      const clean = w.replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g, "").trim();
      if (clean.length >= 3 && !STOPWORDS.has(clean.toLowerCase())) {
        if (!extractedKeywords.some(k => k.toLowerCase() === clean.toLowerCase())) {
          extractedKeywords.push(clean);
        }
      }
    };

    // 1. Check for specific Constitutional Articles / Sections / Amendments / Years in live text
    const statutoryMatches = fullText.match(/\b(Article\s+\d+[A-Z]?|Section\s+\d+[A-Z]?|\d+(?:st|nd|rd|th)\s+Amendment|[A-Z][a-zA-Z]+\s+Act|\b20\d\d\b)/g) || [];
    statutoryMatches.forEach(m => addKw(m));

    // 2. Check for matched UPSC domain triggers present in this live article
    bestRule.triggers.forEach(trig => {
      if (lowerText.includes(trig) && extractedKeywords.length < 6) {
        addKw(trig.toUpperCase().length <= 4 ? trig.toUpperCase() : trig.charAt(0).toUpperCase() + trig.slice(1));
      }
    });

    // 3. Extract capitalized proper nouns/acronyms from the live headline
    const titleWords = rawTitle.split(/\s+/);
    titleWords.forEach(w => {
      if (/^[A-Z][a-zA-Z0-9-]{2,}$/.test(w) && extractedKeywords.length < 6) {
        addKw(w);
      }
    });

    // Ensure at least 5 testable keywords
    const fallbackKws = ["Constitution", "Statutory", "Accountability", "Federalism", "Sustainability"];
    let fIdx = 0;
    while (extractedKeywords.length < 5) {
      addKw(fallbackKws[fIdx++ % fallbackKws.length]);
    }
    const finalKeywords = extractedKeywords.slice(0, 6);

    // D. Articulate Static Anchors & Prelims Traps tailored to the live article
    const liveKeyInsight = sentences.length >= 3
      ? sentences[2]
      : `Core issue in news: ${rawTitle} — requires linking current event developments with static ${bestRule.paper} syllabus provisions.`;

    const anchors = [
      `Live Article Core Point: ${liveKeyInsight}`,
      `Syllabus & Constitutional Linkage (${bestRule.subtopic}): ${bestRule.statutoryBase}`,
      `Analytical Dimension: Evaluate how "${finalKeywords.slice(0, 3).join(", ")}" impacts institutional governance and policy implementation.`
    ];

    const prelimsTraps = [
      `Live Entity Check: Verify the exact constitutional/statutory backing, parent Ministry, or mandate related to "${finalKeywords[0]}" and "${finalKeywords[1]}".`,
      `UPSC Trap Alert (${bestRule.paper}): ${bestRule.prelimsAngle}`
    ];

    const mainsSnippet = {
      intro: `Recent developments regarding "${rawTitle.slice(0, 75)}${rawTitle.length > 75 ? "..." : ""}" highlight critical challenges in ${bestRule.subtopic}.`,
      keywords: [finalKeywords[0], finalKeywords[1], bestRule.subtopic.split("&")[0].trim()],
      wayForward: bestRule.mainsFramework
    };

    return {
      id: "live_" + Date.now() + "_" + index,
      title: rawTitle,
      source: rawItem.sourceName || "Live National Feed",
      link: rawItem.link || "",
      paper: bestRule.paper,
      subtopic: bestRule.subtopic,
      keywords: finalKeywords,
      context: contextSummary,
      prelims: prelimsTraps,
      anchors: anchors,
      mains: mainsSnippet
    };
  }

  // 4. MULTI-PIPELINE LIVE NEWS FETCHER (Fetches real live RSS feeds with redundancy)
  const LIVE_RSS_FEEDS = [
    { name: "Indian Express Explained", url: "https://indianexpress.com/section/explained/feed/" },
    { name: "The Hindu National", url: "https://www.thehindu.com/news/national/feeder/default.rss" },
    { name: "The Hindu Opinion", url: "https://www.thehindu.com/opinion/editorial/feeder/default.rss" }
  ];

  async function fetchFeedViaRss2Json(feedObj) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6500);
    const endpoint = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feedObj.url);
    const res = await fetch(endpoint, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error("rss2json status " + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.items) || !data.items.length) throw new Error("Empty rss2json items");
    return data.items.map(it => ({
      title: it.title || "",
      description: it.description || "",
      content: it.content || "",
      link: it.link || "",
      pubDate: it.pubDate || "",
      sourceName: feedObj.name
    }));
  }

  async function fetchFeedViaAllOrigins(feedObj) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 7000);
    const endpoint = "https://api.allorigins.win/get?url=" + encodeURIComponent(feedObj.url);
    const res = await fetch(endpoint, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error("allorigins status " + res.status);
    const data = await res.json();
    if (!data || !data.contents) throw new Error("Empty XML");
    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, "text/xml");
    const items = Array.from(xml.querySelectorAll("item"));
    if (!items.length) throw new Error("No XML items");
    return items.map(node => ({
      title: (node.querySelector("title") && node.querySelector("title").textContent) || "",
      description: (node.querySelector("description") && node.querySelector("description").textContent) || "",
      content: "",
      link: (node.querySelector("link") && node.querySelector("link").textContent) || "",
      pubDate: (node.querySelector("pubDate") && node.querySelector("pubDate").textContent) || "",
      sourceName: feedObj.name
    }));
  }

  async function pullFreshLiveUpscArticles() {
    let rawPool = [];

    // Try primary pipeline across feeds
    for (let i = 0; i < LIVE_RSS_FEEDS.length; i++) {
      try {
        const items = await fetchFeedViaRss2Json(LIVE_RSS_FEEDS[i]);
        rawPool = rawPool.concat(items.slice(0, 4));
      } catch (e) {
        try {
          const fallbackItems = await fetchFeedViaAllOrigins(LIVE_RSS_FEEDS[i]);
          rawPool = rawPool.concat(fallbackItems.slice(0, 4));
        } catch (err2) {}
      }
      if (rawPool.length >= 8) break;
    }

    if (rawPool.length === 0) {
      throw new Error("All live news pipelines unreachable");
    }

    // Deduplicate by title and filter out sports/entertainment/horoscope noise
    const seen = new Set();
    const filtered = rawPool.filter(item => {
      const t = (item.title || "").toLowerCase();
      if (t.length < 18) return false;
      if (/cricket|ipl|bollywood|horoscope|movie|actor|football|tennis|quiz/.test(t)) return false;
      const key = t.slice(0, 35);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    const selectedRaw = (filtered.length >= 5 ? filtered : rawPool).slice(0, 5);
    return selectedRaw.map((raw, idx) => articulateLiveArticle(raw, idx));
  }

    const now = new Date();

  }

    const d = new Date();

    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function addDaysStr(baseStr, days) {
    const p = baseStr.split("-").map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    d.setDate(d.getDate() + days);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

            ${card.userAttempt ? `
              <div style="font-size:0.76rem;color:#93c5fd;margin-top:4px;">
                <strong>Your Saved Notes:</strong> ${escapeHtml([card.userAttempt.p1, card.userAttempt.p2, card.userAttempt.p4].filter(Boolean).join(" | ").slice(0, 140))}
              </div>
            ` : ""}
            ${card.misses && card.misses.length ? `<div style="font-size:0.75rem;color:var(--warn);margin-top:3px;">Missed Keywords: ${escapeHtml(card.misses.join(", "))}</div>` : `<div style="font-size:0.75rem;color:var(--good);margin-top:3px;">✓ All Keywords Matched</div>`}
          </div>
          <div style="display:flex;gap:6px;">
            <button class="mini-btn" data-action="retest-deck-card" data-id="${card.id}">Retest</button>
            <button class="mini-btn" style="color:var(--bad);" data-action="delete-deck-card" data-id="${card.id}">✕</button>
          </div>
        </div>
      `;
    }).join("");
  }

  // 6. GLOBAL DELEGATED CLICK HANDLER
  document.addEventListener("click", function(e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.getAttribute("data-action");

    if (action === "switch-study") {
      activeTab = "study";
      document.getElementById("viewStudy").style.display = "block";
      document.getElementById("viewDeck").style.display = "none";
      document.getElementById("tabBtnStudy").classList.add("active");
      document.getElementById("tabBtnDeck").classList.remove("active");
      renderAll();
    } else if (action === "switch-deck") {
      activeTab = "deck";
      document.getElementById("viewStudy").style.display = "none";
      document.getElementById("viewDeck").style.display = "block";
      document.getElementById("tabBtnDeck").classList.add("active");
      document.getElementById("tabBtnStudy").classList.remove("active");
      renderDeckList();
    } else if (action === "force-live-sync") {
      currentIdx = 0;
      stage = "study";
      loadArticlesForDate(true);
    } else if (action === "day-prev") {
      dayOffset -= 1;
      currentIdx = 0;
      stage = "study";
      loadArticlesForDate(false);
    } else if (action === "day-next") {
      dayOffset += 1;
      currentIdx = 0;
      stage = "study";
      loadArticlesForDate(false);
    } else if (action === "day-today") {
      dayOffset = 0;
      currentIdx = 0;
      stage = "study";
      loadArticlesForDate(false);
    } else if (action === "jump-article") {
      const idx = parseInt(el.getAttribute("data-idx"), 10);
      if (!isNaN(idx) && idx >= 0 && idx < dailyBatch.length) {
        currentIdx = idx;
        stage = "study";
        restoreAttemptForCurrentIndex();
        renderAll();
      }
    } else if (action === "mode-mains") {
      activeMode = "mains";
      renderAll();
    } else if (action === "mode-prelims") {
      activeMode = "prelims";
      renderAll();
    } else if (action === "go-recall") {
      stage = "recall";
      renderAll();
    } else if (action === "back-study") {
      stage = "study";
      renderAll();
    } else if (action === "next-article") {
      currentIdx += 1;
      stage = "study";
      restoreAttemptForCurrentIndex();
      renderAll();
    } else if (action === "evaluate-recall") {
      recallInputs.p1 = (document.getElementById("peg1") || {}).value?.trim() || "";
      recallInputs.p2 = (document.getElementById("peg2") || {}).value?.trim() || "";
      recallInputs.p3 = (document.getElementById("peg3") || {}).value?.trim() || "";
      recallInputs.p4 = (document.getElementById("peg4") || {}).value?.trim() || "";

      const combined = (recallInputs.p1 + " " + recallInputs.p2 + " " + recallInputs.p3 + " " + recallInputs.p4).toLowerCase();
      const art = dailyBatch[currentIdx];
      lastHits = [];
      lastMisses = [];

      art.keywords.forEach(kw => {
        const tokens = kw.toLowerCase().split(/\s+/);
        const matched = tokens.some(t => t.length >= 2 && combined.includes(t));
        if (matched) lastHits.push(kw);
        else lastMisses.push(kw);
      });

      // Persist this attempt immediately for this date & article index
      saveDayAttempt(getSelectedDateStr(), currentIdx, {
        inputs: { ...recallInputs },
        hits: [...lastHits],
        misses: [...lastMisses],
        timestamp: Date.now()
      });

      stage = "diff";
      renderAll();
    } else if (action === "go-summary") {
      stage = "summary";
      renderAll();
    } else if (action === "save-card-next") {
      const art = dailyBatch[currentIdx];
      const interval = lastMisses.length <= 2 ? 21 : (lastMisses.length <= 4 ? 7 : 1);
      const deck = getDeck();

      if (retestingCardId) {
        const oldIdx = deck.findIndex(c => String(c.id) === String(retestingCardId));
        if (oldIdx > -1) deck.splice(oldIdx, 1);
        retestingCardId = null;
      }

      deck.unshift({
        id: Date.now(),
        title: art.title,
        source: art.source,
        link: art.link,
        paper: art.paper,
        subtopic: art.subtopic,
        context: art.context,
        prelims: art.prelims,
        anchors: art.anchors,
        keywords: art.keywords,
        mains: art.mains,
        userAttempt: { ...recallInputs },
        misses: lastMisses,
        interval: interval,
        learnedDate: getSelectedDateStr(),
        dueDate: addDaysStr(getRealTodayStr(), interval)
      });
      saveDeck(deck);

      currentIdx += 1;
      stage = "study";
      restoreAttemptForCurrentIndex();
      renderAll();
    } else if (action === "restart-batch") {
      currentIdx = 0;
      stage = "study";
      restoreAttemptForCurrentIndex();
      renderAll();
    } else if (action === "delete-deck-card") {
      const id = el.getAttribute("data-id");
      saveDeck(getDeck().filter(c => String(c.id) !== String(id)));
      renderDeckList();
    } else if (action === "retest-deck-card") {
      const id = el.getAttribute("data-id");
      const card = getDeck().find(c => String(c.id) === String(id));
      if (card) {
        retestingCardId = card.id;
        dailyBatch[currentIdx] = card;
        recallInputs = card.userAttempt || { p1: "", p2: "", p3: "", p4: "" };
        activeTab = "study";
        stage = "recall";
        document.getElementById("viewStudy").style.display = "block";
        document.getElementById("viewDeck").style.display = "none";
        document.getElementById("tabBtnStudy").classList.add("active");
        document.getElementById("tabBtnDeck").classList.remove("active");
        renderAll();
      }
    } else if (action === "export-json") {
      const blob = new Blob([JSON.stringify(getDeck(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "upsc-attempts-and-deck.json";
      a.click();
    }
  });

  // 7. MIDNIGHT AUTO-REFRESH CLOCK
  let trackedDay = getRealTodayStr();
  function tickClock() {
    const now = new Date();
    const tmrw = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    const diff = Math.max(0, tmrw - now);
    const h = String(Math.floor(diff / 3600000)).padStart(2, "0");
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");
    const el = document.getElementById("midnightTimer");
    if (el) el.textContent = `${h}:${m}:${s}`;

    const cur = getRealTodayStr();
    if (cur !== trackedDay) {
      trackedDay = cur;
      dayOffset = 0;
      currentIdx = 0;
      stage = "study";
      loadArticlesForDate(true);
    }
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // Boot
  tickClock();
  setInterval(tickClock, 1000);
  loadArticlesForDate(false);
})();
</script>
