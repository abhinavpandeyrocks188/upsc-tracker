<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UPSC Super Recall — Executive Study Cockpit</title>
<meta name="theme-color" content="#040711">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UPSC Recall">
<link id="dynamicFavicon" rel="icon" type="image/png">
<link id="dynamicTouchIcon" rel="apple-touch-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #040711;
  --bg-aurora: radial-gradient(circle at 10% 0%, rgba(37, 99, 235, 0.22) 0%, transparent 48%),
               radial-gradient(circle at 90% 8%, rgba(16, 185, 129, 0.14) 0%, transparent 45%),
               radial-gradient(circle at 50% 100%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
               #040711;
  --surface: rgba(13, 20, 38, 0.92);
  --surface-card: #0d1629;
  --surface-elev: #15223d;
  --border: rgba(56, 189, 248, 0.22);
  --border-subtle: #1e2f52;
  --text: #f8fafc;
  --text-soft: #cbd5e1;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --gold: #f59e0b;
  --good: #10b981;
  --bad: #f43f5e;
  --purple: #c084fc;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-aurora);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.62;
  padding: 14px 16px 70px;
  min-height: 100vh;
}

/* Adaptive Container: Wide Cockpit on Laptop, Compact Shell on Mobile */
.shell { max-width: 1240px; margin: 0 auto; }

/* Executive Topbar */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px; padding: 14px 20px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; backdrop-filter: blur(16px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45); margin-bottom: 14px;
}
.brand-wrap { display: flex; align-items: center; gap: 12px; }
.emblem {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, #1e3a8a 0%, #091326 100%);
  border: 1.5px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.25rem; box-shadow: 0 0 16px rgba(245, 158, 11, 0.25);
}
.brand-title h1 {
  font-family: 'Outfit', sans-serif; font-size: 1.36rem; font-weight: 800;
  margin: 0; letter-spacing: -0.02em;
  background: linear-gradient(90deg, #ffffff 35%, #7dd3fc 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-title p { margin: 1px 0 0; font-size: 0.74rem; color: var(--muted); font-weight: 500; }

.status-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.live-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px; font-size: 0.73rem; font-weight: 700;
  background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); color: #34d399;
}
.live-pill.syncing { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.4); color: var(--accent); }
.live-pill.offline { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.4); color: var(--gold); }
.pulse-dot {
  width: 7px; height: 7px; border-radius: 50%; background: currentColor;
  box-shadow: 0 0 8px currentColor; animation: pulse 1.6s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.clock-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 0.73rem; font-weight: 700;
  padding: 6px 11px; border-radius: 999px; background: var(--surface-card);
  border: 1px solid var(--border-subtle); color: var(--gold);
}

/* Navigation & Date Controls */
.nav-bar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
}
.seg-tabs {
  display: flex; background: var(--surface); padding: 4px;
  border-radius: 12px; border: 1px solid var(--border-subtle);
}
.seg-btn {
  background: transparent; border: none; color: var(--muted);
  font-weight: 700; font-size: 0.81rem; padding: 8px 16px;
  border-radius: 9px; cursor: pointer; transition: 0.2s;
}
.seg-btn.active {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
}
.date-ctrl {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); padding: 4px 6px;
  border-radius: 12px; border: 1px solid var(--border-subtle);
}
.tool-btn {
  background: var(--surface-card); border: 1px solid var(--border-subtle);
  color: var(--text); font-size: 0.75rem; font-weight: 700;
  padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.15s;
}
.tool-btn:hover { border-color: var(--accent); }
.tool-btn.sync-highlight {
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(37, 99, 235, 0.22));
  border-color: var(--accent); color: #7dd3fc;
}
.tool-btn:active { transform: scale(0.95); }
.date-txt {
  font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
  font-weight: 700; padding: 0 8px; color: var(--accent);
}

/* 5-Article Selector Ribbon */
.ribbon {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px;
}
.rib-item {
  background: var(--surface); border: 1px solid var(--border-subtle);
  border-radius: 12px; padding: 10px 12px; cursor: pointer; transition: 0.2s;
}
.rib-item:hover { border-color: rgba(56, 189, 248, 0.4); transform: translateY(-1px); }
.rib-item.active {
  border-color: var(--accent); background: rgba(56, 189, 248, 0.14);
  box-shadow: 0 4px 16px rgba(56, 189, 248, 0.2);
}
.rib-item.done { border-color: var(--good); }
.rib-top {
  font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
  font-weight: 800; color: var(--muted); display: flex; justify-content: space-between;
}
.rib-headline {
  font-size: 0.76rem; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px;
}
@media (max-width: 720px) {
  .rib-headline { display: none; }
  .rib-item { text-align: center; padding: 8px 4px; }
  .rib-top { justify-content: center; gap: 4px; }
}

/* Main Stage Card */
.stage-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 22px; padding: 24px;
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(16px); margin-bottom: 18px;
}
.meta-strip {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
}
.tag-cluster { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gs-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 0.74rem;
  font-weight: 800; padding: 4px 11px; border-radius: 7px;
}
.gs-pill.GS-1 { background: rgba(244, 63, 94, 0.18); color: #fda4af; border: 1px solid var(--bad); }
.gs-pill.GS-2 { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; border: 1px solid var(--accent); }
.gs-pill.GS-3 { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border: 1px solid var(--good); }
.gs-pill.GS-4 { background: rgba(192, 132, 252, 0.18); color: #e9d5ff; border: 1px solid var(--purple); }

.syl-pill {
  font-size: 0.73rem; font-weight: 700; padding: 4px 11px;
  border-radius: 7px; background: var(--surface-elev);
  border: 1px solid var(--border-subtle); color: #e2e8f0;
}

.view-switcher {
  display: inline-flex; background: #060a15; padding: 3px;
  border-radius: 9px; border: 1px solid var(--border-subtle);
}
.v-btn {
  background: transparent; border: none; color: var(--muted);
  font-size: 0.74rem; font-weight: 700; padding: 5px 12px;
  border-radius: 6px; cursor: pointer;
}
.v-btn.active { background: var(--surface-elev); color: var(--accent); }

.art-headline {
  font-family: 'Outfit', sans-serif; font-size: 1.44rem; font-weight: 800;
  line-height: 1.3; margin: 0 0 18px; color: #ffffff; letter-spacing: -0.01em;
}

/* Desktop Split Cockpit vs Mobile Stack */
.cockpit-split {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}
@media (min-width: 960px) {
  .cockpit-split {
    grid-template-columns: 5fr 7fr;
    align-items: start;
  }
}

/* Digestible News Brief Card */
.news-digest-card {
  background: linear-gradient(180deg, rgba(21, 34, 61, 0.88) 0%, rgba(13, 22, 41, 0.94) 100%);
  border: 1px solid var(--border-subtle); border-left: 4px solid var(--accent);
  border-radius: 14px; padding: 16px 18px; margin-bottom: 14px;
}
.card-kicker {
  font-size: 0.69rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--accent); margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.digest-list { margin: 0; padding-left: 18px; }
.digest-list li { margin-bottom: 8px; font-size: 0.92rem; color: var(--text-soft); }
.digest-list li strong { color: #ffffff; font-weight: 700; }

/* Prelims 2-Statement Mock Box */
.mcq-card {
  background: rgba(245, 158, 11, 0.05);
  border: 1px solid rgba(245, 158, 11, 0.35);
  border-radius: 14px; padding: 15px 17px; margin-bottom: 14px;
}
.mcq-title {
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--gold); margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.mcq-stmt { font-size: 0.87rem; color: #f1f5f9; margin-bottom: 6px; padding-left: 8px; border-left: 2px solid var(--gold); }
.mcq-ans-box {
  display: none; margin-top: 10px; padding: 10px 12px;
  background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.35);
  border-radius: 9px; font-size: 0.84rem; color: #d1fae5;
}
.mcq-ans-box.open { display: block; }

/* Mains Directive Box */
.mains-prompt-card {
  background: rgba(192, 132, 252, 0.06);
  border: 1px solid rgba(192, 132, 252, 0.3);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
}
.mains-prompt-title {
  font-size: 0.69rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--purple); margin-bottom: 5px;
}
.mains-prompt-q { font-size: 0.88rem; font-weight: 600; color: #f3e8ff; font-style: italic; }

/* 4-Quad Dynamic Synthesis Grid */
.quad-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;
}
@media (max-width: 640px) { .quad-grid { grid-template-columns: 1fr; } }

.quad-box {
  background: var(--surface-card); border: 1px solid var(--border-subtle);
  border-top: 3px solid var(--accent); border-radius: 13px; padding: 14px 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}
.quad-box.q-green { border-top-color: var(--good); }
.quad-box.q-purple { border-top-color: var(--purple); }
.quad-box.q-gold { border-top-color: var(--gold); }

.quad-label {
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
}
.quad-body { font-size: 0.87rem; color: #e2e8f0; line-height: 1.56; }
.quad-body strong { color: #fff; }

/* Keywords Vault */
.kw-vault {
  background: #070c18; border: 1px solid var(--border-subtle);
  border-radius: 13px; padding: 14px 16px; margin-bottom: 16px;
}
.kw-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.77rem; font-weight: 700; padding: 5px 12px;
  border-radius: 999px; margin: 4px 6px 4px 0;
  background: #13203d; border: 1px solid #284275; color: #93c5fd;
}
.kw-chip.hit { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border-color: var(--good); }
.kw-chip.miss { background: rgba(244, 63, 94, 0.16); color: #fda4af; border-color: var(--bad); }

/* Hero Recall Command Dock */
.hero-recall-dock {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.16) 0%, rgba(37, 99, 235, 0.28) 100%);
  border: 1px solid rgba(56, 189, 248, 0.55);
  border-radius: 16px; padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 14px; margin-top: 6px;
  box-shadow: 0 10px 30px rgba(2, 132, 199, 0.25);
}
.hero-dock-text h4 {
  margin: 0; font-family: 'Outfit', sans-serif; font-size: 1.08rem;
  font-weight: 800; color: #ffffff;
}
.hero-dock-text p { margin: 2px 0 0; font-size: 0.81rem; color: #bae6fd; }
.hero-btn {
  background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
  color: #ffffff; border: none; border-radius: 12px;
  padding: 13px 24px; font-family: 'Outfit', sans-serif;
  font-size: 0.96rem; font-weight: 800; letter-spacing: 0.01em;
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 6px 20px rgba(234, 88, 12, 0.45); transition: 0.15s;
}
.hero-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.hero-btn:active { transform: scale(0.97); }

/* 4-Peg Form */
.peg-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}
@media (max-width: 720px) { .peg-grid { grid-template-columns: 1fr; } }

.peg-field { margin-bottom: 12px; }
.peg-field label { display: block; font-size: 0.8rem; font-weight: 700; color: #93c5fd; margin-bottom: 5px; }
.peg-inp {
  width: 100%; background: #060a14; border: 1px solid var(--border-subtle);
  border-radius: 10px; padding: 11px 14px; color: var(--text);
  font-family: inherit; font-size: 0.9rem;
}
.peg-inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18); }
textarea.peg-inp { min-height: 76px; resize: vertical; }

.btn-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.sec-btn {
  background: var(--surface-elev); color: var(--text);
  border: 1px solid var(--border-subtle); border-radius: 10px;
  padding: 11px 16px; font-size: 0.84rem; font-weight: 700; cursor: pointer;
}
.banner-note {
  background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35);
  color: #7dd3fc; padding: 10px 14px; border-radius: 11px;
  font-size: 0.81rem; font-weight: 600; margin-bottom: 14px;
}
.deck-card {
  background: var(--surface-card); border: 1px solid var(--border-subtle);
  border-left: 4px solid var(--accent); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap;
}
.ext-link { color: var(--accent); text-decoration: none; font-size: 0.74rem; font-weight: 700; }
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="emblem">🏛️</div>
      <div class="brand-title">
        <h1>UPSC Super Recall</h1>
        <p>Live Multi-Channel Synthesis • 1–7–21 Spaced Memory Cockpit</p>
      </div>
    </div>
    <div class="status-row">
      <div class="live-pill syncing" id="statusPill">
        <span class="pulse-dot"></span>
        <span id="statusText">Synthesizing Live Channels...</span>
      </div>
      <button class="tool-btn sync-highlight" data-action="force-sync" title="Guaranteed 5 brand-new live articles on every click">🔄 Pull New Live Set</button>
      <div class="clock-pill" id="timerClock">00:00:00</div>
    </div>
  </header>

  <div class="nav-bar">
    <div class="seg-tabs">
      <button class="seg-btn active" id="tabBtnStudy" data-action="tab-study">Daily Recall Cockpit (5)</button>
      <button class="seg-btn" id="tabBtnDeck" data-action="tab-deck">Spaced Revision Deck (<span id="deckCount">0</span>)</button>
    </div>
    <div class="date-ctrl">
      <button class="tool-btn" data-action="prev-day">◀ Prev</button>
      <span class="date-txt" id="dateLabel">--</span>
      <button class="tool-btn" data-action="today-day">Today</button>
      <button class="tool-btn" data-action="next-day">Next ▶</button>
    </div>
  </div>

  <div id="bannerMount"></div>

  <div id="studyView">
    <div class="ribbon" id="articleRibbon"></div>
    <div id="stageMount"></div>
  </div>

  <div id="deckView" style="display:none;">
    <div class="stage-wrap">
      <div class="meta-strip">
        <h3 style="margin:0;font-size:1.15rem;font-family:'Outfit',sans-serif;">Your Stored Attempts & 1–7–21 Spaced Queue</h3>
        <button class="tool-btn" data-action="export-deck">Export Backup JSON</button>
      </div>
      <p style="color:var(--muted);font-size:0.84rem;margin:0 0 14px;">
        Every completed article is archived with your written recall pegs, missed keywords, and next review date.
      </p>
      <div id="deckMount"></div>
    </div>
  </div>
</div>

<script>
(function() {
  // 0. CUSTOM HOMESCREEN BADGE ICON GENERATOR
  function buildHomescreenIcon() {
    try {
      const c = document.createElement("canvas");
      c.width = 192; c.height = 192;
      const ctx = c.getContext("2d");
      const g = ctx.createLinearGradient(0, 0, 192, 192);
      g.addColorStop(0, "#091326"); g.addColorStop(1, "#1e3a8a");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.roundRect(0, 0, 192, 192, 42); ctx.fill();
      ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(96, 80, 40, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 12; i++) {
        const a = (i * Math.PI) / 6;
        ctx.beginPath();
        ctx.moveTo(96 + Math.cos(a) * 12, 80 + Math.sin(a) * 12);
        ctx.lineTo(96 + Math.cos(a) * 38, 80 + Math.sin(a) * 38);
        ctx.stroke();
      }
      ctx.fillStyle = "#ffffff"; ctx.font = "800 34px sans-serif";
      ctx.textAlign = "center"; ctx.fillText("UPSC", 96, 160);
      const url = c.toDataURL("image/png");
      document.getElementById("dynamicFavicon").href = url;
      document.getElementById("dynamicTouchIcon").href = url;
    } catch (e) {}
  }
  buildHomescreenIcon();

  // 1. CONDITIONAL UPSC STATUTORY & CONSTITUTIONAL LEXICON
  // Strictly applied ONLY when the exact regex matches the live article!
  const CONDITIONAL_UPSC_RULES = [
    {
      regex: /\b(army|military|armed forces|court martial|adultery|air force|navy|defence personnel|afspa)\b/i,
      paper: "GS-2",
      subtopic: "Armed Forces, Article 33 & Defence Jurisprudence",
      provisions: "Article 33 empowers Parliament to restrict or abrogate Fundamental Rights in their application to members of the Armed Forces, paramilitary, and intelligence agencies to ensure discipline. Governed statutorily by the Army Act 1950, Navy Act 1957, and Armed Forces Tribunal (AFT) Act 2007.",
      precedents: "Joseph Shine v. Union of India (2018: 5-Judge Bench decriminalized adultery under Section 497 IPC as unconstitutional, while a 2023 Constitution Bench clarified that Armed Forces personnel can still be proceeded against for adultery as 'conduct unbecoming' under Article 33 to maintain military discipline).",
      prelimsTrap: "Under Article 33, the power to make laws restricting Fundamental Rights of Armed Forces vests EXCLUSIVELY in Parliament (State Legislatures cannot enact such laws).",
      falseStmt: "Both Parliament and State Legislatures hold concurrent competence under Article 33 to modify Fundamental Rights for police and paramilitary forces.",
      trueStmt: "Laws enacted by Parliament under Article 33 cannot be challenged in any court on the ground of contravening Fundamental Rights.",
      mainsQ: "Examine how Article 33 balances the imperative of military discipline with constitutional fundamental rights in India. (150 Words)",
      coreKws: ["Article 33", "Joseph Shine Case", "Army Act 1950", "Armed Forces Tribunal", "Military Discipline"]
    },
    {
      regex: /\b(judicial custody|police custody|preventive detention|preventive arrest|undertrial|bail|remand|default bail|habeas corpus|article 22|bnss)\b/i,
      paper: "GS-2",
      subtopic: "Personal Liberty, Custody & Preventive Detention",
      provisions: "Article 21 (Procedure established by law) & Article 22 (Protection against arrest and detention). Section 187 of Bharatiya Nagarik Suraksha Sanhita (BNSS, replacing Sec 167 CrPC) regulates Magistrate remand to Police Custody and Judicial Custody.",
      precedents: "Arnesh Kumar v. State of Bihar (2014: Mandatory checklist before arrest), Satender Kumar Antil (2022: 'Bail is the rule, jail is the exception'), Maneka Gandhi v. Union of India (1978: Substantive due process under Article 21).",
      prelimsTrap: "Under BNSS Section 187, the maximum 15 days of Police Custody can be authorized in parts during the initial 40 or 60 days of the 60/90-day detention period (unlike old CrPC 167 which restricted police custody strictly to the first 15 days).",
      falseStmt: "Under Article 22(2), the fundamental right to be produced before a magistrate within 24 hours applies unconditionally to both ordinary arrests and preventive detention.",
      trueStmt: "Article 22(3) explicitly excludes persons detained under preventive detention laws from the mandatory 24-hour magistrate production safeguard.",
      mainsQ: "'Bail is the rule and jail is the exception.' Critically analyze the reforms introduced under the Bharatiya Nagarik Suraksha Sanhita (BNSS) regarding custody and undertrial detention. (250 Words)",
      coreKws: ["Article 22", "BNSS Sec 187", "Arnesh Kumar", "Judicial Custody", "Preventive Detention"]
    },
    {
      regex: /\b(election commission|chief election commissioner|gyanesh kumar|cec|evm|vvpat|electoral roll|model code|article 324|voter)\b/i,

  // 2. SILENT INSTITUTIONAL KNOWLEDGE FETCHER (Uses open encyclopedia API under the hood, ZERO mention of Wikipedia in UI)
  async function fetchSilentInstitutionalDossier(searchQuery) {
    if (!searchQuery || searchQuery.length < 3) return null;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 3000);
      const searchUrl = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(searchQuery)}&limit=3&namespace=0&format=json&origin=*`;
      const sRes = await fetch(searchUrl, { signal: ctrl.signal });
      if (!sRes.ok) { clearTimeout(timer); return null; }
      const sData = await sRes.json();
      const titles = sData && Array.isArray(sData[1]) ? sData[1] : [];
      if (!titles.length) { clearTimeout(timer); return null; }

      const bestTitle = titles[0];
      const sumUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(bestTitle)}`;
      const sumRes = await fetch(sumUrl, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!sumRes.ok) return null;
      const sumData = await sumRes.json();
      if (sumData && sumData.extract && sumData.extract.length > 50) {
        if (/is a city and|is a megacity|is a municipality|is a town in/i.test(sumData.extract)) return null;
        const sentences = sumData.extract.split(/(?<=[.?!])\s+/).slice(0, 3).join(" ");
        return {
          title: sumData.title || bestTitle,
          extract: sentences.length > 340 ? sentences.slice(0, 340) + "..." : sentences
        };
      }
    } catch (e) {}
    return null;
  }

  // 3. DYNAMIC PER-ARTICLE SYNTHESIZER
  async function buildDynamicUpscArticle(rawItem, index) {
    const rawTitle = (rawItem.title || "National Policy & Governance Update")
      .replace(/ - The Hindu| - Indian Express| \| Explained News| \| India News| - Mint/gi, "")
      .trim();

    const cleanBody = (rawItem.content || rawItem.description || "")
      .replace(/<[^>]+>/g, " ")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\s+/g, " ")
      .trim();

    const fullText = rawTitle + ". " + cleanBody;

    // A. Extract Specific Proper Entities & Statutory Terms from THIS Article
    const extractedEntities = [];
    const addEntity = (val) => {
      if (!val) return;
      const cl = val.replace(/^['"“”‘’([{\s]+|['"“”‘’)\]}.,;:!?\s]+$/g, "").replace(/'s$/i, "").trim();
      if (cl.length < 3 || STOPWORDS.has(cl.toLowerCase()) || /^\d+$/.test(cl)) return;
      if (!extractedEntities.some(x => x.toLowerCase() === cl.toLowerCase())) {
        extractedEntities.push(cl);
      }
    };

    const legalMatches = fullText.match(/\b(Article\s+\d+[A-Z]?|Section\s+\d+[A-Z]?|\d+(?:st|nd|rd|th)\s+Amendment|[A-Z][a-zA-Z]+\s+(?:Act|Commission|Committee|Treaty|Protocol|Mission|Scheme|Board|Council|Tribunal|Court|Bank|Ministry|Policy))\b/g) || [];
    legalMatches.forEach(m => addEntity(m));

    const properPhrases = rawTitle.match(/\b([A-Z][a-zA-Z]{2,}(?:\s+[A-Z][a-zA-Z]{2,})+)\b/g) || [];
    properPhrases.forEach(p => {
      const words = p.split(/\s+/);
      if (!words.some(w => STOPWORDS.has(w.toLowerCase()))) addEntity(p);
    });

    const acronyms = fullText.match(/\b[A-Z]{3,7}\b/g) || [];
    acronyms.forEach(ac => {
      if (!["NEWS","LIVE","SAID","ALSO","FROM","WITH","THAT","THIS"].includes(ac)) addEntity(ac);
    });

    rawTitle.split(/\s+/).forEach((w, wIdx) => {
      const cl = w.replace(/[^a-zA-Z0-9-]/g, "");
      if (wIdx === 0 && STOPWORDS.has(cl.toLowerCase())) return;
      if (/^[A-Z][a-zA-Z-]{3,}$/.test(cl)) addEntity(cl);
    });

    // B. Check if any Conditional UPSC Statutory Rule matches this article
    const matchedRules = [];
    for (let i = 0; i < CONDITIONAL_UPSC_RULES.length; i++) {
      const r = CONDITIONAL_UPSC_RULES[i];
      const tMatches = (rawTitle.match(new RegExp(r.regex.source, "gi")) || []).length;
      const bMatches = (cleanBody.match(new RegExp(r.regex.source, "gi")) || []).length;
      const score = tMatches * 5 + bMatches * 2;
      if (score > 0) {
        matchedRules.push({ rule: r, score: score });
      }
    }
    matchedRules.sort((a, b) => b.score - a.score);

    const primaryRule = matchedRules.length > 0 ? matchedRules[0].rule : null;
    const secondaryRule = matchedRules.length > 1 ? matchedRules[1].rule : null;

    // C. Silently Fetch Institutional Reference Dossier (No mention of Wikipedia)
    let refResult = null;
    const queryCandidates = [
      extractedEntities[0] ? `${extractedEntities[0]} India` : null,
      extractedEntities[0] || null,
      extractedEntities[1] ? `${extractedEntities[1]} India` : null,
      rawTitle.split(/[:—-]/)[0].trim()
    ].filter(Boolean);

    for (let q of queryCandidates) {
      refResult = await fetchSilentInstitutionalDossier(q);
      if (refResult) break;
    }

    // D. Format Live News Sentences into Readable Bullets
    const sents = cleanBody
      .split(/(?<=[.?!])\s+/)
      .map(s => s.trim())
      .filter(s => s.length > 30 && s.length < 300);

    const newsBullets = [];
    if (sents.length >= 2) {
      newsBullets.push(`<strong>What Happened:</strong> ${sents[0]}`);
      newsBullets.push(`<strong>Key Context:</strong> ${sents[1]}`);
      if (sents[2]) newsBullets.push(`<strong>Further Details:</strong> ${sents[2]}`);
    } else if (cleanBody.length > 25) {
      newsBullets.push(`<strong>Live News Summary:</strong> ${cleanBody.slice(0, 280)}${cleanBody.length > 280 ? "..." : ""}`);
    } else {
      newsBullets.push(`<strong>Headline Event:</strong> ${rawTitle}`);
    }

    // E. Determine GS Paper & Subtopic
    let gsPaper = primaryRule ? primaryRule.paper : "GS-2";
    let subtopicName = primaryRule
      ? (secondaryRule ? `${primaryRule.subtopic} & ${secondaryRule.subtopic.split(",")[0]}` : primaryRule.subtopic)
      : (refResult ? `Institutional Focus: ${refResult.title}` : "National Policy & Governance");

    if (!primaryRule) {
      if (/\b(economy|market|trade|industry|energy|climate|environment|science|space|tech|agriculture)\b/i.test(fullText)) gsPaper = "GS-3";
      else if (/\b(society|culture|history|heritage|women|population|urban)\b/i.test(fullText)) gsPaper = "GS-1";
      else if (/\b(ethics|integrity|morality|probity)\b/i.test(fullText)) gsPaper = "GS-4";
    }

    // F. Build the 4 Study Quadrants (Rebranded: Institutional & Statutory Dossier)
    const conceptDossierText = refResult
      ? `${refResult.title} (Institutional & Background Dossier): ${refResult.extract}`
      : `Core Subject Analysis (${extractedEntities.slice(0, 2).join(" & ") || rawTitle}): Directly intersects with ${subtopicName} under ${gsPaper}. Examine the institutional mandate, executive accountability, and statutory framework governing this development.`;

    const provisionsText = primaryRule
      ? (secondaryRule ? `${primaryRule.provisions} | Additionally: ${secondaryRule.provisions}` : primaryRule.provisions)
      : `Examine the statutory/executive mandate governing ${extractedEntities[0] || "this policy area"}, relevant parliamentary oversight mechanisms, and constitutional competence under the Seventh Schedule (Union, State, and Concurrent Lists).`;

    const precedentsText = primaryRule
      ? (secondaryRule ? `${primaryRule.precedents} | ${secondaryRule.precedents}` : primaryRule.precedents)
      : `Key analytical benchmark for ${extractedEntities[0] || subtopicName}: Apply principles of natural justice, proportionality, constitutional morality, and evidence-based policy evaluation.`;

    const prelimsTrapText = primaryRule
      ? primaryRule.prelimsTrap
      : `Examiner Fact-Check on "${extractedEntities[0] || rawTitle.slice(0, 35)}": Verify whether the governing body/scheme is Constitutional, Statutory (created by an Act of Parliament), or an Executive body (created by Cabinet resolution), and check its parent Union Ministry.`;

    // G. Build 2-Statement UPSC Prelims Mock Question & Mains Directive Question
    const prelimsMcq = primaryRule ? {
      stmt1: primaryRule.falseStmt,
      stmt2: primaryRule.trueStmt,
      ans: "Statement 2 only is correct. (Statement 1 is an Examiner Trap — see Prelims Trap notes for exact statutory distinction)."
    } : {
      stmt1: `The primary institutional mechanism governing ${extractedEntities[0] || subtopicName} falls strictly under the exclusive executive jurisdiction of State Governments without Union oversight.`,
      stmt2: refResult ? refResult.extract.split(/(?<=[.?!])\s+/)[0] : `Developments regarding ${extractedEntities[0] || rawTitle.slice(0, 30)} directly impact India's ${subtopicName} framework under ${gsPaper}.`,
      ans: "Statement 2 only is correct. Statement 1 is incorrect as Union-State constitutional competence is governed by the Seventh Schedule and central statutory mandates."
    };

    const mainsQuestion = primaryRule
      ? primaryRule.mainsQ
      : `In light of recent developments surrounding "${rawTitle.slice(0, 65)}", critically examine the institutional and statutory reforms needed in ${subtopicName}. (150 Words, 10 Marks)`;

    // H. Finalize Recall Keywords
    if (primaryRule) {
      primaryRule.coreKws.forEach(k => addEntity(k));
    }
    if (refResult && refResult.title) {
      addEntity(refResult.title);
    }
    const fallbackKws = [gsPaper, "Statutory Mandate", "Constitutionalism", "Public Policy", "Accountability"];
    let fIdx = 0;
    while (extractedEntities.length < 5) {
      addEntity(fallbackKws[fIdx++ % fallbackKws.length]);
    }
    const finalKeywords = extractedEntities.slice(0, 6);

    return {
      id: "live_v25_" + Date.now() + "_" + index,
      title: rawTitle,
      source: rawItem.sourceName || "Live Feed",
      link: rawItem.link || "",
      paper: gsPaper,
      subtopic: subtopicName,
      keywords: finalKeywords,
      newsBullets: newsBullets,
      context: newsBullets.map(b => b.replace(/<[^>]+>/g, "")).join(" "),
      prelimsMcq: prelimsMcq,
      mainsQuestion: mainsQuestion,
      staticNodes: {

  // 4. 8-CHANNEL LIVE RSS AGGREGATOR WITH SEEN-HEADLINE MEMORY (Guarantees 5 NEW articles on EVERY single Sync click!)
  const MULTI_CHANNEL_FEEDS = [
    { name: "Indian Express Explained", url: "https://indianexpress.com/section/explained/feed/" },
    { name: "The Hindu Editorial", url: "https://www.thehindu.com/opinion/editorial/feeder/default.rss" },

  async function fetchChannelItems(feedObj) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5200);
    try {
      const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feedObj.url), { signal: ctrl.signal });
      clearTimeout(timer);
      if (res.ok) {
        const data = await res.json();
        if (data && Array.isArray(data.items) && data.items.length) {
          return data.items.map(it => ({
            title: it.title || "",
            description: it.description || "",
            content: it.content || "",
            link: it.link || "",
            sourceName: feedObj.name
          }));
        }
      }
    } catch (e) {}

    const ctrl2 = new AbortController();
    const timer2 = setTimeout(() => ctrl2.abort(), 5800);
    const xmlUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(feedObj.url)}&t=${Date.now()}`;
    const res2 = await fetch(xmlUrl, { signal: ctrl2.signal });
    clearTimeout(timer2);
    if (!res2.ok) throw new Error("Channel unreachable");
    const rawData = await res2.json();
    const doc = new DOMParser().parseFromString(rawData.contents || "", "text/xml");
    const nodes = Array.from(doc.querySelectorAll("item"));
    return nodes.map(n => ({
      title: n.querySelector("title")?.textContent || "",
      description: n.querySelector("description")?.textContent || "",
      content: "",
      link: n.querySelector("link")?.textContent || "",
      sourceName: feedObj.name
    }));
  }

  async function pullAndRotateLiveArticles(isManualSync = false) {
    if (isManualSync) {
      syncSetNumber += 1;
      localStorage.setItem("upsc_set_num_v25", String(syncSetNumber));
    }

    const results = await Promise.allSettled(MULTI_CHANNEL_FEEDS.map(f => fetchChannelItems(f)));
    // Interleave articles round-robin across all 8 channels so every set has diverse Polity, Economy, IR, Sci-Tech
    const channelLists = results
      .filter(r => r.status === "fulfilled" && Array.isArray(r.value) && r.value.length > 0)
      .map(r => r.value);

    if (channelLists.length === 0) throw new Error("All live channels offline");

    const interleaved = [];
    const maxLen = Math.max(...channelLists.map(l => l.length));
    for (let pos = 0; pos < maxLen; pos++) {
      for (let c = 0; c < channelLists.length; c++) {
        if (channelLists[c][pos]) interleaved.push(channelLists[c][pos]);
      }
    }

    // Deduplicate and filter out noise
    const uniquePool = [];
    const localSeen = new Set();
    for (const it of interleaved) {
      const t = (it.title || "").trim();
      if (t.length < 20 || NOISE_FILTER.test(t + " " + (it.description || ""))) continue;
      const key = t.toLowerCase().slice(0, 34);
      if (localSeen.has(key)) continue;
      localSeen.add(key);
      uniquePool.push({ item: it, key: key });
    }

    // Filter out articles the user has ALREADY seen in previous sync clicks!
    let unseenCandidates = uniquePool.filter(x => !seenHeadlinesSet.has(x.key));
    if (unseenCandidates.length < 5) {
      // If user has cycled through all 45+ live stories today, reset the seen tracker cleanly
      seenHeadlinesSet.clear();
      unseenCandidates = uniquePool;
    }

    const pickedFive = unseenCandidates.slice(0, 5).map(x => {
      seenHeadlinesSet.add(x.key);
      return x.item;
    });

    localStorage.setItem("upsc_seen_titles_v25", JSON.stringify(Array.from(seenHeadlinesSet).slice(-80)));
    return await Promise.all(pickedFive.map((item, idx) => buildDynamicUpscArticle(item, idx)));
  }

          <div class="meta-strip">
            <div class="tag-cluster">
              <span class="gs-pill ${art.paper}">${art.paper}</span>
              <span class="syl-pill">🏆 Step 4 • Mains Snippet & Spaced Lock</span>
            </div>
          </div>

          <h2 class="art-headline">${escapeHtml(art.title)}</h2>

          <div class="quad-box" style="margin-bottom:14px;">
            <div class="quad-label" style="color:var(--accent);">📝 Ready-to-Use Mains Answer Structure (${art.paper})</div>
            <div class="quad-body" style="margin-bottom:8px;"><strong>Introduction:</strong> ${escapeHtml(art.mains.intro)}</div>
            <div class="quad-body" style="margin-bottom:8px;"><strong>Anchor Terms:</strong> ${art.mains.keywords.map(escapeHtml).join(" • ")}</div>
            <div class="quad-body"><strong>Way Forward:</strong> ${escapeHtml(art.mains.wayForward)}</div>
          </div>

          <div class="quad-box q-green" style="margin-bottom:14px;">
            <div class="quad-body" style="color:#6ee7b7;">
              🔄 <strong>1–7–21 Spaced Schedule:</strong> Queued for <strong>Day ${interval} Active Recall</strong> on <strong>${dueStr}</strong>.
            </div>
          </div>

          <div class="btn-bar">
            <button class="hero-btn" data-action="save-card-next">💾 Save to Spaced Deck & Next Article →</button>
          </div>
        </div>
      `;
    }
  }

  function renderDeckView() {
    const mount = document.getElementById("deckMount");
    if (!mount) return;
    const deck = getDeck();
    const today = getRealTodayStr();

    if (!deck.length) {
      mount.innerHTML = `<div style="text-align:center;padding:32px;color:var(--muted);">Your Spaced Deck is empty. Complete any live article recall session to store it here.</div>`;
      return;
    }

    mount.innerHTML = deck.map(card => {
      const isDue = card.dueDate <= today;
      return `
        <div class="deck-card">
          <div style="flex:1;min-width:240px;">
            <div style="font-weight:700;font-size:0.96rem;">
              ${escapeHtml(card.title)}
              <span class="gs-pill ${card.paper}" style="margin-left:6px;">${card.paper}</span>
            </div>
            <div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">
              Topic: ${escapeHtml(card.subtopic || "General Studies")} • Learned: ${card.learnedDate} • Next Recall: <strong>${card.dueDate}</strong> (Day ${card.interval})
              ${isDue ? `<span style="color:var(--bad);font-weight:800;margin-left:6px;">⚠️ DUE TODAY</span>` : ""}
            </div>
            ${card.userAttempt ? `<div style="font-size:0.76rem;color:#93c5fd;margin-top:4px;"><strong>Your Saved Pegs:</strong> ${escapeHtml([card.userAttempt.p1, card.userAttempt.p2, card.userAttempt.p4].filter(Boolean).join(" | ").slice(0, 145))}</div>` : ""}
          </div>
          <div style="display:flex;gap:6px;">
            <button class="tool-btn" data-action="retest-card" data-id="${card.id}">Retest</button>
            <button class="tool-btn" style="color:var(--bad);" data-action="delete-card" data-id="${card.id}">✕</button>
          </div>
        </div>
      `;
    }).join("");
  }

  // 7. GLOBAL DELEGATED CLICK CONTROLLER
  document.addEventListener("click", function(e) {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const act = btn.getAttribute("data-action");

    if (act === "tab-study") {
      document.getElementById("studyView").style.display = "block";
      document.getElementById("deckView").style.display = "none";
      document.getElementById("tabBtnStudy").classList.add("active");
      document.getElementById("tabBtnDeck").classList.remove("active");
      renderScreen();
    } else if (act === "tab-deck") {
      document.getElementById("studyView").style.display = "none";
      document.getElementById("deckView").style.display = "block";
      document.getElementById("tabBtnDeck").classList.add("active");
      document.getElementById("tabBtnStudy").classList.remove("active");
      renderDeckView();
    } else if (act === "toggle-mcq") {
      const box = document.getElementById("mcqAnswerBox");
      if (box) box.classList.toggle("open");
    } else if (act === "force-sync") {
      currentIdx = 0; stage = "study"; loadBatchForDate(true);
    } else if (act === "prev-day") {
      dayOffset -= 1; currentIdx = 0; stage = "study"; loadBatchForDate(false);
    } else if (act === "next-day") {
      dayOffset += 1; currentIdx = 0; stage = "study"; loadBatchForDate(false);
    } else if (act === "today-day") {
      dayOffset = 0; currentIdx = 0; stage = "study"; loadBatchForDate(false);
    } else if (act === "pick-art") {
      const idx = parseInt(btn.getAttribute("data-idx"), 10);
      if (!isNaN(idx)) { currentIdx = idx; stage = "study"; restoreCurrentAttempt(); renderScreen(); }
    } else if (act === "mode-mains") { activeMode = "mains"; renderScreen(); }
    else if (act === "mode-prelims") { activeMode = "prelims"; renderScreen(); }
    else if (act === "start-recall") { stage = "recall"; renderScreen(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (act === "back-study") { stage = "study"; renderScreen(); }
    else if (act === "skip-next") { currentIdx += 1; stage = "study"; restoreCurrentAttempt(); renderScreen(); }
    else if (act === "submit-recall") {
      recallInputs.p1 = (document.getElementById("inp1") || {}).value?.trim() || "";
      recallInputs.p2 = (document.getElementById("inp2") || {}).value?.trim() || "";
      recallInputs.p3 = (document.getElementById("inp3") || {}).value?.trim() || "";
      recallInputs.p4 = (document.getElementById("inp4") || {}).value?.trim() || "";

      const combined = (recallInputs.p1 + " " + recallInputs.p2 + " " + recallInputs.p3 + " " + recallInputs.p4).toLowerCase();
      const art = dailyBatch[currentIdx];
      lastHits = []; lastMisses = [];

      art.keywords.forEach(kw => {
        const tokens = kw.toLowerCase().split(/\s+/).filter(t => t.length >= 2);
        const matched = tokens.some(t => combined.includes(t));
        if (matched) lastHits.push(kw);
        else lastMisses.push(kw);
      });

      saveAttempt(getSelectedDateStr(), currentIdx, {
        inputs: { ...recallInputs }, hits: [...lastHits], misses: [...lastMisses], ts: Date.now()
      });

      stage = "diff";
      renderScreen();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (act === "go-summary") {
      stage = "summary"; renderScreen(); window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (act === "save-card-next") {
      const art = dailyBatch[currentIdx];
      const interval = lastMisses.length <= 2 ? 21 : (lastMisses.length <= 4 ? 7 : 1);
      const deck = getDeck();

      if (retestingId) {
        const oldIdx = deck.findIndex(c => String(c.id) === String(retestingId));
        if (oldIdx > -1) deck.splice(oldIdx, 1);
        retestingId = null;
      }

      deck.unshift({
        id: Date.now(), title: art.title, source: art.source, link: art.link,
        paper: art.paper, subtopic: art.subtopic, newsBullets: art.newsBullets,
        context: art.context, prelimsMcq: art.prelimsMcq, mainsQuestion: art.mainsQuestion,
        staticNodes: art.staticNodes, prelims: art.prelims,
        anchors: art.anchors, keywords: art.keywords, mains: art.mains,
        userAttempt: { ...recallInputs }, misses: lastMisses, interval: interval,
        learnedDate: getSelectedDateStr(), dueDate: addDaysStr(getRealTodayStr(), interval)
      });
      saveDeck(deck);

      currentIdx += 1; stage = "study"; restoreCurrentAttempt(); renderScreen();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (act === "delete-card") {
      const id = btn.getAttribute("data-id");
      saveDeck(getDeck().filter(c => String(c.id) !== String(id)));
      renderDeckView();
    } else if (act === "retest-card") {
      const id = btn.getAttribute("data-id");
      const card = getDeck().find(c => String(c.id) === String(id));
      if (card) {
        retestingId = card.id;
        dailyBatch[currentIdx] = card;
        recallInputs = card.userAttempt || { p1: "", p2: "", p3: "", p4: "" };
        stage = "recall";
        document.getElementById("studyView").style.display = "block";
        document.getElementById("deckView").style.display = "none";
        document.getElementById("tabBtnStudy").classList.add("active");
        document.getElementById("tabBtnDeck").classList.remove("active");
        renderScreen();
      }
    } else if (act === "export-deck") {
      const blob = new Blob([JSON.stringify(getDeck(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "upsc-super-recall-deck.json";
      a.click();
    }
  });

  // 8. MIDNIGHT AUTO-REFRESH CLOCK
  let trackedDay = getRealTodayStr();
  function updateClock() {
    const now = new Date();
    const tmrw = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    const diff = Math.max(0, tmrw - now);
    const h = String(Math.floor(diff / 3600000)).padStart(2, "0");
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");
    const el = document.getElementById("timerClock");
    if (el) el.textContent = `${h}:${m}:${s}`;

    const cur = getRealTodayStr();
    if (cur !== trackedDay) {
      trackedDay = cur; dayOffset = 0; currentIdx = 0; stage = "study";
      loadBatchForDate(true);
    }
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  updateClock();
  setInterval(updateClock, 1000);
  loadBatchForDate(false);
})();
</script>
</body>
