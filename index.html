<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UPSC Super Recall — Direct AI Engine</title>
<meta name="theme-color" content="#070b14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b14;
  --surface: #0f172a;
  --surface-sub: #17233d;
  --border: #233354;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.15);
  --good: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 16px;
}
.wrap { max-width: 860px; margin: 0 auto; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
h1 { font-size: 1.35rem; font-weight: 800; margin: 0; color: #fff; letter-spacing: -0.02em; }
.sub { color: var(--muted); font-size: 0.78rem; font-weight: 500; display: block; }
.header-actions { display: flex; gap: 8px; align-items: center; }

.pill {
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--accent);
}
.btn-icon {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
}
.btn-icon:hover { color: var(--text); border-color: var(--accent); }

.controls-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 16px 0;
}
.tab-group { display: flex; background: var(--surface); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
.tab-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-weight: 700;
  font-size: 0.8rem;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
}
.tab-btn.active { background: var(--accent); color: #041424; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.tag-step {
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.25);
  padding: 3px 8px;
  border-radius: 4px;
}
.tag-gs {
  font-size: 0.75rem;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 6px;
  background: rgba(16, 185, 129, 0.15);
  color: #6ee7b7;
  border: 1px solid #10b981;
}

.toggle-btn {
  background: #090f1d;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 4px 10px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  border-radius: 5px;
}
.toggle-btn.active { color: var(--accent); border-color: var(--accent); }

h2.art-title { font-size: 1.25rem; font-weight: 700; margin: 0 0 14px; line-height: 1.35; color: #fff; }
.info-box {
  background: var(--surface-sub);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 14px;
}
.info-title {
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
ul.clean-list { margin: 0; padding-left: 18px; }
ul.clean-list li { margin-bottom: 6px; font-size: 0.9rem; }

.peg-title { font-size: 0.78rem; font-weight: 700; color: #93c5fd; margin: 12px 0 4px; display: block; }
input.peg-text, textarea.peg-text {
  width: 100%;
  background: #090f1d;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 10px 12px;
  color: var(--text);
  font-size: 0.9rem;
  font-family: inherit;
}
textarea.peg-text { min-height: 60px; resize: vertical; }
input.peg-text:focus, textarea.peg-text:focus { outline: none; border-color: var(--accent); }

.action-btn {
  background: var(--accent);
  color: #041424;
  border: none;
  border-radius: 7px;
  padding: 11px 18px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.action-btn:active { transform: scale(0.98); }

.kw-chip {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  margin: 3px 4px 3px 0;
}
.kw-chip.ok { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid #10b981; }
.kw-chip.miss { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid #ef4444; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } }

.deck-row {
  background: var(--surface);
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--border);
  border-left-width: 4px;
}

/* API Key Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 460px;
  width: 100%;
  padding: 22px;
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>UPSC Super Recall</h1>
      <span class="sub">Direct AI Live Curation • 1–7–21 Memory Ladder</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="openKeyModal()">⚙️ API Key</button>
      <button class="btn-icon" onclick="forceRefreshAI()" title="Force pull new batch from AI">🔄 Refresh AI</button>
      <span class="pill" id="counterPill">0 / 5 Today</span>
    </div>
  </header>

  <div class="controls-row">
    <div class="tab-group">
      <button class="tab-btn active" id="tabRecall" onclick="setTab('recall')">Daily Recall</button>
      <button class="tab-btn" id="tabDeck" onclick="setTab('deck')">Spaced Deck</button>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--muted);" id="dateText">--</div>
  </div>

  <div id="mainView">
    <div id="cardMount"></div>
  </div>

  <div id="deckView" style="display:none;">
    <div class="card">
      <div class="card-top">
        <h3 style="margin:0;font-size:1.1rem">Active Spaced Memory Queue</h3>
        <span class="pill" id="deckCountText">0 Cards</span>
      </div>
      <p style="color:var(--muted);font-size:0.85rem;margin:4px 0 14px;">Ladder: <strong>Day 1 → Day 7 → Day 21 (Mastery)</strong>.</p>
      <div id="deckMount"></div>
    </div>
  </div>
</div>

<!-- API Key Setup Modal -->
<div class="modal-overlay" id="keyModal">
  <div class="modal-box">
    <h3 style="margin:0 0 8px;">Gemini API Key Setup</h3>
    <p style="color:var(--muted);font-size:0.85rem;margin:0 0 14px;">
      Paste your free Gemini API key below. It is stored safely inside your browser's private local storage.
    </p>
    <input type="password" id="keyInput" class="peg-text" placeholder="AIzaSy..." style="margin-bottom:12px;">
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn-icon" onclick="closeKeyModal()">Cancel</button>
      <button class="action-btn" style="margin:0;" onclick="saveKeyAndFetch()">Save & Fetch News</button>
    </div>
  </div>
</div>

<script>
// Built-in starter articles in case key is missing or internet is off
const STARTER_ARTICLES = [
  {
    title: "Delimitation Commission and Article 82/170 Equilibrium",
    paper: "GS-2",
    keywords: ["82", "170", "84th", "2026", "329", "census"],
    context: "Debate over post-census seat reapportionment between northern and southern states.",
    prelims: [
      "Orders cannot be questioned in court under Article 329(a).",
      "84th Amendment Act 2001 froze seats until first census taken post-2026."
    ],
    anchors: [
      "Article 82 (Parliament reallocation) and Article 170 (State Legislative Assemblies).",
      "Orders carry the force of law and are protected from judicial review under Article 329(a).",
      "Federal dilemma: Equal value per vote vs penalizing demographic stabilization."
    ],
    mains: {
      intro: "Delimitation enforces the constitutional mandate of equal voter representation under Articles 82 and 170.",
      keywords: ["Constitutional freeze", "Asymmetrical federalism", "Parity penalty"],
      wayForward: "Institute bicameral rebalancing: expand Lok Sabha seats while strengthening Rajya Sabha vetoes."
    }
  },
  {
    title: "Right Against Climate Change & Great Indian Bustard Protection",
    paper: "GS-3",
    keywords: ["14", "21", "48a", "critically endangered", "rajasthan", "collision"],
    context: "Supreme Court (M.K. Ranjitsinh) establishes the right against adverse climate impacts under Articles 14 & 21.",
    prelims: [
      "GIB is Critically Endangered (IUCN) and Schedule I of Wildlife Protection Act 1972.",
      "Right against climate change is an unenumerated right derived from Articles 14 and 21."
    ],
    anchors: [
      "Great Indian Bustard: Flagship species of Thar Desert and Kutch grassland ecosystems.",
      "Article 21 read with Article 48A (DPSP State duty) and Article 51A(g) (Fundamental Duty).",
      "Ecological tension: Scaling solar transmission networks vs preventing avian collisions."
    ],
    mains: {
      intro: "In M.K. Ranjitsinh (2024), the Supreme Court expanded Article 21 to encompass climate change mitigation.",
      keywords: ["Ecological jurisprudence", "Sustainable development", "Climate litigation"],
      wayForward: "Mandate underground lines in core habitats and standardized flight diverters in buffers."
    }
  },
  {
    title: "Gubernatorial Assent to State Bills: Article 200 Inaction",
    paper: "GS-2",
    keywords: ["200", "201", "shamsher", "nabam rebia", "sarkaria", "punchhi"],
    context: "State governments challenging indefinite delays by Governors in granting assent to legislation.",
    prelims: [
      "Money Bills cannot be returned by the Governor under Article 200.",
      "No numeric timeline is specified in Article 200 for bill disposal."
    ],
    anchors: [
      "Article 200 options: Assent, withhold, reserve for President, or return with message.",
      "Shamsher Singh (1974): Governor acts on aid and advice with narrow discretionary exceptions.",
      "Sarkaria & Punchhi Commissions recommend a 6-month disposal deadline."
    ],
    mains: {
      intro: "Article 200 functions as a constitutional check rather than an obstructionist veto on elected assemblies.",
      keywords: ["Gubernatorial discretion", "Legislative friction", "Constitutional morality"],
      wayForward: "Formalize procedural conventions prescribing a binding 3-to-6-month window for bill clearance."
    }
  },
  {
    title: "Executive Remission Jurisprudence: Section 433A CrPC & BNSS 473",
    paper: "GS-2",
    keywords: ["72", "161", "433a", "14 years", "bilkis", "epuru", "arbitrary"],
    context: "Judicial review of state remission orders granted without presiding judge consultation or victim inputs.",
    prelims: [
      "Article 161 constitutional power overrides statutory limitations like Section 433A.",
      "Section 433A mandates 14 years actual custody for offenses punishable by death."
    ],
    anchors: [
      "Article 72 (President) and Article 161 (Governor) are sovereign constitutional powers.",
      "Section 433A CrPC (BNSS Sec 473) sets mandatory 14-year minimum actual custody.",
      "Bilkis Bano & Epuru Sudhakar: Executive clemency remains subject to judicial review against arbitrariness."
    ],
    mains: {
      intro: "Executive remission reconciles retributive penal law with reformative justice, guided by objective statutory criteria.",
      keywords: ["Reformative penology", "Rule of law", "Subjective satisfaction"],
      wayForward: "Institutionalize independent prison advisory boards and mandate victim voice inclusion."
    }
  },
  {
    title: "UN Plastics Treaty (INC) & Extended Producer Responsibility",
    paper: "GS-3",
    keywords: ["5mm", "epr", "basel", "upstream", "downstream", "single use"],
    context: "Global diplomatic deadlock on whether to cap virgin plastic production or focus solely on recycling.",
    prelims: [
      "Microplastics measure less than 5mm in diameter.",
      "Basel Convention 2019 amendments placed plastic waste under prior informed consent."
    ],
    anchors: [
      "Microplastics: Primary vs secondary; causes toxic marine biomagnification.",
      "Plastic Waste Management Rules in India: Extended Producer Responsibility (EPR) targets.",
      "Negotiating divide: Upstream production caps vs downstream recycling."
    ],
    mains: {
      intro: "The UN INC process aims to create the first legally binding multilateral treaty addressing the full lifecycle of plastics.",
      keywords: ["Extended producer responsibility", "Circular plastics economy", "Upstream caps"],
      wayForward: "Adopt universal polymer reporting while supporting green tech transfer for developing economies."
    }
  }
];

let todayStr = new Date().toISOString().slice(0, 10);
let currentArticles = [];
let articleIdx = 0;
let currentStage = 'study';
let mode = 'mains';
let userSlots = { p1:'', p2:'', p3:'', p4:'' };
let hits = [], misses = [];

function getSavedKey() {
  return localStorage.getItem('upsc_gemini_key') || '';
}

function openKeyModal() {
  document.getElementById('keyInput').value = getSavedKey();
  document.getElementById('keyModal').style.display = 'flex';
}

function closeKeyModal() {
  document.getElementById('keyModal').style.display = 'none';
}

function saveKeyAndFetch() {
  const k = document.getElementById('keyInput').value.trim();
  if (k) {
    localStorage.setItem('upsc_gemini_key', k);
    closeKeyModal();
    fetchDailyBatchFromAI(true);
  } else {
    alert("Please enter a valid API key.");
  }
}

// Direct Call to Gemini API
async function fetchDailyBatchFromAI(force = false) {
  const mount = document.getElementById('cardMount');
  const cacheKey = 'upsc_cache_' + todayStr;
  const cached = localStorage.getItem(cacheKey);

  if (!force && cached) {
    try {
      currentArticles = JSON.parse(cached);
      articleIdx = 0;
      currentStage = 'study';
      renderUI();
      return;
    } catch(e) {}
  }

  const apiKey = getSavedKey();
  if (!apiKey) {
    // If no key is set yet, show starter bank and prompt for key
    currentArticles = STARTER_ARTICLES;
    articleIdx = 0;
    currentStage = 'study';
    renderUI();
    return;
  }

  mount.innerHTML = `
    <div class="card" style="text-align:center; padding:50px 20px;">
      <div style="font-size:2rem; margin-bottom:12px;">⚡</div>
      <h3 style="margin:0 0 8px;">Gemini is curating today's UPSC batch...</h3>
      <p style="color:var(--muted); font-size:0.85rem; margin:0;">Analyzing today's national developments, statutory provisions, and landmark judgments.</p>
    </div>
  `;

  const prompt = `
You are an expert UPSC Civil Services mentor. Curate exactly 5 of the MOST CRITICAL current affairs articles for UPSC CSE (GS-1, GS-2, GS-3, GS-4) for today (${todayStr}).
Focus strictly on constitutional articles, statutory amendments, high-court/supreme-court rulings, international conventions, and ecological issues. Filter out daily political rhetoric and crime.

Output ONLY a valid JSON array adhering strictly to this structure without markdown code fences:
[
  {
    "title": "Clear substantive headline",
    "paper": "GS-1" | "GS-2" | "GS-3" | "GS-4",
    "keywords": ["5-6 single-word or short statutory/case keywords for automated diffing"],
    "context": "2-3 sentences explaining what happened.",
    "prelims": [
      "Trap 1: Specific article, section, or statutory distinction",
      "Trap 2: Ministry, reporting agency, or IUCN category"
    ],
    "anchors": [
      "Constitutional Articles or Statutory Sections involved",
      "Landmark Supreme Court precedent or official Commission recommendations",
      "Core conceptual balance or underlying principle"
    ],
    "mains": {
      "intro": "A 1-line crisp definition/context sentence.",
      "keywords": ["Three", "High-Impact", "Phrases"],
      "wayForward": "A balanced, reformative closing sentence."
    }
  }
]
`;

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.2 }
      })
    });

    if (!res.ok) throw new Error("API call failed with status: " + res.status);

    const data = await res.json();
    let text = data.candidates[0].content.parts[0].text.trim();
    if (text.startsWith("```")) {
      text = text.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
    }

    const parsed = JSON.parse(text);
    if (Array.isArray(parsed) && parsed.length >= 3) {
      currentArticles = parsed;
      localStorage.setItem(cacheKey, JSON.stringify(parsed));
      articleIdx = 0;
      currentStage = 'study';
      renderUI();
      return;
    }
    throw new Error("Invalid format");
  } catch (err) {
    alert("Could not pull fresh AI batch (" + err.message + "). Loading fallback deck.");
    currentArticles = STARTER_ARTICLES;
    articleIdx = 0;
    currentStage = 'study';
    renderUI();
  }
}

function forceRefreshAI() {
  if (!getSavedKey()) {
    openKeyModal();
  } else {
    fetchDailyBatchFromAI(true);
  }
}

function getDeck() {
  return JSON.parse(localStorage.getItem('upsc_deck_v9') || '[]');
}

function saveDeck(deck) {
  localStorage.setItem('upsc_deck_v9', JSON.stringify(deck));
}

function renderUI() {
  const mount = document.getElementById('cardMount');
  document.getElementById('dateText').innerText = todayStr;
  document.getElementById('counterPill').innerText = `${articleIdx} / ${currentArticles.length} Done`;

  if (!currentArticles.length) {
    mount.innerHTML = `<div class="card">No articles loaded. Tap "Refresh AI" above.</div>`;
    return;
  }

  if (articleIdx >= currentArticles.length) {
    mount.innerHTML = `
      <div class="card" style="text-align:center; padding:40px 16px;">
        <div style="font-size:2rem;margin-bottom:8px;">🎯</div>
        <h2 style="color:var(--good);margin:0 0 6px;">Batch Completed!</h2>
        <p style="color:var(--muted);font-size:0.88rem;margin:0 0 16px;">All 5 anchors for today are saved into your 1–7–21 spaced revision deck.</p>
        <button class="action-btn" onclick="restartBatch()">Redo Session</button>
      </div>
    `;
    return;
  }

  const art = currentArticles[articleIdx];

  if (currentStage === 'study') {
    mount.innerHTML = `
      <div class="card">
        <div class="card-top">
          <div>
            <span class="tag-step">Step 1 • Study Static Anchors</span>
            <span class="tag-gs">${art.paper}</span>
          </div>
          <div>
            <button cla
