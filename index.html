<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UPSC Super Recall — Live Active Engine</title>
<meta name="theme-color" content="#060913">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060913;
  --bg-grad: radial-gradient(circle at 50% 0%, #111c38 0%, #060913 70%);
  --card: rgba(15, 23, 42, 0.88);
  --card-inner: #131d36;
  --border: #24355a;
  --border-highlight: #38bdf8;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-dark: #0284c7;
  --good: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --gs1: #f43f5e;
  --gs2: #38bdf8;
  --gs3: #10b981;
  --gs4: #a855f7;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.55;
  padding: 14px;
  min-height: 100vh;
}
.app-shell { max-width: 900px; margin: 0 auto; padding-bottom: 50px; }

/* Header & Live Status */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  backdrop-filter: blur(12px);
  margin-bottom: 14px;
}
.brand h1 {
  font-size: 1.3rem;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.02em;
  background: linear-gradient(90deg, #fff, #7dd3fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand p { margin: 2px 0 0; font-size: 0.76rem; color: var(--muted); }

.status-cluster { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 700;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.35);
  color: #34d399;
}
.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 8px var(--good);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.timer-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--card-inner);
  border: 1px solid var(--border);
  color: #fbbf24;
}

/* Navigation & Date Bar */
.control-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.nav-pills {
  display: flex;
  background: var(--card);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.nav-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-weight: 700;
  font-size: 0.8rem;
  padding: 7px 14px;
  border-radius: 7px;
  cursor: pointer;
}
.nav-btn.active {
  background: var(--accent);
  color: #041322;
}
.date-stepper {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  padding: 4px 6px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.step-btn {
  background: var(--card-inner);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.step-btn:active { transform: scale(0.96); }
.date-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0 6px;
  color: var(--accent);
}

/* Progress Strip */
.progress-strip {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.prog-segment {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: var(--card-inner);
  border: 1px solid var(--border);
  overflow: hidden;
}
.prog-segment.done { background: var(--good); border-color: var(--good); }
.prog-segment.current { background: var(--accent); border-color: var(--accent); }

/* Main Stage Card */
.stage-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  margin-bottom: 16px;
}
.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.badge-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step-pill {
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 4px 9px;
  border-radius: 6px;
  background: rgba(56, 189, 248, 0.12);
  color: var(--accent);
  border: 1px solid rgba(56, 189, 248, 0.3);
}
.gs-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 6px;
}
.gs-pill.GS-1 { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid var(--gs1); }
.gs-pill.GS-2 { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid var(--gs2); }
.gs-pill.GS-3 { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid var(--gs3); }
.gs-pill.GS-4 { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid var(--gs4); }

.mode-switch {
  display: inline-flex;
  background: #090f1d;
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.mode-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 5px;
  cursor: pointer;
}
.mode-btn.active { background: var(--card-inner); color: var(--accent); }

.headline {
  font-size: 1.25rem;
  font-weight: 800;
  line-height: 1.35;
  margin: 0 0 14px;
  color: #fff;
}
.panel {
  background: var(--card-inner);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.panel-label {
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
ul.bullet-list { margin: 0; padding-left: 18px; }
ul.bullet-list li { margin-bottom: 6px; font-size: 0.92rem; }

/* 4-Peg Form */
.peg-field { margin-bottom: 12px; }
.peg-field label {
  display: block;
  font-size: 0.78rem;
  font-weight: 700;
  color: #93c5fd;
  margin-bottom: 5px;
}
.peg-input {
  width: 100%;
  background: #080d1a;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
}
.peg-input:focus { outline: none; border-color: var(--accent); }
textarea.peg-input { min-height: 64px; resize: vertical; }

/* Buttons */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.cta-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #03111f;
  border: none;
  border-radius: 9px;
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 800;
  cursor: pointer;
}
.cta-btn:active { transform: scale(0.98); }
.sec-btn {
  background: var(--card-inner);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
}

/* Diff Badges */
.kw-tag {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  margin: 3px 5px 3px 0;
}
.kw-hit { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid var(--good); }
.kw-miss { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid var(--bad); }

.split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 620px) { .split-grid { grid-template-columns: 1fr; } }

.notice-banner {
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid rgba(245, 158, 11, 0.4);
  color: #fcd34d;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 12px;
}

.deck-card {
  background: var(--card-inner);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
</style>
</head>
<body>

<div class="app-shell">
  <header class="top-bar">
    <div class="brand">
      <h1>UPSC Super Recall</h1>
      <p>Live Automated Current Affairs • 4-Peg Active Memory Engine</p>
    </div>
    <div class="status-cluster">
      <div class="live-badge">
        <span class="pulse-dot"></span>
        <span id="feedStatus">Live Feed: Ready</span>
      </div>
      <div class="timer-badge" id="resetClock">Next Refresh: --:--:--</div>
    </div>
  </header>

  <div class="control-bar">
    <div class="nav-pills">
      <button class="nav-btn active" id="btnTabStudy" data-action="tab-study">Daily Recall (5)</button>
      <button class="nav-btn" id="btnTabDeck" data-action="tab-deck">Spaced Deck (<span id="deckCounter">0</span>)</button>
    </div>
    <div class="date-stepper">
      <button class="step-btn" data-action="prev-day">◀ Prev</button>
      <span class="date-display" id="activeDateLabel">--</span>
      <button class="step-btn" data-action="today-day">Today</button>
      <button class="step-btn" data-action="next-day">Next ▶</button>
    </div>
  </div>

  <div id="bannerSlot"></div>

  <div id="studySection">
    <div class="progress-strip" id="progressBar"></div>
    <div id="stageMount"></div>
  </div>

  <div id="deckSection" style="display:none;">
    <div class="stage-card">
      <div class="card-meta">
        <h3 style="margin:0;font-size:1.1rem">1–7–21 Day Spaced Revision Queue</h3>
        <button class="step-btn" data-action="export-deck">Backup JSON</button>
      </div>
      <p style="color:var(--muted);font-size:0.84rem;margin:0 0 14px;">
        Cards progress from <strong>Day 1 → Day 7 → Day 21</strong>. Click "Retest Now" on any due card to run an active recall check.
      </p>
      <div id="deckMount"></div>
    </div>
  </div>
</div>
