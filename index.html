<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UPSC Super Recall — Live Daily Active Engine</title>
<meta name="theme-color" content="#070b14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b14;
  --surface: #0f172a;
  --surface-sub: #17233d;
  --border: #233354;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.18);
  --accent-hover: #0284c7;
  --good: #10b981;
  --good-glow: rgba(16, 185, 129, 0.15);
  --warn: #f59e0b;
  --bad: #ef4444;
  --radius: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding-bottom: 40px;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 18px 16px; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.title-group h1 {
  font-size: 1.35rem;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.title-group small {
  color: var(--muted);
  font-size: 0.8rem;
  font-weight: 500;
}
.header-chips {
  display: flex;
  gap: 8px;
  align-items: center;
}
.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #34d399;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
}
.live-dot {
  width: 7px;
  height: 7px;
  background: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 8px #10b981;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

.nav-tabs {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 18px 0;
  flex-wrap: wrap;
  gap: 10px;
}
.tab-container {
  display: flex;
  background: var(--surface);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.tab-link {
  background: transparent;
  border: none;
  color: var(--muted);
  font-weight: 600;
  font-size: 0.82rem;
  padding: 6px 14px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.2s;
}
.tab-link.active {
  background: var(--accent);
  color: #041424;
  font-weight: 700;
  box-shadow: 0 2px 8px var(--accent-glow);
}
.date-label {
  font-size: 0.82rem;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  margin-bottom: 16px;
  position: relative;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.step-badge {
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  background: rgba(56, 189, 248, 0.08);
  border: 1px solid rgba(56, 189, 248, 0.2);
  padding: 3px 9px;
  border-radius: 6px;
}
.gs-tag {
  font-size: 0.75rem;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 6px;
  margin-left: 6px;
  font-family: 'JetBrains Mono', monospace;
}
.gs-tag.GS-1 { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid #f43f5e; }
.gs-tag.GS-2 { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid #0284c7; }
.gs-tag.GS-3 { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid #10b981; }
.gs-tag.GS-4 { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid #8b5cf6; }

.mode-toggle {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 2px;
  border-radius: 7px;
}
.mode-toggle button {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 9px;
  cursor: pointer;
  border-radius: 5px;
}
.mode-toggle button.active {
  background: var(--surface-sub);
  color: var(--accent);
}

h2.item-title {
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.35;
  margin: 0 0 16px 0;
  letter-spacing: -0.01em;
}
.content-box {
  background: var(--surface-sub);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.content-box-title {
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 6px;
}
ul.anchor-list { margin: 0; padding-left: 18px; }
ul.anchor-list li { margin-bottom: 6px; font-size: 0.9rem; }

.peg-label {
  display: block;
  font-size: 0.78rem;
  font-weight: 700;
  color: #93c5fd;
  margin: 12px 0 4px;
}
input.peg-input, textarea.peg-input {
  width: 100%;
  background: #090f1d;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  transition: border-color 0.2s;
}
textarea.peg-input { min-height: 55px; resize: vertical; }
input.peg-input:focus, textarea.peg-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.btn-primary {
  background: var(--accent);
  color: #041424;
  border: none;
  border-radius: 8px;
  padding: 11px 20px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  transition: transform 0.15s, background 0.15s;
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface-sub); color: var(--text); border: 1px solid var(--border); }

.grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .grid-two { grid-template-columns: 1fr; } }

.kw-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
  margin: 3px 4px 3px 0;
}
.kw-good { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid #10b981; }
.kw-bad { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid #ef4444; }

.mains-enrichment {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid #1e3a8a;
  border-radius: 9px;
  padding: 16px;
  margin-top: 14px;
}
.queue-item {
  background: var(--surface);
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--border);
  border-left-width: 4px;
}
.ladder-chip {
  background: #1e3a8a;
  color: #bfdbfe;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 5px;
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="title-group">
      <h1>UPSC Super Recall</h1>
      <small>Live Daily Static-Current Engine • 1–7–21 Memory Ladder</small>
    </div>
    <div class="header-chips">
      <div id="livePill" class="live-pill">
        <span class="live-dot"></span>
        <span id="liveStatusText">Live Feed: Active</span>
      </div>
      <div class="live-pill" style="border-color:var(--border);background:var(--surface);color:var(--muted)">
        <span id="progressPill">0 / 5 Today</span>
      </div>
    </div>
  </header>

  <div class="nav-tabs">
    <div class="tab-container">
      <button class="tab-link active" id="tabStudy" onclick="switchTab('study')">Daily Recall Session</button>
      <button class="tab-link" id="tabDeck" onclick="switchTab('deck')">Spaced Revision Deck</button>
    </div>
    <div class="date-label" id="todayLabel"></div>
  </div>

  <div id="viewStudy">
    <div id="appContainer"></div>
  </div>

  <div id="viewDeck" style="display:none;">
    <div class="card">
      <div class="card-header">
        <h3 style="margin:0;font-size:1.1rem">Active Spaced Memory Deck</h3>
        <span class="step-badge" id="deckCountBadge">0 Cards</span>
      </div>
      <p style="color:var(--muted);font-size:0.85rem;margin:0 0 16px;">
        Progression: <strong>Day 1 → Day 7 → Day 21 (Long-Term Retention)</strong>. Missed points return the card to Day 1.
      </p>
      <div id="queueContainer"></div>
    </div>
  </div>
</div>

<script>
// Built-in Static Anchor Bank (Acts as resilient fallback if offline)
const STATIC_KNOWLEDGE_BANK = [
  {
    id: 201,
    title: "Delimitation Commission and Federal Representation Parity",
    paper: "GS-2",
    keywords: ["82", "170", "84th", "2026", "329", "census"],
    newsContext: "Renewed political debate over the post-census readjustment of seats and the potential penalty on southern states with low fertility rates.",
    prelimsTraps: [
      "Can Delimitation Commission orders be challenged in High Courts? (No: Barred under Article 329(a)).",
      "Which constitutional amendment extended the freeze on Lok Sabha seats until the first census after 2026? (84th Amendment Act 2001)."
    ],
    staticAnchors: [
      "Article 82 (Parliamentary readjustment post-Census) & Article 170 (State Legislative Assemblies composition).",
      "Orders carry the force of law and cannot be questioned in any court of law once published.",
      "Federalism dilemma: Democratic representation proportional to population vs. rewarding effective population control."
    ],
    mainsSnippet: {
      intro: "Delimitation operationalizes the democratic mandate of proportional constituency representation under Articles 82 and 170.",
      keywords: ["Constitutional freeze", "Asymmetrical federalism", "Representation penalty"],
      wayForward: "Adopt a weighted bicameral balance: allow population-based adjustment in the Lok Sabha while expanding state powers in the Rajya Sabha."
    }
  },
  {
    id: 202,
    title: "SC on Right Against Climate Change & Great Indian Bustard",
    paper: "GS-3",
    keywords: ["14", "21", "48a", "critically endangered", "rajasthan", "collision"],
    newsContext: "Supreme Court (M.K. Ranjitsinh case) recognizes the right against adverse climate impacts under Articles 14 & 21 while balancing solar transmission lines.",
    prelimsTraps: [
      "What is the IUCN status of the Great Indian Bustard? (Critically Endangered, Schedule I of WPA 1972).",
      "Is the right against climate change an explicit textual fundamental right? (Derived via judicial interpretation of Articles 14 & 21)."
    ],
    staticAnchors: [
      "Great Indian Bustard: Flagship arid grassland species of Thar Desert (Rajasthan) and Kutch (Gujarat).",
      "Constitutional synergy: Article 21 (Clean environment) read with Article 48A (DPSP State obligation) and Article 51A(g) (Fundamental Duty).",
      "Ecological trade-off: Green energy infrastructure (overhead transmission wires) vs. avian mortality due to narrow frontal vision."
    ],
    mainsSnippet: {
      intro: "In M.K. Ranjitsinh (2024), the Supreme Court integrated the right against climate change into the fundamental right to life.",
      keywords: ["Ecological jurisprudence", "Sustainable development reconciliation", "Climate mitigation"],
      wayForward: "Mandate underground cables strictly within core breeding corridors while standardizing high-visibility bird flight diverters in outer buffers."
    }
  },
  {
    id: 203,
    title: "Governor's Assent to Bills and Article 200 Inaction Dilemma",
    paper: "GS-2",
    keywords: ["200", "201", "shamsher", "nabam rebia", "sarkaria", "punchhi"],
    newsContext: "State governments approaching the Supreme Court under Article 32 over prolonged gubernatorial inaction on state legislative enactments.",
    prelimsTraps: [
      "Can a Money Bill be returned by the Governor for reconsideration? (No: Expressly barred under Article 200).",
      "Does the Constitution specify a strict deadline for the Governor to act? (Uses the phrase 'as soon as possible', lacking a numeric limit)."
    ],
    staticAnchors: [
      "Article 200 options: Assent, withhold assent, reserve for the President (Article 201), or return to the House with a message.",
      "Shamsher Singh (1974) and Nabam Rebia (2016): Governor acts on aid and advice with narrow discretionary exceptions.",
      "Sarkaria Commission (1988) & Punchhi Commission (2010): Recommended a maximum time limit (e.g., 6 months) for bill disposal."
    ],
    mainsSnippet: {
      intro: "Article 200 functions as a constitutional check rather than an obstructionist veto over democratically elected legislatures.",
      keywords: ["Gubernatorial discretion", "Legislative friction", "Constitutional morality"],
      wayForward: "Formalize procedural guidelines prescribing a binding 3-to-6-month window for Governors to dispose of legislative bills."
    }
  },
  {
    id: 204,
    title: "Executive Remission Jurisprudence: Section 433A CrPC & BNSS 473",
    paper: "GS-2",
    keywords: ["72", "161", "433a", "14 years", "bilkis", "epuru", "arbitrary"],
    newsContext: "Judicial scrutiny of executive remission orders granted without subjective satisfaction, trial judge consultation, or victim consideration.",
    prelimsTraps: [
      "Can statutory provisions like Section 433A override constitutional pardoning powers under Article 161? (No: Constitutional powers override statutes).",
      "Minimum actual imprisonment mandated by Section 433A for capital offenses? (14 years actual custody)."
    ],
    staticAnchors: [
      "Constitutional clemency: Article 72 (President) vs. Article 161 (Governor) are sovereign constitutional prerogatives.",
      "Statutory limit: Section 433A CrPC (BNSS Sec 473) mandates a minimum 14 years actual imprisonment for offenses carrying capital punishment.",
      "Bilkis Bano (2024) and Epuru Sudhakar: Executive remission remains subject to judicial review against arbitrariness and non-application of mind."
    ],
    mainsSnippet: {
      intro: "Executive remission reconciles retributive penal law with reformative justice, guided by objective statutory criteria.",
      keywords: ["Reformative penology", "Rule of law", "Subjective satisfaction vs arbitrariness"],
      wayForward: "Mandate transparent, independent prison advisory boards and ensure victim impact assessments are weighed prior to early release."
    }
  },
  {
    id: 205,
    title: "UN Plastics Treaty (INC) & Extended Producer Responsibility",
    paper: "GS-3",
    keywords: ["5mm", "epr", "basel", "upstream", "downstream", "single use"],
    newsContext: "Global diplomatic deadlock on whether to place caps on virgin plastic production or focus exclusively on downstream recycling.",
    prelimsTraps: [
      "Technical threshold for microplastics? (Synthetic solid particles measuring less than 5mm in diameter).",
      "Did the 2019 Basel Convention amendments regulate plastic waste? (Yes: Brought hazardous plastic scrap under prior informed consent)."
    ],
    staticAnchors: [
      "Microplastics: Primary (manufactured microbeads) vs. secondary (weathered debris); biomagnifies across marine food chains.",
      "Plastic Waste Management Rules in India: Extended Producer Responsibility (EPR) mandates minimum recycling quotas.",
      "Global negotiating divide: High Ambition Coalition (upstream production caps) vs. petrochemical nations (waste management focus)."
    ],
    mainsSnippet: {
      intro: "The UN INC process aims to create the first legally binding multilateral treaty addressing the full lifecycle of plastics.",
      keywords: ["Extended producer responsibility", "Circular economy", "Upstream production caps"],
      wayForward: "Adopt harmonized polymer transparency standards while funding green technology transfer for developing nations."
    }
  }
];

const STORAGE_KEY = 'upsc_super_recall_v6';
let appState = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');

const todayStr = new Date().toISOString().slice(0, 10);
document.getElementById('todayLabel').innerText = todayStr;

if (!appState) {
  appState = {
    activeMode: 'mains',
    deck: [],
    lastDate: todayStr,
    currentIndex: 0,
    completedCount: 0
  };
  saveState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
}

// Reset daily session counters at midnight
if (appState.lastDate !== todayStr) {
  appState.lastDate = todayStr;
  appState.currentIndex = 0;
  appState.completedCount = 0;
  saveState();
}

// Deterministic calendar rotation algorithm
function getDailySet(dateStr) {
  let hash = 0;
  for (let i = 0; i < dateStr.length; i++) {
    hash = (hash << 5) - hash + dateStr.charCodeAt(i);
    hash |= 0;
  }
  let pool = [...STATIC_KNOWLEDGE_BANK];
  let batch = [];
  let seed = Math.abs(hash);
  for (let k = 0; k < 5; k++) {
    let idx = (seed + k * 17) % pool.length;
    batch.push(pool.splice(idx, 1)[0]);
  }
  return batch;
}

let activeArticles = getDailySet(todayStr);

// Client-side live RSS feed fetcher with auto-fallback
async function fetchLiveNews() {
  const livePill = document.getElementById('liveStatusText');
  try {
    const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://indianexpress.com/section/explained/feed/');
    if (!response.ok) throw new Error();
    const data = await response.json();
    if (data.items && data.items.length >= 3) {
      data.items.slice(0, 3).forEach((item, i) => {
        if (activeArticles[i]) {
          activeArticles[i].newsContext = item.title + " — " + (item.description ? item.description.replace(/<[^>]*>/g, '').slice(0, 140) + '...' : '');
        }
      });
      livePill.innerText = "Live Feed: Synced";
    }
  } catch (e) {
    livePill.innerText = "Static Anchor Deck";
  }
  render();
}

let stage = 'study';
let recallSlots = { peg1: '', peg2: '', peg3: '', peg4: '' };
let detectedKeywords = [];
let missedKeywords = [];

function render() {
  const container = document.getElementById('appContainer');
  const idx = appState.currentIndex;
  document.getElementById('progressPill').innerText = `${appState.completedCount} / ${activeArticles.length} Done`;

  if (idx >= activeArticles.length) {
    container.innerHTML = `
      <div class="card" style="text-align:center; padding:44px 20px;">
        <div style="font-size:2rem;margin-bottom:8px;">🎯</div>
        <h2 style="color:var(--good);margin:0 0 8px;font-size:1.35rem;">Daily Recall Session Complete!</h2>
        <p style="color:var(--muted);font-size:0.9rem;max-width:440px;margin:0 auto 20px;">
          All high-yield UPSC anchors for <strong>${todayStr}</strong> are committed to memory and logged into your 1–7–21 Spaced Deck.
        </p>
        <button class="btn-primary" onclick="restartBatch()">Redo Today's Deck</button>
      </div>
    `;
    return;
  }

  const art = activeArticles[idx];

  if (stage === 'study') {
    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div>
            <span class="step-badge">Step 1 • Study Static Anchors</span>
            <span class="gs-tag ${art.paper}">${art.paper}</span>
          </div>
          <div class="mode-toggle">
            <button class="${appState.activeMode === 'mains' ? 'active' : ''}" onclick="toggleMode('mains')">Mains</button>
            <button class="${appState.activeMode === 'prelims' ? 'active' : ''}" onclick="toggleMode('prelims')">Prelims</button>
          </div>
        </div>
