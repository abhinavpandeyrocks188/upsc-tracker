<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UPSC Super Recall — Bespoke Live AI Engine</title>
<meta name="theme-color" content="#050811">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UPSC Recall">
<link id="dynamicFavicon" rel="icon" type="image/png" href="">
<link id="dynamicAppleIcon" rel="apple-touch-icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050811;
  --bg-glow: radial-gradient(circle at 50% -10%, #15274e 0%, #050811 68%);
  --card: rgba(15, 23, 42, 0.95);
  --card-sub: #111a30;
  --border: #23355c;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-dark: #0284c7;
  --good: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --gs1: #f43f5e;
  --gs2: #38bdf8;
  --gs3: #10b981;
  --gs4: #a855f7;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  background-image: var(--bg-glow);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.58;
  padding: 14px;
  min-height: 100vh;
}
.shell { max-width: 920px; margin: 0 auto; padding-bottom: 50px; }

.topbar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px; padding: 15px 18px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 14px;
}
.brand-wrap { display: flex; align-items: center; gap: 12px; }
.app-logo {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, #0ea5e9, #1e3a8a);
  border: 1px solid #7dd3fc; display: flex; align-items: center;
  justify-content: center; font-weight: 800; font-size: 0.82rem;
  color: #fff; letter-spacing: -0.03em; box-shadow: 0 4px 12px rgba(14,165,233,0.3);
}
.brand h1 {
  font-size: 1.28rem; font-weight: 800; margin: 0; letter-spacing: -0.02em;
  background: linear-gradient(90deg, #ffffff, #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand p { margin: 2px 0 0; font-size: 0.75rem; color: var(--muted); }

.meta-cluster { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
  border-radius: 999px; font-size: 0.74rem; font-weight: 700;
  background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); color: #34d399;
}
.status-pill.syncing { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.35); color: var(--accent); }
.status-pill.offline { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35); color: #fbbf24; }
.dot {
  width: 7px; height: 7px; border-radius: 50%; background: currentColor;
  box-shadow: 0 0 8px currentColor; animation: pulse 1.8s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.clock-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 0.73rem; font-weight: 700;
  padding: 5px 10px; border-radius: 999px; background: var(--card-sub);
  border: 1px solid var(--border); color: #fbbf24;
}

.nav-row {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
}
.tab-box { display: flex; background: var(--card); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
.tab-btn {
  background: transparent; border: none; color: var(--muted); font-weight: 700;
  font-size: 0.8rem; padding: 7px 14px; border-radius: 7px; cursor: pointer;
}
.tab-btn.active { background: var(--accent); color: #031322; }

.date-box { display: flex; align-items: center; gap: 6px; background: var(--card); padding: 4px 6px; border-radius: 10px; border: 1px solid var(--border); }
.mini-btn {
  background: var(--card-sub); border: 1px solid var(--border); color: var(--text);
  font-size: 0.74rem; font-weight: 700; padding: 5px 9px; border-radius: 6px; cursor: pointer;
}
.mini-btn:active { transform: scale(0.96); }
.date-text { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; font-weight: 700; padding: 0 6px; color: var(--accent); }

.prog-bar { display: flex; gap: 6px; margin-bottom: 14px; }
.prog-step {
  flex: 1; height: 6px; border-radius: 999px; background: var(--card-sub);
  border: 1px solid var(--border); cursor: pointer;
}
.prog-step.done { background: var(--good); border-color: var(--good); }
.prog-step.active { background: var(--accent); border-color: var(--accent); }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 22px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38); margin-bottom: 16px;
}
.card-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step-tag {
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 4px 9px; border-radius: 6px; background: rgba(56, 189, 248, 0.12);
  color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3);
}
.gs-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; font-weight: 800;
  padding: 3px 9px; border-radius: 6px;
}
.gs-badge.GS-1 { background: rgba(244, 63, 94, 0.16); color: #fda4af; border: 1px solid var(--gs1); }
.gs-badge.GS-2 { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid var(--gs2); }
.gs-badge.GS-3 { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid var(--gs3); }
.gs-badge.GS-4 { background: rgba(168, 85, 247, 0.16); color: #d8b4fe; border: 1px solid var(--gs4); }

.src-badge { font-size: 0.7rem; font-weight: 700; color: #cbd5e1; background: #1e293b; padding: 3px 8px; border-radius: 5px; border: 1px solid #334155; }
.mode-switch { display: inline-flex; background: #080d1a; padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
.mode-btn { background: transparent; border: none; color: var(--muted); font-size: 0.74rem; font-weight: 700; padding: 4px 10px; border-radius: 5px; cursor: pointer; }
.mode-btn.active { background: var(--card-sub); color: var(--accent); }

.art-title { font-size: 1.24rem; font-weight: 800; line-height: 1.36; margin: 0 0 14px; color: #fff; }
.box { background: var(--card-sub); border: 1px solid var(--border); border-radius: 11px; padding: 14px 16px; margin-bottom: 14px; }
.box-head {
  font-size: 0.69rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
}
ul.clean-ul { margin: 0; padding-left: 18px; }
ul.clean-ul li { margin-bottom: 8px; font-size: 0.91rem; }

.peg-group { margin-bottom: 12px; }
.peg-group label { display: block; font-size: 0.79rem; font-weight: 700; color: #93c5fd; margin-bottom: 5px; }
.peg-inp {
  width: 100%; background: #070c18; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; color: var(--text); font-family: inherit; font-size: 0.9rem;
}
.peg-inp:focus { outline: none; border-color: var(--accent); }
textarea.peg-inp { min-height: 68px; resize: vertical; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.primary-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #03111f;
  border: none; border-radius: 9px; padding: 12px 20px; font-size: 0.9rem; font-weight: 800; cursor: pointer;
}
.primary-btn:active { transform: scale(0.98); }
.secondary-btn {
  background: var(--card-sub); color: var(--text); border: 1px solid var(--border);
  border-radius: 9px; padding: 11px 16px; font-size: 0.84rem; font-weight: 700; cursor: pointer;
}

.kw-pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin: 3px 5px 3px 0; }
.kw-hit { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid var(--good); }
.kw-miss { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid var(--bad); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 620px) { .grid-2 { grid-template-columns: 1fr; } }

.banner {
  background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35);
  color: #7dd3fc; padding: 9px 13px; border-radius: 9px; font-size: 0.8rem; font-weight: 600; margin-bottom: 12px;
}
.deck-item {
  background: var(--card-sub); border: 1px solid var(--border); border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between;
  align-items: center; gap: 10px; flex-wrap: wrap;
}
.ext-link { color: var(--accent); text-decoration: none; font-size: 0.75rem; font-weight: 700; }
.spinner {
  display: inline-block; width: 28px; height: 28px;
  border: 3px solid rgba(56,189,248,0.25); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="app-logo">UPSC</div>
      <div class="brand">
        <h1>UPSC Super Recall</h1>
        <p>Bespoke Article-Specific Static Synthesizer • 1–7–21 Memory Ladder</p>
      </div>
    </div>
    <div class="meta-cluster">
      <div class="status-pill syncing" id="liveBadge">
        <span class="dot"></span>
        <span id="liveText">Synthesizing...</span>
      </div>
      <button class="mini-btn" data-action="force-live-sync">🔄 Re-Articulate Live</button>
      <div class="clock-pill" id="midnightTimer">00:00:00</div>
    </div>
  </header>

  <div class="nav-row">
    <div class="tab-box">
      <button class="tab-btn active" id="tabBtnStudy" data-action="switch-study">Live Daily Recall (5)</button>
      <button class="tab-btn" id="tabBtnDeck" data-action="switch-deck">Spaced Deck (<span id="deckCount">0</span>)</button>
    </div>
    <div class="date-box">
      <button class="mini-btn" data-action="day-prev">◀ Prev</button>
      <span class="date-text" id="dateDisplay">--</span>
      <button class="mini-btn" data-action="day-today">Today</button>
      <button class="mini-btn" data-action="day-next">Next ▶</button>
    </div>
  </div>

  <div id="bannerMount"></div>

  <div id="viewStudy">
    <div class="prog-bar" id="progStrip"></div>
    <div id="cardMount"></div>
  </div>

  <div id="viewDeck" style="display:none;">
    <div class="card">
      <div class="card-head">
        <h3 style="margin:0;font-size:1.1rem">Stored Attempts & 1–7–21 Spaced Queue</h3>
        <button class="mini-btn" data-action="export-json">Export Backup</button>
      </div>
      <p style="color:var(--muted);font-size:0.84rem;margin:0 0 14px;">
        Every completed article is archived here with your recall inputs, missed keywords, and next review date.
      </p>
      <div id="deckListMount"></div>
    </div>
  </div>
</div>

<script>
(function() {
  // 0. GENERATE CUSTOM HOMESCREEN ICON BADGE DYNAMICALLY
  function generateAppBadgeIcon() {
    try {
      const c = document.createElement("canvas");
      c.width = 192; c.height = 192;
      const ctx = c.getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, 192, 192);
      grad.addColorStop(0, "#0b1528");
      grad.addColorStop(1, "#1e3a8a");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(0, 0, 192, 192, 42);
      ctx.fill();
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 46px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("UPSC", 96, 95);
      ctx.fillStyle = "#38bdf8";
      ctx.font = "700 24px monospace";
      ctx.fillText("RECALL", 96, 135);
      const dataUrl = c.toDataURL("image/png");
      document.getElementById("dynamicFavicon").href = dataUrl;
      document.getElementById("dynamicAppleIcon").href = dataUrl;
    } catch (e) {}
  }
  generateAppBadgeIcon();

  // 1. GRANULAR MICRO-TOPIC KNOWLEDGE GRAPH (25+ Specific UPSC Subtopics so fallback is never repetitive)
  const MICRO_TOPICS = [
    {
      keys: ["governor", "assent", "bill", "article 200", "president", "legislature", "ordinance"],
      paper: "GS-2", subtopic: "State Executive & Legislative Relations",
      anchors: [
        "Constitutional Provision: Article 200 empowers the Governor to give assent, withhold assent, return (if not a Money Bill), or reserve a Bill for the President's consideration under Article 201.",
        "Judicial Precedent: In State of Punjab vs Principal Secretary to the Governor (2023) & Shamsher Singh (1974), the SC held the Governor cannot exercise a 'pocket veto' and must return reconsidered bills 'as soon as possible'.",
        "Commission Reforms: Punchhi Commission (2010) and Sarkaria Commission (1988) recommended a fixed 6-month statutory timeline for Governors to decide on state bills."
      ],
      prelims: [
        "Trap: If a State Legislature re-passes an ordinary bill without amendments, the Governor is constitutionally bound to grant assent under Article 200.",
        "Trap: Ordinance-making power of the Governor is under Article 213 (President is Article 123) and requires cabinet aid and advice."
      ],
      kws: ["Article 200", "Article 201", "Shamsher Singh", "Punchhi Commission", "Pocket Veto"]
    },
    {
      keys: ["delimitation", "census", "seat", "lok sabha", "population", "constituency", "fertility"],
      paper: "GS-2", subtopic: "Delimitation & Federal Representation",
      anchors: [
        "Constitutional Mandate: Article 82 directs Parliament to enact a Delimitation Act after every Census; Article 170 governs the division of territorial constituencies in State Assemblies.",
        "84th Amendment Freeze: The 84th Constitutional Amendment Act (2001) froze the total number of Lok Sabha seats on the basis of the 1971 Census until the first Census conducted after 2026.",
        "Non-Justiciability: Under Article 329(a), orders of the Delimitation Commission have the force of law and cannot be called into question in any court."
      ],
      prelims: [
        "Trap: 87th Amendment Act (2003) allowed intra-state readjustment of constituencies based on the 2001 Census without changing total state seat allocation.",
        "Trap: The Delimitation Commission is chaired by a serving or retired Judge of the Supreme Court, with the Chief Election Commissioner as an ex-officio member."
      ],
      kws: ["Article 82", "Article 170", "84th Amendment", "Article 329", "2026 Freeze"]
    },
    {
      keys: ["supreme court", "high court", "collegium", "judge", "chief justice", "cji", "bench", "article 142", "contempt", "judicial"],
      paper: "GS-2", subtopic: "Judiciary & Constitutional Remedies",
      anchors: [
        "Appointment Architecture: Articles 124(2) and 217 govern SC and HC judicial appointments, operationalized via the Collegium System evolved through the Three Judges Cases (1981, 1993, 1998) and NJAC Judgment (2015).",
        "Complete Justice Power: Article 142 vests the Supreme Court with plenary power to pass any decree necessary for doing 'complete justice' in any cause pending before it.",
        "Constitutional Doctrine: Judicial Independence and the power of Judicial Review (Articles 13, 32, 226) form an unamendable part of the Basic Structure (Minerva Mills 1980)."
      ],
      prelims: [
        "Trap: High Court writ jurisdiction under Article 226 is wider in scope than the Supreme Court's under Article 32 (as Article 226 extends to legal rights in addition to Fundamental Rights).",
        "Trap: The 99th Constitutional Amendment Act (NJAC) was struck down in the Fourth Judges Case (2015) to safeguard judicial primacy."
      ],
      kws: ["Article 124", "Article 142", "Article 226", "Collegium", "Basic Structure"]
    },
    {
      keys: ["election", "eci", "voter", "evm", "vvpat", "model code", "defection", "speaker", "tenth schedule", "disqualification"],
      paper: "GS-2", subtopic: "Electoral Reforms & Anti-Defection Law",
      anchors: [
        "Election Commission Mandate: Article 324 vests superintendence, direction, and control of elections in the ECI; per the CEC and Other Election Commissioners Act (2023), the selection panel comprises the PM, a Union Cabinet Minister, and the LoP.",
        "Tenth Schedule (Anti-Defection): Inserted by the 52nd Amendment Act (1985); the 91st Amendment (2003) deleted the 1/3rd split exception, requiring a 2/3rd merger threshold.",
        "Judicial Oversight: In Kihoto Hollohan (1992), the Supreme Court held the Speaker acts as a tribunal under the 10th Schedule, making decisions subject to judicial review under Articles 136, 226, and 227."
      ],
      prelims: [
        "Trap: The Chief Election Commissioner enjoys the same removal protection as a Supreme Court Judge, whereas other Election Commissioners can be removed on the recommendation of the CEC.",
        "Trap: Nominated members must join a political party within 6 months of taking their seat, failing which joining a party invites disqualification under the 10th Schedule."
      ],
      kws: ["Article 324", "Tenth Schedule", "Kihoto Hollohan", "52nd Amendment", "Representation of People Act"]
    },
    {
      keys: ["bail", "arrest", "fir", "police", "prison", "remission", "bns", "bnss", "bsa", "criminal", "ed", "pmla", "cbi", "uapa"],
      paper: "GS-2", subtopic: "Criminal Justice, BNSS & Statutory Agencies",
      anchors: [
        "Constitutional Liberty: Articles 20 (protection in respect of conviction), 21 (procedure established by law / due process post-Maneka Gandhi 1978), and 22 (safeguards against arbitrary arrest).",
        "Statutory Overhaul: Bharatiya Nagarik Suraksha Sanhita (BNSS) introduces Zero FIR, e-FIR, mandatory forensic investigation for offences punishable by 7+ years, and Section 479 (bail for first-time undertrials completing 1/3rd of maximum sentence).",
        "Clemency & Remission: Constitutional pardoning powers under Article 72 (President) and Article 161 (Governor) operate independently of statutory remission under Section 473 BNSS (14-year life convict rule)."
      ],
      prelims: [
        "Trap: Under the Delhi Special Police Establishment Act (1946), CBI requires 'General Consent' from state governments, though Constitutional Courts can order CBI probes without state consent.",
        "Trap: In Arnesh Kumar (2014) and Satender Kumar Antil (2022), the SC mandated strict compliance with notice before arrest for offences punishable up to 7 years."
      ],
      kws: ["Article 21", "Article 22", "BNSS Section 479", "Arnesh Kumar", "Maneka Gandhi"]
    },
    {
      keys: ["rbi", "inflation", "repo", "monetary", "mpc", "bank", "npa", "rupee", "forex", "liquidity", "cbdc", "upi"],
      paper: "GS-3", subtopic: "Monetary Policy & Banking Regulation",
      anchors: [
        "Statutory Framework: Section 45ZB of the Reserve Bank of India Act, 1934 constitutes the 6-member Monetary Policy Committee (MPC) mandated to maintain CPI headline inflation at 4% (+/- 2% tolerance band).",
        "Policy Instruments: Repo Rate (short-term lending rate), Standing Deposit Facility (SDF — absorbs liquidity without collateral), Cash Reserve Ratio (CRR), and Statutory Liquidity Ratio (SLR).",
        "External Sector Balance: RBI intervenes in spot and forward forex markets to curb excessive volatility in the Rupee (INR) without targeting a fixed exchange rate band."
      ],
      prelims: [
        "Trap: Headline CPI is compiled monthly by the National Statistical Office (NSO) under MoSPI, not the RBI.",
        "Trap: The RBI Governor chairs the 6-member MPC and holds a casting vote only in the event of a tie."
      ],
      kws: ["Section 45ZB", "Monetary Policy Committee", "CPI Inflation", "Standing Deposit Facility", "RBI Act 1934"]
    },
    {
      keys: ["gdp", "fiscal", "budget", "tax", "gst", "deficit", "capex", "frbm", "disinvestment", "bond", "finance commission", "panchayat"],
      paper: "GS-3", subtopic: "Fiscal Policy, Taxation & Devolution",
      anchors: [
        "Constitutional Fiscal Architecture: Article 265 (no tax without authority of law), Article 266 (Consolidated Fund), Article 279A (GST Council), and Article 280 (Union Finance Commission).",
        "Fiscal Consolidation Mandate: The Fiscal Responsibility and Budget Management (FRBM) Act, 2003 (N.K. Singh Committee review) guides the Centre's glide path to reduce the fiscal deficit below 4.5% of GDP.",
        "Third-Tier Decentralization: Articles 243-I and 243-Y mandate State Finance Commissions every 5 years to address the '3F Deficit' (Funds, Functions, Functionaries) in local bodies."
      ],
      prelims: [
        "Trap: In the GST Council (Article 279A), the Centre holds 1/3rd voting weightage and all States together hold 2/3rd weightage; decisions require a 3/4th majority of weighted votes.",
        "Trap: Effective Capital Expenditure includes central capital expenditure plus grants-in-aid to states specifically for creation of capital assets."
      ],
      kws: ["Article 279A", "Article 280", "FRBM Act", "Capital Expenditure", "Fiscal Deficit"]
    },
    {
      keys: ["agriculture", "msp", "farmer", "crop", "fertilizer", "urea", "fci", "pds", "food", "irrigation", "millet", "oilseed", "pulse"],
      paper: "GS-3", subtopic: "Agriculture, MSP & Food Security",
      anchors: [
        "MSP Determination: Recommended by the Commission for Agricultural Costs and Prices (CACP) for 22 mandated crops (plus Fair and Remunerative Price for sugarcane) and approved by the Cabinet Committee on Economic Affairs (CCEA).",
        "Cost Formulae: CACP calculates A2 (actual paid-out cost), A2+FL (paid-out cost plus imputed value of unpaid family labour), and C2 (comprehensive cost including imputed rent and interest on owned land).",
        "Food Security Architecture: National Food Security Act (NFSA), 2013 provides legal entitlement to subsidized foodgrains for 75% rural and 50% urban populations through the Targeted Public Distribution System (TPDS)."
      ],
      prelims: [
        "Trap: CACP is an attached office of the Ministry of Agriculture and Farmers Welfare, not a statutory body; MSP currently has no statutory backing.",
        "Trap: Under WTO Agreement on Agriculture (AoA), price-support procurement exceeding 10% of total value of production (De Minimis limit, 1986-88 base) faces challenges unless shielded by the Bali Peace Clause."
      ],
      kws: ["CACP", "A2+FL Cost", "NFSA 2013", "WTO Peace Clause", "Crop Diversification"]
    },
    {
      keys: ["climate", "cop", "unfccc", "carbon", "emission", "solar", "hydrogen", "renewable", "plastic", "pollution", "aqi", "glacier"],
      paper: "GS-3", subtopic: "Climate Change, Energy Transition & Treaties",
      anchors: [
        "Multilateral Architecture: UNFCCC Article 3 enshrines Common But Differentiated Responsibilities and Respective Capabilities (CBDR-RC); Paris Agreement Article 6 governs international carbon markets.",
        "Domestic Statutory Backing: The Energy Conservation (Amendment) Act, 2022 empowers the Centre to specify the Carbon Credit Trading Scheme (CCTS), while the Environment (Protection) Act, 1986 backs Extended Producer Responsibility (EPR).",
        "Panchamrit Commitments: India targets 500 GW non-fossil fuel capacity and 45% reduction in emissions intensity of GDP (from 2005 levels) by 2030, achieving Net-Zero by 2070."
      ],
      prelims: [
        "Trap: Green Hydrogen is produced by splitting water via electrolysis powered strictly by renewable energy; Grey Hydrogen uses natural gas without carbon capture.",

  // 2. EXTRACT SPECIFIC ENTITIES & KEYWORDS FROM LIVE ARTICLE
  function extractArticleEntities(title, bodyText) {
    const full = title + " " + bodyText;
    const found = [];
    const add = (w) => {
      const clean = w.replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g, "").trim();
      const low = clean.toLowerCase();
      if (clean.length >= 3 && !STOPWORDS.has(low) && !/^\d+$/.test(clean)) {
        if (!found.some(x => x.toLowerCase() === low)) found.push(clean);
      }
    };

    // Match specific Articles, Sections, Acts, Amendments, Commissions
    const legalMatches = full.match(/\b(Article\s+\d+[A-Z]?|Section\s+\d+[A-Z]?|\d+(?:st|nd|rd|th)\s+Amendment|[A-Z][a-zA-Z]+\s+(?:Act|Bill|Commission|Committee|Treaty|Protocol|Mission|Court|Policy))\b/g) || [];
    legalMatches.forEach(m => add(m));

    // Match Multi-word Capitalized Proper Nouns in Title
    const multiCap = title.match(/\b([A-Z][a-z0-9]+(?:\s+[A-Z][a-z0-9]+)+)\b/g) || [];
    multiCap.forEach(m => { if (m.length <= 28) add(m); });

    // Match Uppercase Acronyms (2 to 6 chars like RBI, ISRO, UNCLOS, NATO, BRICS, UAPA)
    const acronyms = full.match(/\b[A-Z]{2,6}\b/g) || [];
    acronyms.forEach(a => { if (!["THE","AND","FOR","WHY","HOW","WHO","NEW","TWO","SIX","TEN"].includes(a)) add(a); });

    // Single Capitalized Nouns from Title
    title.split(/\s+/).forEach(w => {
      if (/^[A-Z][a-zA-Z-]{3,}$/.test(w)) add(w);
    });

    return found;
  }

  // 3. STAGE-2 BESPOKE LIVE AI SYNTHESIZER (Calls keyless public LLM endpoint for 100% custom article articulation)
  async function synthesizeBespokeUpscWithAI(title, summaryText) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5200);
    const sysPrompt = "You are a senior UPSC CSE faculty. Given a live news headline and summary, return ONLY a valid JSON object (no markdown fences) tailored specifically to this exact article.";
    const userPrompt = `News Headline: "${title}"
News Summary: "${summaryText}"

Return strictly this JSON structure with specific, accurate Indian Constitutional Articles, Acts, Supreme Court cases, or international treaties directly relevant to this specific news item:
{
  "paper": "GS-1" or "GS-2" or "GS-3" or "GS-4",
  "subtopic": "Specific UPSC syllabus topic (3-4 words)",
  "keywords": ["5 specific statutory/proper-noun/doctrinal terms for this article"],
  "anchors": [
    "Constitutional / Statutory Provision: Exact Articles, Sections, or Acts applicable to this specific news.",
    "Landmark Precedent / Institutional Mechanism: Specific Supreme Court judgment, Commission report, or international treaty governing this topic.",
    "Core UPSC Analytical Angle: The exact policy, federal, economic, or ethical tension in this specific news."
  ],
  "prelims": [
    "Prelims Trap 1: Specific objective fact, parent ministry, composition, or legal exception related to this article.",
    "Prelims Trap 2: Another high-probability Prelims statement trap directly about the entity in this news."
  ],
  "mains": {
    "intro": "1-sentence Mains introduction defining the core issue in this news.",
    "keywords": ["Keyword 1", "Keyword 2", "Keyword 3"],
    "wayForward": "1-sentence concrete, reform-oriented Way Forward for this specific issue."
  }
}`;

    const res = await fetch("https://text.pollinations.ai/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        messages: [
          { role: "system", content: sysPrompt },
          { role: "user", content: userPrompt }
        ],
        model: "openai",
        jsonMode: true,
        seed: 42
      })
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error("AI HTTP " + res.status);
    let raw = await res.text();
    raw = raw.trim().replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
    const firstBrace = raw.indexOf("{");
    const lastBrace = raw.lastIndexOf("}");
    if (firstBrace !== -1 && lastBrace !== -1) {
      raw = raw.slice(firstBrace, lastBrace + 1);
    }
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.anchors) || parsed.anchors.length < 2) {
      throw new Error("Incomplete AI JSON");
    }
    return parsed;
  }

  // 4. STAGE-1 GRANULAR MICRO-TOPIC + WIKIPEDIA ENTITY SYNTHESIZER (Instant deterministic article-specific fallback)
  async function fetchWikiBackgroundForEntity(entityName) {
    if (!entityName || entityName.length < 3) return null;
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2800);
      const url = "[https://en.wikipedia.org/api/rest_v1/page/summary/](https://en.wikipedia.org/api/rest_v1/page/summary/)" + encodeURIComponent(entityName.replace(/\s+/g, "_"));
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) return null;
      const data = await res.json();
      if (data && data.extract && data.extract.length > 40 && data.type !== "disambiguation") {
        const firstTwoSentences = data.extract.split(/(?<=[.?!])\s+/).slice(0, 2).join(" ");
        return firstTwoSentences;
      }
    } catch (e) {}
    return null;
  }

  async function articulateSingleArticle(rawItem, index) {
    const rawTitle = (rawItem.title || "National Policy Update")
      .replace(/ - The Hindu| - Indian Express| \| Explained News| \| India News/gi, "")
      .trim();

    const cleanBody = (rawItem.content || rawItem.description || "")
      .replace(/<[^>]+>/g, " ")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\s+/g, " ")
      .trim();

    const sentences = cleanBody
      .split(/(?<=[.?!])\s+/)
      .map(s => s.trim())
      .filter(s => s.length > 35 && s.length < 290);

    const contextSummary = sentences.length >= 2
      ? sentences.slice(0, 2).join(" ")
      : (cleanBody.length > 30 ? cleanBody.slice(0, 320) + "..." : rawTitle);

    const liveEntities = extractArticleEntities(rawTitle, cleanBody);

    // Try Stage-2 Live AI Bespoke Synthesis First (Waits ~1-2 seconds for genuine article-specific static linkage)
    try {
      const aiData = await synthesizeBespokeUpscWithAI(rawTitle, contextSummary);
      const mergedKws = [...new Set([...(aiData.keywords || []), ...liveEntities])]
        .filter(k => k && k.length >= 3 && !STOPWORDS.has(k.toLowerCase()))
        .slice(0, 6);

      return {
        id: "live_" + Date.now() + "_" + index,
        title: rawTitle,
        source: (rawItem.sourceName || "Live Feed") + " • AI Synthesized",
        link: rawItem.link || "",
        paper: ["GS-1","GS-2","GS-3","GS-4"].includes(aiData.paper) ? aiData.paper : "GS-2",
        subtopic: aiData.subtopic || "Current Affairs Linkage",
        keywords: mergedKws.length >= 4 ? mergedKws : ["Article 21", "Constitutionalism", "Statutory Mandate", "Public Policy", "Accountability"],
        context: contextSummary,
        prelims: aiData.prelims,
        anchors: aiData.anchors,
        mains: aiData.mains
      };
    } catch (aiErr) {
      // Fallback to Stage-1 Granular 14-Topic Matcher + Live Wikipedia Entity Background
      const fullLower = (rawTitle + " " + cleanBody).toLowerCase();
      let bestTopic = MICRO_TOPICS[index % MICRO_TOPICS.length];
      let maxHits = -1;

      for (let i = 0; i < MICRO_TOPICS.length; i++) {
        const t = MICRO_TOPICS[i];
        let score = 0;
        for (let j = 0; j < t.keys.length; j++) {
          if (fullLower.includes(t.keys[j])) {
            score += (rawTitle.toLowerCase().includes(t.keys[j]) ? 5 : 2);
          }
        }
        if (score > maxHits) {
          maxHits = score;
          bestTopic = t;
        }
      }

      // Fetch real encyclopedic background on the primary entity in the headline
      const primaryEntity = liveEntities[0] || "";
      const wikiFact = await fetchWikiBackgroundForEntity(primaryEntity);

      const combinedKws = [...new Set([...liveEntities.slice(0, 3), ...bestTopic.kws])].slice(0, 6);
      const customAnchors = [
        wikiFact
          ? `Entity Background (${primaryEntity}): ${wikiFact}`
          : (sentences[2] ? `Key Article Detail: ${sentences[2]}` : bestTopic.anchors[0]),
        bestTopic.anchors[0],
        bestTopic.anchors[1]
      ];

      return {
        id: "live_" + Date.now() + "_" + index,
        title: rawTitle,
        source: rawItem.sourceName || "Live National Feed",
        link: rawItem.link || "",
        paper: bestTopic.paper,
        subtopic: bestTopic.subtopic,
        keywords: combinedKws,
        context: contextSummary,
        prelims: bestTopic.prelims,
        anchors: customAnchors,
        mains: {
          intro: `The development concerning "${rawTitle.slice(0, 75)}" underscores critical institutional dynamics within ${bestTopic.subtopic}.`,
          keywords: combinedKws.slice(0, 3),
          wayForward: `Harmonize statutory implementation around ${combinedKws[0] || "constitutional norms"} with transparent parliamentary and judicial oversight.`
        }
      };
    }
  }

  // 5. LIVE RSS FETCHERS
  const LIVE_RSS_FEEDS = [
    { name: "Indian Express Explained", url: "[https://indianexpress.com/section/explained/feed/](https://indianexpress.com/section/explained/feed/)" },
    { name: "The Hindu National", url: "[https://www.thehindu.com/news/national/feeder/default.rss](https://www.thehindu.com/news/national/feeder/default.rss)" }
  ];

  async function fetchFeedViaRss2Json(feedObj) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6000);
    const res = await fetch("[https://api.rss2json.com/v1/api.json?rss_url=](https://api.rss2json.com/v1/api.json?rss_url=)" + encodeURIComponent(feedObj.url), { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error("status " + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.items) || !data.items.length) throw new Error("empty");
    return data.items.map(it => ({
      title: it.title || "", description: it.description || "", content: it.content || "",
      link: it.link || "", sourceName: feedObj.name
    }));
  }

  async function pullAndSynthesizeFiveArticles(onProgress) {
    let rawPool = [];
    for (let i = 0; i < LIVE_RSS_FEEDS.length; i++) {
      try {
        const items = await fetchFeedViaRss2Json(LIVE_RSS_FEEDS[i]);
        rawPool = rawPool.concat(items.slice(0, 4));
      } catch (e) {}
      if (rawPool.length >= 6) break;
    }
    if (rawPool.length === 0) throw new Error("Offline");

    const seen = new Set();
    const filtered = rawPool.filter(item => {
      const t = (item.title || "").toLowerCase();
      if (t.length < 18 || /cricket|ipl|bollywood|horoscope|quiz|movie|actor|football/.test(t)) return false;
      const key = t.slice(0, 30);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    const selectedRaw = (filtered.length >= 5 ? filtered : rawPool).slice(0, 5);
    if (onProgress) onProgress(`Synthesizing bespoke static linkages for ${selectedRaw.length} live articles...`);

    // Articulate all 5 articles concurrently so waiting time is only ~2 seconds total
    const articulated = await Promise.all(
      selectedRaw.map((raw, idx) => articulateSingleArticle(raw, idx))
    );
    return articulated;
  }

    if (att) {
      recallInputs = att.inputs || { p1: "", p2: "", p3: "", p4: "" };
      lastHits = att.hits || [];
      lastMisses = att.misses || [];
    } else {
      recallInputs = { p1: "", p2: "", p3: "", p4: "" };
      lastHits = []; lastMisses = [];
    }
  }

  function renderProgressStrip() {
    const bar = document.getElementById("progStrip");
    if (!bar) return;
    const att = getDayAttempts(getSelectedDateStr());
    let html = "";
    const total = dailyBatch.length || 5;
    for (let i = 0; i < total; i++) {
      let cls = "prog-step";
      if (att[i]) cls += " done";
      if (i === currentIdx) cls += " active";
      html += `<div class="${cls}" data-action="jump" data-idx="${i}" title="Article ${i+1}"></div>`;
    }
    bar.innerHTML = html;
  }

  function renderAll() {
    renderProgressStrip();
    const countEl = document.getElementById("deckCount");
    if (countEl) countEl.textContent = getDeck().length;
    const mount = document.getElementById("cardMount");
    if (!mount) return;

    if (currentIdx >= dailyBatch.length) {
      mount.innerHTML = `
        <div class="card" style="text-align:center;padding:42px 20px;">
          <div style="font-size:2.3rem;margin-bottom:10px;">🎯</div>
          <h2 style="margin:0 0 8px;color:var(--good);">Today's Live Batch Completed!</h2>
          <p style="color:var(--muted);font-size:0.9rem;max-width:480px;margin:0 auto 20px;">
            All 5 bespoke live articles for <strong>${getSelectedDateStr()}</strong> are stored in your Spaced Deck.
          </p>
          <div class="btn-row" style="justify-content:center;">
            <button class="primary-btn" data-action="restart">Review Article 1 Again</button>
            <button class="secondary-btn" data-action="switch-deck">View Spaced Deck →</button>
          </div>
        </div>
      `;
      return;
    }

    const art = dailyBatch[currentIdx];
    const saved = getDayAttempts(getSelectedDateStr())[currentIdx];

    if (stage === "study") {
      mount.innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="tag-group">
              <span class="step-tag">Article ${currentIdx + 1} of ${dailyBatch.length}</span>
              <span class="gs-badge ${art.paper}">${art.paper} • ${escapeHtml(art.subtopic)}</span>
              <span class="src-badge">📰 ${escapeHtml(art.source)}</span>
            </div>
            <div class="mode-switch">
              <button class="mode-btn ${activeMode === 'mains' ? 'active' : ''}" data-action="mode-mains">Mains Linkages</button>
              <button class="mode-btn ${activeMode === 'prelims' ? 'active' : ''}" data-action="mode-prelims">Prelims Traps</button>
            </div>
          </div>

          <h2 class="art-title">${escapeHtml(art.title)}</h2>

          <div class="box">
            <div class="box-head">
              <span>Live News Context (What Happened)</span>
              ${art.link ? `<a class="ext-link" href="${escapeHtml(art.link)}" target="_blank" rel="noopener">Read Full Article ↗</a>` : ""}
            </div>
            <div style="font-size:0.93rem;color:#e2e8f0;">${escapeHtml(art.context)}</div>
          </div>

          ${activeMode === "prelims" ? `
            <div class="box" style="border-color:var(--accent);">
              <div class="box-head" style="color:var(--accent);">Article-Specific Prelims Trap-Detectors</div>
              <ul class="clean-ul">${art.prelims.map(p => `<li><strong>${escapeHtml(p)}</strong></li>`).join("")}</ul>
            </div>
          ` : `
            <div class="box">
              <div class="box-head" style="color:#6ee7b7;">Bespoke UPSC Static Linkages (Tailored to This Article)</div>
              <ul class="clean-ul">${art.anchors.map(a => `<li>${escapeHtml(a)}</li>`).join("")}</ul>
            </div>
          `}

          <div class="box" style="background:#081021;">
            <div class="box-head">
              <span>Article-Specific Recall Keywords (${art.keywords.length})</span>
              ${saved ? `<span style="color:var(--good);">✓ Attempt Stored</span>` : ""}
            </div>
            <div>${art.keywords.map(k => `<span class="kw-pill" style="background:#162442;border:1px solid #2b4475;color:#93c5fd;">${escapeHtml(k)}</span>`).join("")}</div>
          </div>

          <div class="btn-row">
            <button class="primary-btn" data-action="go-recall">Start 4-Peg Active Recall → (Hide Notes)</button>
            <button class="secondary-btn" data-action="next-art">Next Article →</button>
          </div>
        </div>
      `;
    } else if (stage === "recall") {
      mount.innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="tag-group">
              <span class="step-tag">Step 2 • 4-Peg Blind Recall</span>
              <span class="gs-badge ${art.paper}">${art.paper}</span>
            </div>
          </div>

          <h2 class="art-title">${escapeHtml(art.title)}</h2>
          <p style="color:var(--muted);font-size:0.86rem;margin:0 0 14px;">Notes hidden! Recall the bespoke static linkages and target keywords for this specific news item.</p>

          <div class="peg-group">
            <label>Peg 1: Constitutional Articles / Statutory Acts / Bodies Involved</label>
            <input class="peg-inp" id="peg1" placeholder="Write the exact Articles, Acts, or Statutory Bodies..." value="${escapeHtml(recallInputs.p1)}">
          </div>
          <div class="peg-group">
            <label>Peg 2: Supreme Court Judgments / Committees / Treaties</label>
            <input class="peg-inp" id="peg2" placeholder="Write landmark cases, committees, or international mechanisms..." value="${escapeHtml(recallInputs.p2)}">
          </div>
          <div class="peg-group">
            <label>Peg 3: Specific Entities & Prelims Facts from This Article</label>
            <input class="peg-inp" id="peg3" placeholder="Write key facts, thresholds, or entities..." value="${escapeHtml(recallInputs.p3)}">
          </div>
          <div class="peg-group">
            <label>Peg 4: Mains Analytical Argument & Way Forward</label>
            <textarea class="peg-inp" id="peg4" placeholder="Synthesize the core governance issue and 1-line way forward...">${escapeHtml(recallInputs.p4)}</textarea>
          </div>

          <div class="btn-row">
            <button class="primary-btn" data-action="eval-recall">Evaluate & Save Attempt →</button>
            <button class="secondary-btn" data-action="back-study">◀ Peek at Notes</button>
          </div>
        </div>
      `;
    } else if (stage === "diff") {
      mount.innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="tag-group">
              <span class="step-tag">Step 3 • Keyword & Gap Analysis</span>
              <span class="gs-badge ${art.paper}">${art.paper}</span>
            </div>
          </div>

          <h2 class="art-title">${escapeHtml(art.title)}</h2>

          <div class="box">
            <div class="box-head">Keyword Evaluation (${lastHits.length} / ${art.keywords.length} Matched)</div>
            <div>
              ${lastHits.map(k => `<span class="kw-pill kw-hit">✓ Recalled: ${escapeHtml(k)}</span>`).join("")}
              ${lastMisses.map(k => `<span class="kw-pill kw-miss">✗ Missed: ${escapeHtml(k)}</span>`).join("")}
            </div>
          </div>

          <div class="grid-2">
            <div class="box">
              <div class="box-head" style="color:var(--accent);">Your Attempt</div>
              <div style="font-size:0.86rem;line-height:1.6;">
                <strong>Provisions:</strong> ${escapeHtml(recallInputs.p1) || "<em>Blank</em>"}<br>
                <strong>Cases:</strong> ${escapeHtml(recallInputs.p2) || "<em>Blank</em>"}<br>
                <strong>Entities:</strong> ${escapeHtml(recallInputs.p3) || "<em>Blank</em>"}<br>
                <strong>Mains:</strong> ${escapeHtml(recallInputs.p4) || "<em>Blank</em>"}
              </div>
            </div>
            <div class="box">
              <div class="box-head" style="color:var(--good);">Article-Specific Static Linkages</div>
              <ul class="clean-ul" style="font-size:0.85rem;">${art.anchors.map(a => `<li>${escapeHtml(a)}</li>`).join("")}</ul>
            </div>
          </div>

          <div class="btn-row">
            <button class="primary-btn" data-action="go-summary">View Mains Answer Snippet →</button>
          </div>
        </div>
      `;
    } else if (stage === "summary") {
      const interval = lastMisses.length <= 2 ? 21 : (lastMisses.length <= 4 ? 7 : 1);
      const dueStr = addDaysStr(getRealTodayStr(), interval);
      mount.innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="tag-group">
              <span class="step-tag">Step 4 • Mains Snippet & Spaced Lock</span>
              <span class="gs-badge ${art.paper}">${art.paper}</span>
            </div>
          </div>

          <h2 class="art-title">${escapeHtml(art.title)}</h2>

          <div class="box" style="border-color:#2563eb;background:#091326;">
            <div class="box-head" style="color:var(--accent);">Mains Answer-Writing Snippet (${art.paper})</div>
            <div style="font-size:0.89rem;margin-bottom:7px;"><strong>Intro:</strong> ${escapeHtml(art.mains.intro)}</div>
            <div style="font-size:0.89rem;margin-bottom:7px;"><strong>Value Keywords:</strong> ${(art.mains.keywords || []).map(escapeHtml).join(" • ")}</div>
            <div style="font-size:0.89rem;"><strong>Way Forward:</strong> ${escapeHtml(art.mains.wayForward)}</div>
          </div>

          <div class="box" style="background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.3);">
            <div style="font-size:0.86rem;color:#6ee7b7;">
              ✅ <strong>Attempt Saved:</strong> Scheduled for <strong>Day ${interval} Spaced Recall</strong> on <strong>${dueStr}</strong>.
            </div>
          </div>

          <div class="btn-row">
            <button class="primary-btn" data-action="lock-card">Lock Into Spaced Deck & Next →</button>
          </div>
        </div>
      `;
    }
  }

  function renderDeckList() {
    const mount = document.getElementById("deckListMount");
    if (!mount) return;
    const deck = getDeck();
    const today = getRealTodayStr();

    if (!deck.length) {
      mount.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);">No stored attempts yet. Complete any live article recall session to log it here.</div>`;
      return;
    }

    mount.innerHTML = deck.map(card => {
      const isDue = card.dueDate <= today;
      return `
        <div class="deck-item">
          <div style="flex:1;min-width:240px;">
            <div style="font-weight:700;font-size:0.95rem;">
              ${escapeHtml(card.title)}
              <span class="gs-badge ${card.paper}" style="margin-left:6px;">${card.paper}</span>
            </div>
            <div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">
              Learned: ${card.learnedDate} • Next Recall: <strong>${card.dueDate}</strong> (Day ${card.interval})
              ${isDue ? `<span style="color:var(--bad);font-weight:800;margin-left:6px;">⚠️ DUE TODAY</span>` : ""}
            </div>
            ${card.userAttempt ? `<div style="font-size:0.76rem;color:#93c5fd;margin-top:4px;"><strong>Your Notes:</strong> ${escapeHtml([card.userAttempt.p1, card.userAttempt.p2, card.userAttempt.p4].filter(Boolean).join(" | ").slice(0, 130))}</div>` : ""}
          </div>
          <div style="display:flex;gap:6px;">
            <button class="mini-btn" data-action="retest" data-id="${card.id}">Retest</button>
            <button class="mini-btn" style="color:var(--bad);" data-action="del-card" data-id="${card.id}">✕</button>
          </div>
        </div>
      `;
    }).join("");
  }

  // GLOBAL CLICK DELEGATION
  document.addEventListener("click", function(e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.getAttribute("data-action");

    if (action === "switch-study") {
      document.getElementById("viewStudy").style.display = "block";
      document.getElementById("viewDeck").style.display = "none";
      document.getElementById("tabBtnStudy").classList.add("active");
      document.getElementById("tabBtnDeck").classList.remove("active");
      renderAll();
    } else if (action === "switch-deck") {
      document.getElementById("viewStudy").style.display = "none";
      document.getElementById("viewDeck").style.display = "block";
      document.getElementById("tabBtnDeck").classList.add("active");
      document.getElementById("tabBtnStudy").classList.remove("active");
      renderDeckList();
    } else if (action === "force-live-sync") {
      currentIdx = 0; stage = "study"; loadArticlesForDate(true);
    } else if (action === "day-prev") {
      dayOffset -= 1; currentIdx = 0; stage = "study"; loadArticlesForDate(false);
    } else if (action === "day-next") {
      dayOffset += 1; currentIdx = 0; stage = "study"; loadArticlesForDate(false);
    } else if (action === "day-today") {
      dayOffset = 0; currentIdx = 0; stage = "study"; loadArticlesForDate(false);
    } else if (action === "jump") {
      const idx = parseInt(el.getAttribute("data-idx"), 10);
      if (!isNaN(idx)) { currentIdx = idx; stage = "study"; restoreAttempt(); renderAll(); }
    } else if (action === "mode-mains") { activeMode = "mains"; renderAll(); }
    else if (action === "mode-prelims") { activeMode = "prelims"; renderAll(); }
    else if (action === "go-recall") { stage = "recall"; renderAll(); }
    else if (action === "back-study") { stage = "study"; renderAll(); }
    else if (action === "next-art") { currentIdx += 1; stage = "study"; restoreAttempt(); renderAll(); }
    else if (action === "eval-recall") {
      recallInputs.p1 = (document.getElementById("peg1") || {}).value?.trim() || "";
      recallInputs.p2 = (document.getElementById("peg2") || {}).value?.trim() || "";
      recallInputs.p3 = (document.getElementById("peg3") || {}).value?.trim() || "";
      recallInputs.p4 = (document.getElementById("peg4") || {}).value?.trim() || "";

      const combined = (recallInputs.p1 + " " + recallInputs.p2 + " " + recallInputs.p3 + " " + recallInputs.p4).toLowerCase();
      const art = dailyBatch[currentIdx];
      lastHits = []; lastMisses = [];

      art.keywords.forEach(kw => {
        const tokens = kw.toLowerCase().split(/\s+/);
        const matched = tokens.some(t => t.length >= 2 && combined.includes(t));
        if (matched) lastHits.push(kw);
        else lastMisses.push(kw);
      });

      saveDayAttempt(getSelectedDateStr(), currentIdx, {
        inputs: { ...recallInputs }, hits: [...lastHits], misses: [...lastMisses], timestamp: Date.now()
      });

      stage = "diff";
      renderAll();
    } else if (action === "go-summary") { stage = "summary"; renderAll(); }
    else if (action === "lock-card") {
      const art = dailyBatch[currentIdx];
      const interval = lastMisses.length <= 2 ? 21 : (lastMisses.length <= 4 ? 7 : 1);
      const deck = getDeck();

      if (retestingCardId) {
        const oIdx = deck.findIndex(c => String(c.id) === String(retestingCardId));
        if (oIdx > -1) deck.splice(oIdx, 1);
        retestingCardId = null;
      }

      deck.unshift({
        id: Date.now(), title: art.title, source: art.source, link: art.link,
        paper: art.paper, subtopic: art.subtopic, context: art.context, prelims: art.prelims,
        anchors: art.anchors, keywords: art.keywords, mains: art.mains,
        userAttempt: { ...recallInputs }, misses: lastMisses, interval: interval,
        learnedDate: getSelectedDateStr(), dueDate: addDaysStr(getRealTodayStr(), interval)
      });
      saveDeck(deck);

      currentIdx += 1; stage = "study"; restoreAttempt(); renderAll();
    } else if (action === "restart") {
      currentIdx = 0; stage = "study"; restoreAttempt(); renderAll();
    } else if (action === "del-card") {
      const id = el.getAttribute("data-id");
      saveDeck(getDeck().filter(c => String(c.id) !== String(id)));
      renderDeckList();
    } else if (action === "retest") {
      const id = el.getAttribute("data-id");
      const card = getDeck().find(c => String(c.id) === String(id));
      if (card) {
        retestingCardId = card.id;
        dailyBatch[currentIdx] = card;
        recallInputs = card.userAttempt || { p1: "", p2: "", p3: "", p4: "" };
        stage = "recall";
        document.getElementById("viewStudy").style.display = "block";
        document.getElementById("viewDeck").style.display = "none";
        document.getElementById("tabBtnStudy").classList.add("active");
        document.getElementById("tabBtnDeck").classList.remove("active");
        renderAll();
      }
    } else if (action === "export-json") {
      const blob = new Blob([JSON.stringify(getDeck(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "upsc-recall-deck.json";
      a.click();
    }
  });

  // MIDNIGHT TIMER & AUTO-REFRESH
  let trackedDay = getRealTodayStr();
  function tickClock() {
    const now = new Date();
    const tmrw = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    const diff = Math.max(0, tmrw - now);
    const h = String(Math.floor(diff / 3600000)).padStart(2, "0");
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");
    const el = document.getElementById("midnightTimer");
    if (el) el.textContent = `${h}:${m}:${s}`;

    const cur = getRealTodayStr();
    if (cur !== trackedDay) {
      trackedDay = cur; dayOffset = 0; currentIdx = 0; stage = "study";
      loadArticlesForDate(true);
    }
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  tickClock();
  setInterval(tickClock, 1000);
  loadArticlesForDate(false);
})();
</script>
</body>
</html>
