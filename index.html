<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UPSC Super Recall — Live Dynamic Engine</title>
<meta name="theme-color" content="#050811">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050811;
  --bg-glow: radial-gradient(circle at 50% -10%, #132347 0%, #050811 65%);
  --card: rgba(15, 23, 42, 0.94);
  --card-sub: #121c33;
  --border: #22345a;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-dark: #0284c7;
  --good: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --gs1: #f43f5e;
  --gs2: #38bdf8;
  --gs3: #10b981;
  --gs4: #a855f7;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  background-image: var(--bg-glow);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.58;
  padding: 14px;
  min-height: 100vh;
}
.shell { max-width: 920px; margin: 0 auto; padding-bottom: 50px; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 15px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 14px;
}
.brand h1 {
  font-size: 1.32rem;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.02em;
  background: linear-gradient(90deg, #ffffff, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand p { margin: 2px 0 0; font-size: 0.76rem; color: var(--muted); }

.meta-cluster { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 700;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.35);
  color: #34d399;
}
.status-pill.syncing { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.35); color: var(--accent); }
.status-pill.offline { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35); color: #fbbf24; }
.dot {
  width: 7px; height: 7px; border-radius: 50%; background: currentColor;
  box-shadow: 0 0 8px currentColor; animation: pulse 1.8s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.clock-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem; font-weight: 700; padding: 5px 10px; border-radius: 999px;
  background: var(--card-sub); border: 1px solid var(--border); color: #fbbf24;
}

.nav-row {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
}
.tab-box { display: flex; background: var(--card); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
.tab-btn {
  background: transparent; border: none; color: var(--muted); font-weight: 700;
  font-size: 0.8rem; padding: 7px 14px; border-radius: 7px; cursor: pointer;
}
.tab-btn.active { background: var(--accent); color: #031322; }

.date-box { display: flex; align-items: center; gap: 6px; background: var(--card); padding: 4px 6px; border-radius: 10px; border: 1px solid var(--border); }
.mini-btn {
  background: var(--card-sub); border: 1px solid var(--border); color: var(--text);
  font-size: 0.74rem; font-weight: 700; padding: 5px 9px; border-radius: 6px; cursor: pointer;
}
.mini-btn:active { transform: scale(0.96); }
.date-text { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; font-weight: 700; padding: 0 6px; color: var(--accent); }

.prog-bar { display: flex; gap: 6px; margin-bottom: 14px; }
.prog-step {
  flex: 1; height: 6px; border-radius: 999px; background: var(--card-sub);
  border: 1px solid var(--border); cursor: pointer;
}
.prog-step.done { background: var(--good); border-color: var(--good); }
.prog-step.active { background: var(--accent); border-color: var(--accent); }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 22px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38); margin-bottom: 16px;
}
.card-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step-tag {
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 4px 9px; border-radius: 6px; background: rgba(56, 189, 248, 0.12);
  color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3);
}
.gs-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; font-weight: 800;
  padding: 3px 9px; border-radius: 6px;
}
.gs-badge.GS-1 { background: rgba(244, 63, 94, 0.16); color: #fda4af; border: 1px solid var(--gs1); }
.gs-badge.GS-2 { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid var(--gs2); }
.gs-badge.GS-3 { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid var(--gs3); }
.gs-badge.GS-4 { background: rgba(168, 85, 247, 0.16); color: #d8b4fe; border: 1px solid var(--gs4); }

.src-badge { font-size: 0.7rem; font-weight: 700; color: #cbd5e1; background: #1e293b; padding: 3px 8px; border-radius: 5px; border: 1px solid #334155; }
.mode-switch { display: inline-flex; background: #080d1a; padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
.mode-btn { background: transparent; border: none; color: var(--muted); font-size: 0.74rem; font-weight: 700; padding: 4px 10px; border-radius: 5px; cursor: pointer; }
.mode-btn.active { background: var(--card-sub); color: var(--accent); }

.art-title { font-size: 1.24rem; font-weight: 800; line-height: 1.36; margin: 0 0 14px; color: #fff; }
.box { background: var(--card-sub); border: 1px solid var(--border); border-radius: 11px; padding: 14px 16px; margin-bottom: 14px; }
.box-head {
  font-size: 0.69rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center;
}
ul.clean-ul { margin: 0; padding-left: 18px; }
ul.clean-ul li { margin-bottom: 7px; font-size: 0.91rem; }

.peg-group { margin-bottom: 12px; }
.peg-group label { display: block; font-size: 0.79rem; font-weight: 700; color: #93c5fd; margin-bottom: 5px; }
.peg-inp {
  width: 100%; background: #070c18; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; color: var(--text); font-family: inherit; font-size: 0.9rem;
}
.peg-inp:focus { outline: none; border-color: var(--accent); }
textarea.peg-inp { min-height: 68px; resize: vertical; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.primary-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #03111f;
  border: none; border-radius: 9px; padding: 12px 20px; font-size: 0.9rem; font-weight: 800; cursor: pointer;
}
.primary-btn:active { transform: scale(0.98); }
.secondary-btn {
  background: var(--card-sub); color: var(--text); border: 1px solid var(--border);
  border-radius: 9px; padding: 11px 16px; font-size: 0.84rem; font-weight: 700; cursor: pointer;
}

.kw-pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin: 3px 5px 3px 0; }
.kw-hit { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid var(--good); }
.kw-miss { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid var(--bad); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 620px) { .grid-2 { grid-template-columns: 1fr; } }

.banner {
  background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35);
  color: #7dd3fc; padding: 9px 13px; border-radius: 9px; font-size: 0.8rem; font-weight: 600; margin-bottom: 12px;
}
.deck-item {
  background: var(--card-sub); border: 1px solid var(--border); border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between;
  align-items: center; gap: 10px; flex-wrap: wrap;
}
.ext-link { color: var(--accent); text-decoration: none; font-size: 0.75rem; font-weight: 700; }
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>UPSC Super Recall</h1>
      <p>Live Dynamic News Articulator • 1–7–21 Spaced Memory Engine</p>
    </div>
    <div class="meta-cluster">
      <div class="status-pill syncing" id="liveBadge">
        <span class="dot"></span>
        <span id="liveText">Fetching Live News...</span>
      </div>
      <button class="mini-btn" data-action="force-live-sync">🔄 Sync Live</button>
      <div class="clock-pill" id="midnightTimer">00:00:00</div>
    </div>
  </header>

  <div class="nav-row">
    <div class="tab-box">
      <button class="tab-btn active" id="tabBtnStudy" data-action="switch-study">Live Daily Recall (5)</button>
      <button class="tab-btn" id="tabBtnDeck" data-action="switch-deck">Spaced Deck (<span id="deckCount">0</span>)</button>
    </div>
    <div class="date-box">
      <button class="mini-btn" data-action="day-prev">◀ Prev</button>
      <span class="date-text" id="dateDisplay">--</span>
      <button class="mini-btn" data-action="day-today">Today</button>
      <button class="mini-btn" data-action="day-next">Next ▶</button>
    </div>
  </div>

  <div id="bannerMount"></div>

  <div id="viewStudy">
    <div class="prog-bar" id="progStrip"></div>
    <div id="cardMount"></div>
  </div>

  <div id="viewDeck" style="display:none;">
    <div class="card">
      <div class="card-head">
        <h3 style="margin:0;font-size:1.1rem">Your Stored Attempts & Spaced Queue</h3>
        <button class="mini-btn" data-action="export-json">Export Attempts</button>
      </div>
      <p style="color:var(--muted);font-size:0.84rem;margin:0 0 14px;">
        Every live article you complete is stored here permanently with your recall score, missed keywords, and next review date.
      </p>
      <div id="deckListMount"></div>
    </div>
  </div>
</div>

<script>
(function() {
  // UPSC DOMAIN CLASSIFIER & DEEP STATIC KNOWLEDGE BASES
  const UPSC_DOMAINS = [
    {
      paper: "GS-2",
      name: "Polity, Constitution & Federalism",
      triggers: ["supreme court", "high court", "constitution", "article", "parliament", "bill", "act", "governor", "president", "election", "eci", "cag", "federal", "state", "bail", "remission", "tribunal", "collegium", "bench", "verdict", "justice", "plea", "petition", "law", "rights", "cbi", "ed", "panchayat", "municipal", "census", "delimitation"],
      deepInfo: {
        constitutionalPegs: "Articles 14, 19, 21, 50, 72, 124, 142, 200, 226, 324 & Basic Structure Doctrine (Kesavananda Bharati 1973).",
        commissions: "Sarkaria Commission (1988), Punchhi Commission (2010) & Second Administrative Reforms Commission (ARC).",
        coreIssue: "Balancing institutional autonomy with executive accountability and cooperative federalism."
      },
      prelimsAngle: "Verify exact Constitutional Articles, statutory vs constitutional status of bodies, and Supreme Court advisory jurisdiction (Article 143)."
    },
    {
      paper: "GS-2",
      name: "International Relations & Multilateral Diplomacy",
      triggers: ["india", "china", "usa", "russia", "pakistan", "nepal", "bangladesh", "maldives", "sri lanka", "un", "unsc", "wto", "who", "imf", "world bank", "brics", "quad", "g20", "asean", "indo-pacific", "treaty", "summit", "bilateral", "foreign", "border", "lac", "maritime", "envoy", "diplomat", "tariff", "sanction", "israel", "iran", "ukraine"],
      deepInfo: {
        constitutionalPegs: "Article 51 (Promotion of International Peace), Gujral Doctrine, SAGAR Vision & UNCLOS (1982) Maritime Law.",
        commissions: "National Security Council & Parliamentary Standing Committee on External Affairs.",
        coreIssue: "Navigating great-power rivalry through Strategic Autonomy, Multi-alignment, and Global South advocacy."
      },
      prelimsAngle: "Check member states of groupings, maritime chokepoints, international convention ratifications, and FTA/CEPA provisions."
    },
    {
      paper: "GS-3",
      name: "Indian Economy, Fiscal & Monetary Policy",
      triggers: ["rbi", "inflation", "gdp", "gst", "tax", "fiscal", "budget", "deficit", "repo", "monetary", "export", "import", "trade", "rupee", "forex", "bank", "npa", "sebi", "msme", "manufacturing", "pli", "agriculture", "msp", "farmer", "fertilizer", "subsidy", "infrastructure", "railway", "highway", "semiconductor", "startup"],
      deepInfo: {
        constitutionalPegs: "RBI Act 1934 (Section 45ZB MPC), FRBM Act 2003, Article 279A (GST Council) & Article 280 (Finance Commission).",
        commissions: "Fifteenth Finance Commission, Economic Advisory Council to PM (EAC-PM) & RBI Working Groups.",
        coreIssue: "Sustaining Capex-led growth, managing fiscal consolidation, and bridging the '3F Deficit' in local governance."
      },
      prelimsAngle: "Distinguish between Revenue vs Capital expenditure, Statutory Liquidity Ratio (SLR), Repo rate adjustments, and core inflation metrics."
    },
    {
      paper: "GS-3",
      name: "Environment, Biodiversity & Sustainable Tech",
      triggers: ["climate", "carbon", "emission", "renewable", "solar", "hydrogen", "ev", "wildlife", "tiger", "elephant", "bustard", "forest", "wetland", "ramsar", "pollution", "aqi", "plastic", "cop", "unfccc", "glacier", "monsoon", "cyclone", "disaster", "isro", "space", "satellite", "launch", "quantum", "biotech", "vaccine", "disease", "virus", "genome"],
      deepInfo: {
        constitutionalPegs: "Article 21 & 48A, Wildlife Protection Act 1972, Environment Protection Act 1986 & Panchamrit Climate Targets.",
        commissions: "National Board for Wildlife (NBWL), IPCC Assessment Reports & Central Pollution Control Board (CPCB).",
        coreIssue: "Reconciling green energy infrastructure expansion with endangered habitat preservation and CBDR-RC equity."
      },
      prelimsAngle: "Check IUCN Red List categories, Wildlife Protection Act Schedules, Ramsar wetland criteria, and satellite orbital parameters."
    },
    {
      paper: "GS-4",
      name: "Ethics, Integrity & Algorithmic Governance",
      triggers: ["ethics", "ai", "artificial intelligence", "deepfake", "algorithm", "privacy", "data protection", "cyber", "corruption", "lokpal", "transparency", "rti", "whistleblower", "empathy", "probity", "civil service", "conflict of interest", "social media", "censorship"],
      deepInfo: {
        constitutionalPegs: "Justice Puttaswamy (2017) 4-Fold Proportionality Test, DPDP Act 2023, RTI Act 2005 & Nolan 7 Principles.",
        commissions: "Second ARC Report on Ethics in Governance & Data Protection Board of India.",
        coreIssue: "Ensuring human-in-the-loop accountability, informational privacy, and moral integrity against digital opacity."
      },
      prelimsAngle: "Review statutory exemptions under Section 8 of the RTI Act and adjudicatory penalties under the DPDP Act."
    },
    {
      paper: "GS-1",
      name: "Indian Society, Demographics & Cultural Heritage",
      triggers: ["women", "gender", "caste", "tribe", "sc", "st", "obc", "urban", "migration", "slum", "heritage", "unesco", "temple", "archaeology", "asi", "classical", "language", "population", "fertility", "aging", "youth", "education", "literacy", "marital", "patriarchy", "care economy"],
      deepInfo: {
        constitutionalPegs: "Articles 14, 15, 16, 17, 21, 29, 30, 39, 46, 49 & 106th Constitutional Amendment Act.",
        commissions: "National Commission for Women, National Statistical Office (NSO) & NFHS Reports.",
        coreIssue: "Bridging social stratification, formalizing the care economy, and harnessing demographic dividend dividends."
      },
      prelimsAngle: "Verify demographic transition stages, UNESCO World Heritage criteria, and constitutional protections for Scheduled Tribes (Schedule V & VI)."
    }
  ];

  // STRICT STOPWORD BLACKLIST (Prevents pronouns, helper verbs, and noise like "why" from becoming keywords)
  const STOPWORDS = new Set([
    "the","and","for","that","with","from","this","have","has","had","were","was","are","will","would","could","should",
    "about","into","over","after","before","under","between","through","during","without","within","along","following",
    "india","indian","government","centre","state","states","minister","ministry","official","officials","said","says",
    "also","more","most","other","some","such","than","then","them","they","their","there","these","those","which","while",
    "where","when","what","who","whom","whose","year","years","time","today","week","month","report","reports","news",
    "explained","hindu","express","first","second","three","four","five","many","much","very","been","being","make","made",
    "why","how","does","did","can","not","due","take","takes","took","per","cent","percent","cent","crore","lakh","rs"
  ]);

  // OFFLINE BACKUP POOL (Used if offline)
  const OFFLINE_FALLBACK_BANK = [
    {
      title: "[Offline Mode] Delimitation Commission & Federal Representation Parity",
      source: "Offline Static Backup",
      link: "",
      paper: "GS-2",
      name: "Polity, Constitution & Federalism",
      keywords: ["Article 82", "Article 170", "84th Amendment", "2026", "Article 329", "Sarkaria"],
      context: "No live internet detected. Showing offline backup: Constitutional debate over post-2026 census seat readjustment and demographic transition parity.",
      prelims: [
        "Under Article 329(a), Delimitation Commission orders carry force of law and cannot be challenged in any court.",
        "84th Amendment Act (2001) froze total Lok Sabha seats until the first census conducted after 2026."
      ],
      anchors: [
        "Constitutional Linkage: Article 82 (Parliamentary reallocation) & Article 170 (State Legislative Assemblies).",
        "Supreme Court Precedent & Commissions: Sarkaria Commission (1988) & Punchhi Commission (2010).",
        "Core Administrative Dilemma: One-person-one-vote democratic parity vs penalizing states that stabilized population growth."
      ],
      mains: {
        intro: "Delimitation operationalizes proportional representation under Articles 82 and 170 while testing federal cohesion.",
        keywords: ["Asymmetrical Federalism", "Constitutional Freeze", "Demographic Penalty"],
        wayForward: "Freeze inter-state Lok Sabha ratios or expand Rajya Sabha federal checks to protect low-TFR states."
      }
    }
  ];

  // ARTICULATE LIVE ARTICLE WITH HIGH-YIELD UPSC STATIC LINKAGES & REFINED KEYWORDS
  function articulateLiveArticle(rawItem, index) {
    const rawTitle = (rawItem.title || "National Policy Update")
      .replace(/ - The Hindu| - Indian Express| \| Explained News| \| India News/gi, "")
      .trim();

    const cleanBody = (rawItem.content || rawItem.description || "")
      .replace(/<[^>]+>/g, " ")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\s+/g, " ")
      .trim();

    const fullText = rawTitle + ". " + cleanBody;
    const lowerText = fullText.toLowerCase();

    // 1. Classify GS Domain
    let domain = UPSC_DOMAINS[index % UPSC_DOMAINS.length];
    let maxScore = -1;
    for (let i = 0; i < UPSC_DOMAINS.length; i++) {
      let score = 0;
      const d = UPSC_DOMAINS[i];
      for (let j = 0; j < d.triggers.length; j++) {
        if (lowerText.includes(d.triggers[j])) {
          score += (rawTitle.toLowerCase().includes(d.triggers[j]) ? 5 : 2);
        }
      }
      if (score > maxScore) {
        maxScore = score;
        domain = d;
      }
    }

    // 2. Extract Sentences for Context
    const sentences = cleanBody
      .split(/(?<=[.?!])\s+/)
      .map(s => s.trim())
      .filter(s => s.length > 35 && s.length < 280);

    const contextSummary = sentences.length >= 2
      ? sentences.slice(0, 2).join(" ")
      : (cleanBody.length > 30 ? cleanBody.slice(0, 320) + "..." : rawTitle);

    // 3. Strict High-Yield Keyword Extraction (Removes "why", helper verbs, and noise)
    const extracted = [];
    const addCleanKw = (w) => {
      const clean = w.replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g, "").trim();
      const low = clean.toLowerCase();
      if (clean.length >= 3 && !STOPWORDS.has(low) && !/^\d+$/.test(clean)) {
        if (!extracted.some(k => k.toLowerCase() === low)) {
          extracted.push(clean);
        }
      }
    };

    // Extract exact Articles, Acts, Amendments, and proper capital entities
    const statutoryMatches = fullText.match(/\b(Article\s+\d+[A-Z]?|Section\s+\d+[A-Z]?|\d+(?:st|nd|rd|th)\s+Amendment|[A-Z][a-zA-Z]+\s+Act)\b/g) || [];
    statutoryMatches.forEach(m => addCleanKw(m));

    domain.triggers.forEach(trig => {
      if (lowerText.includes(trig) && extracted.length < 6) {
        addCleanKw(trig.charAt(0).toUpperCase() + trig.slice(1));
      }
    });

    const titleWords = rawTitle.split(/\s+/);
    titleWords.forEach(w => {
      if (/^[A-Z][a-zA-Z0-9-]{2,}$/.test(w) && extracted.length < 6) {
        addCleanKw(w);
      }
    });

    const fallbacks = ["Constitutionalism", "RuleOfLaw", "Accountability", "Federalism", "Sustainability"];
    let fIdx = 0;
    while (extracted.length < 5) {
      addCleanKw(fallbacks[fIdx++ % fallbacks.length]);
    }
    const finalKeywords = extracted.slice(0, 6);

    // 4. Deep Articulated Static Linkages
    const anchors = [
      `Constitutional & Statutory Base: ${domain.deepInfo.constitutionalPegs}`,
      `Institutional Precedents & Oversight: ${domain.deepInfo.commissions}`,
      `Core Governance Challenge: ${domain.deepInfo.coreIssue}`
    ];

    const prelimsTraps = [
      `UPSC Domain Check (${domain.paper}): ${domain.prelimsAngle}`,
      `Critical Entity Verification: Confirm the exact legal mandate, ministry oversight, and judicial review scope for "${finalKeywords[0]}" and "${finalKeywords[1]}".`
    ];

    const mainsSnippet = {
      intro: `Recent discourse surrounding "${rawTitle.slice(0, 70)}${rawTitle.length > 70 ? "..." : ""}" brings to focus crucial structural questions in ${domain.name}.`,
      keywords: [finalKeywords[0], finalKeywords[1], domain.paper],
      wayForward: `Institutionalize transparent statutory frameworks, reinforce adherence to the rule of law, and prioritize ${domain.deepInfo.coreIssue.toLowerCase()}`
    };

    return {
      id: "live_" + Date.now() + "_" + index,
      title: rawTitle,
      source: rawItem.sourceName || "Live National Feed",
      link: rawItem.link || "",
      paper: domain.paper,
      subtopic: domain.name,
      keywords: finalKeywords,
      context: contextSummary,
      prelims: prelimsTraps,
      anchors: anchors,
      mains: mainsSnippet
    };
  }

  // LIVE RSS FETCHERS
  const LIVE_RSS_FEEDS = [
    { name: "Indian Express Explained", url: "https://indianexpress.com/section/explained/feed/" },
    { name: "The Hindu National", url: "https://www.thehindu.com/news/national/feeder/default.rss" }
  ];

  async function fetchFeedViaRss2Json(feedObj) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6000);
    const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feedObj.url), { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error("status " + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.items) || !data.items.length) throw new Error("empty");
    return data.items.map(it => ({
      title: it.title || "", description: it.description || "", content: it.content || "",
      link: it.link || "", sourceName: feedObj.name
    }));
  }

  async function pullFreshLiveUpscArticles() {
    let rawPool = [];
    for (let i = 0; i < LIVE_RSS_FEEDS.length; i++) {
      try {
        const items = await fetchFeedViaRss2Json(LIVE_RSS_FEEDS[i]);
        rawPool = rawPool.concat(items.slice(0, 4));
      } catch (e) {}
      if (rawPool.length >= 6) break;
    }
    if (rawPool.length === 0) throw new Error("Offline");

    const seen = new Set();
    const filtered = rawPool.filter(item => {
      const t = (item.title || "").toLowerCase();
      if (t.length < 18 || /cricket|ipl|bollywood|horoscope|quiz/.test(t)) return false;
      const key = t.slice(0, 30);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    const selectedRaw = (filtered.length >= 5 ? filtered : rawPool).slice(0, 5);
    return selectedRaw.map((raw, idx) => articulateLiveArticle(raw, idx));
  }

  function getRealTodayStr() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  }

  function getSelectedDateStr() {
    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function addDaysStr(baseStr, days) {
    const p = baseStr.split("-").map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    d.setDate(d.getDate() + days);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function getDeck() {
    try { return JSON.parse(localStorage.getItem(DECK_KEY) || "[]"); } catch (e) { return []; }

  async function loadArticlesForDate(force = false) {
    const selDate = getSelectedDateStr();
    const realToday = getRealTodayStr();
    const dateEl = document.getElementById("dateDisplay");
    const bannerEl = document.getElementById("bannerMount");
    const mount = document.getElementById("cardMount");

    if (dateEl) dateEl.textContent = selDate + (dayOffset === 0 ? " (Today)" : "");

    let targetKey = selDate;
    if (selDate > realToday) {
      targetKey = realToday;
      bannerEl.innerHTML = `<div class="banner">⚡ Future Date Selected (${selDate}) — Showing Latest Live Feed (${realToday})</div>`;
    } else if (selDate < realToday) {
      bannerEl.innerHTML = `<div class="banner">📅 Historical Date (${selDate}) — Loading Archived Live Batch</div>`;
    } else {
      bannerEl.innerHTML = "";
    }

    if (!force) {
      const saved = localStorage.getItem(ARCHIVE_PREFIX + targetKey);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length >= 1) {
            dailyBatch = parsed;
            setStatusPill("", "Live Feed: Synced");
            restoreAttempt();
            renderAll();
            return;
          }

    setStatusPill("syncing", "Syncing Live RSS...");
    if (mount) {
      mount.innerHTML = `<div class="card" style="text-align:center;padding:40px 20px;">📡 <h3>Fetching Live Newspapers & Classifying GS Domains...</h3></div>`;
    }

    try {
      const cards = await pullFreshLiveUpscArticles();
      dailyBatch = cards;
      localStorage.setItem(ARCHIVE_PREFIX + targetKey, JSON.stringify(cards));
      setStatusPill("", "Live Feed: Active");
    } catch (err) {
      dailyBatch = JSON.parse(JSON.stringify(OFFLINE_FALLBACK_BANK));
      setStatusPill("offline", "Offline Backup Active");
      bannerEl.innerHTML = `<div class="banner" style="color:#fbbf24;border-color:#f59e0b;background:rgba(245,158,11,0.12);">⚠️ Offline Mode — Showing Backup Static Cards. Tap "🔄 Sync Live" when connected.</div>`;
    }

    restoreAttempt();
    renderAll();
  }

  function restoreAttempt() {

      mount.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);">No stored attempts yet. Complete any live article recall session to log it here.</div>`;

  // GLOBAL CLICK DELEGATION
  document.addEventListener("click", function(e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.getAttribute("data-action");

    if (action === "switch-study") {
      document.getElementById("viewStudy").style.display = "block";
      document.getElementById("viewDeck").style.display = "none";
      document.getElementById("tabBtnStudy").classList.add("active");
      document.getElementById("tabBtnDeck").classList.remove("active");
      renderAll();
    } else if (action === "switch-deck") {
      document.getElementById("viewStudy").style.display = "none";
      document.getElementById("viewDeck").style.display = "block";
      document.getElementById("tabBtnDeck").classList.add("active");
      document.getElementById("tabBtnStudy").classList.remove("active");
      renderDeckList();
    } else if (action === "force-live-sync") {
      currentIdx = 0; stage = "study"; loadArticlesForDate(true);
    } else if (action === "day-prev") {
      dayOffset -= 1; currentIdx = 0; stage = "study"; loadArticlesForDate(false);
    } else if (action === "day-next") {
      dayOffset += 1; currentIdx = 0; stage = "study"; loadArticlesForDate(false);
    } else if (action === "day-today") {
      dayOffset = 0; currentIdx = 0; stage = "study"; loadArticlesForDate(false);
    } else if (action === "jump") {
      const idx = parseInt(el.getAttribute("data-idx"), 10);
      if (!isNaN(idx)) { currentIdx = idx; stage = "study"; restoreAttempt(); renderAll(); }
    } else if (action === "mode-mains") { activeMode = "mains"; renderAll(); }
    else if (action === "mode-prelims") { activeMode = "prelims"; renderAll(); }
    else if (action === "go-recall") { stage = "recall"; renderAll(); }
    else if (action === "back-study") { stage = "study"; renderAll(); }
    else if (action === "next-art") { currentIdx += 1; stage = "study"; restoreAttempt(); renderAll(); }
    else if (action === "eval-recall") {
      recallInputs.p1 = (document.getElementById("peg1") || {}).value?.trim() || "";
      recallInputs.p2 = (document.getElementById("peg2") || {}).value?.trim() || "";
      recallInputs.p3 = (document.getElementById("peg3") || {}).value?.trim() || "";
      recallInputs.p4 = (document.getElementById("peg4") || {}).value?.trim() || "";

      const combined = (recallInputs.p1 + " " + recallInputs.p2 + " " + recallInputs.p3 + " " + recallInputs.p4).toLowerCase();
      const art = dailyBatch[currentIdx];
      lastHits = []; lastMisses = [];

      art.keywords.forEach(kw => {
        const tokens = kw.toLowerCase().split(/\s+/);
        const matched = tokens.some(t => t.length >= 2 && combined.includes(t));
        if (matched) lastHits.push(kw);
        else lastMisses.push(kw);
      });

      saveDayAttempt(getSelectedDateStr(), currentIdx, {
        inputs: { ...recallInputs }, hits: [...lastHits], misses: [...lastMisses], timestamp: Date.now()
      });

      stage = "diff";
      renderAll();
    } else if (action === "go-summary") { stage = "summary"; renderAll(); }
    else if (action === "lock-card") {
      const art = dailyBatch[currentIdx];
      const interval = lastMisses.length <= 2 ? 21 : (lastMisses.length <= 4 ? 7 : 1);
      const deck = getDeck();

      if (retestingCardId) {
        const oIdx = deck.findIndex(c => String(c.id) === String(retestingCardId));
        if (oIdx > -1) deck.splice(oIdx, 1);
        retestingCardId = null;
      }

      deck.unshift({
        id: Date.now(), title: art.title, source: art.source, link: art.link,
        paper: art.paper, subtopic: art.subtopic, context: art.context, prelims: art.prelims,
        anchors: art.anchors, keywords: art.keywords, mains: art.mains,
        userAttempt: { ...recallInputs }, misses: lastMisses, interval: interval,
        learnedDate: getSelectedDateStr(), dueDate: addDaysStr(getRealTodayStr(), interval)
      });
      saveDeck(deck);

      currentIdx += 1; stage = "study"; restoreAttempt(); renderAll();
    } else if (action === "restart") {
      currentIdx = 0; stage = "study"; restoreAttempt(); renderAll();
    } else if (action === "del-card") {
      const id = el.getAttribute("data-id");
      saveDeck(getDeck().filter(c => String(c.id) !== String(id)));
      renderDeckList();
    } else if (action === "retest") {
      const id = el.getAttribute("data-id");
      const card = getDeck().find(c => String(c.id) === String(id));
      if (card) {
        retestingCardId = card.id;
        dailyBatch[currentIdx] = card;
        recallInputs = card.userAttempt || { p1: "", p2: "", p3: "", p4: "" };
        stage = "recall";
        document.getElementById("viewStudy").style.display = "block";
        document.getElementById("viewDeck").style.display = "none";
        document.getElementById("tabBtnStudy").classList.add("active");
        document.getElementById("tabBtnDeck").classList.remove("active");
        renderAll();
      }
    } else if (action === "export-json") {
      const blob = new Blob([JSON.stringify(getDeck(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "upsc-recall-deck.json";
      a.click();
    }
  });

  // MIDNIGHT TIMER & AUTO-REFRESH
  let trackedDay = getRealTodayStr();
  function tickClock() {
    const now = new Date();
    const tmrw = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    const diff = Math.max(0, tmrw - now);
    const h = String(Math.floor(diff / 3600000)).padStart(2, "0");
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");
    const el = document.getElementById("midnightTimer");
    if (el) el.textContent = `${h}:${m}:${s}`;

    const cur = getRealTodayStr();
    if (cur !== trackedDay) {
      trackedDay = cur; dayOffset = 0; currentIdx = 0; stage = "study";
      loadArticlesForDate(true);
    }
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  tickClock();
  setInterval(tickClock, 1000);
  loadArticlesForDate(false);
})();
</script>
</body>
</html>
